name: Phase57 Real Net Expectancy OOS

on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-net-expectancy-objective.js'
      - 'predict/daytrade/phase57-real-net-expectancy-oos.js'
      - 'predict/daytrade/run-phase57-real-net-expectancy-oos.mjs'
      - 'predict/daytrade/phase57-adaptive-oos-signal-replay.js'
      - 'predict/daytrade/phase57-nested-adaptive-horizon.js'
      - 'predict/daytrade/phase57-adaptive-horizon-magnitude.js'
      - 'predict/tests/p21-4-net-expectancy-objective.test.mjs'
      - 'predict/tests/p21-4-real-net-expectancy-oos.test.mjs'
      - '.github/workflows/phase57-real-net-expectancy-oos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: measure-${{ matrix.scope }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope: [7203.T, 6758.T, 9984.T, 8306.T, 8035.T, COMBINED]
    defaults:
      run:
        working-directory: predict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install predict dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
      - name: Test P21.4 evidence integrity
        run: node --test tests/p21-4-net-expectancy-objective.test.mjs tests/p21-4-real-net-expectancy-oos.test.mjs
      - name: Run real historical 5m Net Expectancy OOS evidence
        env:
          PHASE57_SCOPE: ${{ matrix.scope }}
        run: node daytrade/run-phase57-real-net-expectancy-oos.mjs
      - name: Upload P21.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase57-real-net-expectancy-oos-${{ matrix.scope }}
          path: predict/artifacts/phase57-real-net-expectancy-oos-${{ matrix.scope }}.json
