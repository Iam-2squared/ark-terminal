name: Phase57 LONG Entry v2.1 Predevelopment Contract Integrity
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-msh-entry-v2-1-predevelopment.yml
      - predict/research/phase57-msh-entry-long-v2-1-predevelopment-contract-v1.json*
      - scripts/*phase57_msh_entry_v2_1_predevelopment.py
      - docs/evidence/phase57-msh-entry-long-v2-1-predevelopment/**
permissions:
  contents: read
jobs:
  static-contract-no-model-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static contract, frozen identity and metadata tests; no fit or prediction
        env:
          ARK_TEST_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/offline/kernel_exec.py python3 -m unittest scripts/test_phase57_msh_entry_v2_1_predevelopment.py
