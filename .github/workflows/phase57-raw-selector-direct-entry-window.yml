name: Phase57 Frozen30m Universe 5m Entry WATCH Audit
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-raw-selector-direct-entry-window.yml'
      - 'scripts/phase57_raw_selector_direct_entry_window.py'
      - 'scripts/test_phase57_raw_selector_direct_entry_window.py'
      - 'scripts/audit_phase57_raw_selector_direct_entry_window.py'
      - 'docs/evidence/phase57-raw-selector-direct-entry-v1/window-study/**'
permissions:
  contents: read
jobs:
  verify-first-validation:
    if: github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned offline evaluator dependencies
        run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 pandas==2.3.3
      - name: Causal window, snapshot identity, execution and Safety tests
        run: |
          set -o pipefail
          mkdir -p /tmp/raw-selector-window
          python scripts/offline/kernel_exec.py python -m unittest -v scripts.test_phase57_raw_selector_direct_entry_window 2>&1 | tee /tmp/raw-selector-window/targeted-tests.log
      - name: Saved model and decision audit with zero fit and zero outcome replay
        run: |
          python scripts/offline/kernel_exec.py python -m scripts.audit_phase57_raw_selector_direct_entry_window \
            --saved docs/evidence/phase57-raw-selector-direct-entry-v1/window-study/measurement \
            --out /tmp/raw-selector-window/integrity-audit.json
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline prediction regression
        run: python scripts/run_offline_regression.py --suite predict --output-dir /tmp/raw-selector-window/regression
      - name: Record exact HEAD and immutable first result
        env:
          RESEARCH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('/tmp/raw-selector-window')
          evidence=Path('docs/evidence/phase57-raw-selector-direct-entry-v1/window-study/measurement')
          audit=json.loads((root/'integrity-audit.json').read_text())
          regression=json.loads((root/'regression/regression.json').read_text())
          summary=json.loads((evidence/'summary.json').read_text())
          closure=json.loads((evidence.parent/'closure-manifest.json').read_text())
          for name,digest in closure['filePins'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          assert audit['status']==regression['status']=='PASS'
          assert 'Ran 13 tests' in (root/'targeted-tests.log').read_text()
          assert summary['status']=='FIRST_RAW_SELECTOR_DIRECT_ENTRY_MEASUREMENT_COMPLETE_HARD_FAIL'
          assert summary['training']['fitCalls']==summary['validationEvaluations']==1
          assert not summary['developmentTestOpened'] and not summary['freshOOSOpened']
          assert all(v is False for v in summary['safety'].values())
          receipt={'checkedHead':os.environ['RESEARCH_HEAD'],'runId':os.environ['GITHUB_RUN_ID'],
              'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'pr':587,'targetedTestsPassed':13,
              'regression':regression['suites'],'fitCallsInCI':0,'outcomeRemeasurementsInCI':0,
              'researchFitsTotal':1,'validationMeasurementsTotal':1,'developmentTestEvaluations':0,
              'freshOOSOpened':False,'candidateFreeze':False,'verdict':summary['status'],
              'safety':summary['safety'],'pins':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in
                  [evidence/'manifest.json',evidence/'model.json',evidence/'summary.json',evidence/'REPORT.md']}}
          (root/'final-ci-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-raw-selector-window-${{ github.event.pull_request.head.sha }}
          path: /tmp/raw-selector-window/
          if-no-files-found: error
          retention-days: 30
