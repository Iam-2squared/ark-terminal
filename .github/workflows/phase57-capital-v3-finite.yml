name: Phase57 Capital v3 Frozen Finite OOF
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - docs/evidence/phase57-capital-v3/CAPITAL_V3_LAUNCH.json
permissions:
  contents: read
  actions: read
concurrency:
  group: phase57-capital-v3-finite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-finite:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8
      - name: Verify one-time launch and successful zero-fit contract
        env:
          EXECUTION_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          p=pathlib.Path('docs/evidence/phase57-capital-v3/CAPITAL_V3_LAUNCH.json')
          x=json.loads(p.read_text())
          assert x['schema']=='phase57-capital-v3-launch-v1' and x['executionShaPolicy']=='THIS_LAUNCH_COMMIT'
          assert x['testedSourceSha']!=os.environ['EXECUTION_SHA'] and x['runAttempt']==1
          assert x['performanceInspectedBeforeLaunch'] is False and x['expectedFits']==16
          assert len(x['safety'])==9 and not any(x['safety'].values())
          for path,expected in x['testedSourceManifest'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==expected,path
          request=urllib.request.Request('https://api.github.com/repos/Iam-2squared/ark-terminal/actions/runs/'+str(x['contractRunId']),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response: ci=json.load(response)
          assert ci['conclusion']=='success' and ci['head_sha']==x['testedSourceSha']
          PY
      - name: Frozen R1 Entry
        uses: actions/download-artifact@v4
        with:
          name: phase57-all-material-r1-afb38b7a5421ca4f6ff6d439bf89096236efd119
          run-id: 36099497597
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-v3-r1
      - name: Pinned R50 terminal benchmark
        uses: actions/download-artifact@v4
        with:
          name: phase57-r50-result-36287943625
          run-id: 36287943625
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-v3-r50
      - name: Exactly two candidates x two arms x four temporal folds
        run: |
          python -m scripts.phase57_capital_v3 \
            --benchmark-ledger /tmp/phase57-v3-r50/R50_B_FAILED_RECOVERY-run-a.jsonl.gz \
            --r1-records /tmp/phase57-v3-r1/all-material-r1/ci-run-a/entry-records.json.gz \
            --mode finite --out /tmp/phase57-v3-result
      - name: Final safety and finite count
        env:
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/phase57-v3-result/report.json')
          x=json.loads(p.read_text())
          assert x['modelFits']==16 and len(x['fitManifest'])==16
          assert x['selection']['status'] in ('SELECT','NO_SELECTION_STOP')
          assert x['protectedOpened']==x['providerRequests']==0
          assert len(x['safety'])==9 and not any(x['safety'].values())
          pathlib.Path('/tmp/phase57-v3-result/execution-sha.txt').write_text(os.environ['EXECUTION_SHA']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-capital-v3-finite-16fit
          path: /tmp/phase57-v3-result/
          if-no-files-found: error
