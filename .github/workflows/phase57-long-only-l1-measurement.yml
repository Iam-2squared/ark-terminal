name: Phase57 LONG-only L1 Early Winner Measurement

on:
  workflow_dispatch:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-long-only-l1-measurement.yml

permissions:
  actions: read
  contents: read

jobs:
  measure-fixed-development-a-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_RUN_ID: 34917676944
      BASE_ARTIFACT: phase57-long-only-l0-replication-34917676944
      MINUTE_RUN_ID: 34926225832
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
      REPORT_ALGORITHM: RAW_PRICE_SCALE_CAUSAL_V3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download encrypted L0 base
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT }}
          path: ${{ runner.temp }}/base
          repository: Iam-2squared/ark-terminal
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download two encrypted Minute checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-l1-minute-shard-*-${{ env.MINUTE_RUN_ID }}
          path: ${{ runner.temp }}/shards
          merge-multiple: false
          repository: Iam-2squared/ark-terminal
          run-id: ${{ env.MINUTE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and mount one integrated private cache
        shell: bash
        run: |
          test -n "${JQUANTS_API_KEY:-}"
          test "$(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | wc -l)" = "2"
          jq -s '[.[].providerRequestsConsumedThisRun]|add' $(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | sort) > "$RUNNER_TEMP/retry-request-count.json"
          test "$(cat "$RUNNER_TEMP/retry-request-count.json")" -le 300
          jq -s '[.[] | (.completedSessions + .unavailableSessions)] | add' $(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | sort) > "$RUNNER_TEMP/accounted-session-count.json"
          test "$(cat "$RUNNER_TEMP/accounted-session-count.json")" = "20"
          test "$(jq -s 'map(.sessionListSha256)|unique|length' $(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | sort))" = "1"
          test "$(jq -r '.sessionListSha256' $(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | sort | head -1))" = "96b54f4a6110f7883c063f5896777a4148534c6ba9ecf2b455e6546bfb4ff975"
          jq -s '[.[].unavailable[]?.sessionDate] | unique' $(find "$RUNNER_TEMP/shards" -name acquisition-summary.json | sort) > "$RUNNER_TEMP/source-unavailable.json"
          cd "$RUNNER_TEMP/base"
          test "$(cut -d' ' -f1 private-cache.tar.gz.enc.sha256)" = "$(sha256sum private-cache.tar.gz.enc | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JQUANTS_API_KEY -in private-cache.tar.gz.enc -out "$RUNNER_TEMP/base.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/base.tar.gz"
          while IFS= read -r encrypted; do
            checksum="${encrypted}.sha256"
            test -f "$checksum"
            test "$(cut -d' ' -f1 "$checksum")" = "$(sha256sum "$encrypted" | cut -d' ' -f1)"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JQUANTS_API_KEY -in "$encrypted" \
              | tar -C "$RUNNER_TEMP/phase57-l0-cache" -xzf -
          done < <(find "$RUNNER_TEMP/shards" -name minute-shard.tar.gz.enc | sort)
      - name: Measure Development A
        run: |
          mkdir -p artifacts/phase57-long-only-l1
          node scripts/run_phase57_long_only_l1_from_cache.mjs --cache-root "$RUNNER_TEMP/phase57-l0-cache" --partition DEVELOPMENT_A --sessions-contract predict/long-only/phase57-long-only-l1-discovery-sessions.json --unavailable-sessions "$RUNNER_TEMP/source-unavailable.json" --output artifacts/phase57-long-only-l1/development-a-discovery-report.json
      - name: Add acquisition audit and purge raw
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/retry-request-count.json"; then cp "$RUNNER_TEMP/retry-request-count.json" artifacts/phase57-long-only-l1/retry-request-count.json; fi
          if test -f "$RUNNER_TEMP/source-unavailable.json"; then cp "$RUNNER_TEMP/source-unavailable.json" artifacts/phase57-long-only-l1/source-unavailable.json; fi
          rm -rf -- "$RUNNER_TEMP/phase57-l0-cache" "$RUNNER_TEMP/base.tar.gz" "$RUNNER_TEMP/base" "$RUNNER_TEMP/shards"
      - name: Upload sanitized L1 report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-long-only-l1-measurement-${{ github.run_id }}
          path: artifacts/phase57-long-only-l1/
          if-no-files-found: error
          retention-days: 21
