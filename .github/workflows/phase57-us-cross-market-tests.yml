name: Phase57 US Cross-Market Tests
on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-us-cross-market-policy.js'
      - 'scripts/build_phase57_us_universe.mjs'
      - 'scripts/fetch_phase57_us_massive_free.mjs'
      - 'scripts/fetch_phase57_us_free_reference.mjs'
      - 'scripts/fetch_phase57_us_free_5m.mjs'
      - 'scripts/measure_phase57_us_marketwide_5m.mjs'
      - 'scripts/evaluate_phase57_us_accuracy.mjs'
      - 'predict/tests/phase57-us-cross-market.test.mjs'
      - '.github/workflows/phase57-us-cross-market-tests.yml'
      - '.github/workflows/phase57-us-free-intraday-5m.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test predict/tests/phase57-us-cross-market.test.mjs
      - run: node --check scripts/build_phase57_us_universe.mjs && node --check scripts/fetch_phase57_us_massive_free.mjs && node --check scripts/fetch_phase57_us_free_reference.mjs && node --check scripts/fetch_phase57_us_free_5m.mjs && node --check scripts/measure_phase57_us_marketwide_5m.mjs && node --check scripts/evaluate_phase57_us_accuracy.mjs
      - name: Verify accuracy-only evaluator
        run: |
          mkdir -p tmp
          cat > tmp/us-trades.json <<'JSON'
          {"trades":[{"lane":"US_D50_FIXED","returnPct":1},{"lane":"US_D50_FIXED","returnPct":-0.5},{"lane":"US_D50_FIXED","returnPct":2}]}
          JSON
          node scripts/evaluate_phase57_us_accuracy.mjs --input tmp/us-trades.json --output tmp/us-accuracy.json >/dev/null
          node - <<'NODE'
          const x=require('./tmp/us-accuracy.json');
          if(x.currencyConversion!==false||x.capitalAllocation!==false) process.exit(1);
          if(x.lanes.US_D50_FIXED.n!==3) process.exit(1);
          if(!(x.lanes.US_D50_FIXED.netReturnPct>2.4&&x.lanes.US_D50_FIXED.netReturnPct<2.6)) process.exit(1);
          NODE
      - name: Verify free intraday diagnostic can be measured but never Fresh
        run: |
          mkdir -p tmp
          node - <<'NODE'
          const fs=require('fs');
          const universe=[]; const rows=[];
          for(let i=0;i<600;i++){
            const symbol=`T${String(i).padStart(4,'0')}`;
            universe.push({symbol});
            rows.push({symbol,currentPrice:10+i/100,volume:1000+i,dollarVolume:(10+i/100)*(1000+i),changePct:(i%11)-5,volumeRatio:1+(i%5)/10,barTimestamp:Date.now()-300000});
          }
          fs.writeFileSync('tmp/u.json',JSON.stringify({status:'US_FREE_COLLECTION_UNIVERSE',eligibleCount:600,universe}));
          fs.writeFileSync('tmp/s.json',JSON.stringify({provider:'YAHOO',plan:'FREE',freshRealtime:false,researchIntraday5m:true,formalFreshEligible:false,feedClassification:'FREE_INTRADAY_5M_DIAGNOSTIC',sessionDate:'2026-08-31',rows}));
          NODE
          node scripts/measure_phase57_us_marketwide_5m.mjs --universe tmp/u.json --snapshot tmp/s.json --output tmp/m.json >/dev/null
          node - <<'NODE'
          const m=require('./tmp/m.json');
          if(m.status!=='US_MARKETWIDE_5M_DIAGNOSTIC_MEASURED') process.exit(1);
          if(m.classification.fullFresh!==false||m.classification.formalOos!==false||m.classification.promotionEligible!==false) process.exit(1);
          if(m.selectedSymbols!==50||m.selectedV2Symbols!==30) process.exit(1);
          NODE
      - name: Verify free EOD evidence still cannot be mislabeled Fresh
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('scripts/measure_phase57_us_marketwide_5m.mjs','utf8');
          if(!p.includes('free provider data is not real-time')) process.exit(1);
          const c=fs.readFileSync('scripts/fetch_phase57_us_free_5m.mjs','utf8');
          for(const x of ['freshRealtime:false','formalFreshEligible:false','FREE_INTRADAY_5M_DIAGNOSTIC']) if(!c.includes(x)) process.exit(1);
          NODE
      - name: Safety boundary
        run: echo 'US validation is accuracy-only research; free intraday collection is diagnostic only; no broker, RSS order, Excel order, paper/live trading, promotion, or production update.'
