name: Phase57 P25 Autonomous Pipeline Audit

on:
  pull_request:
    paths:
      - '.github/workflows/phase57-p25-*.yml'
      - '.github/workflows/phase57-us-*.yml'
      - '.github/workflows/update-screener.yml'
      - '.github/workflows/home-paper-equity-daily.yml'
      - '.github/workflows/phase52-daily-persistence.yml'
      - '.github/workflows/phase57-realtime-live.yml'
      - '.github/workflows/phase57-lane-y-raw-capture.yml'
      - 'tools/archive_legacy_persistence_triggers.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-*.yml'
      - '.github/workflows/phase57-us-*.yml'
      - '.github/workflows/update-screener.yml'
      - '.github/workflows/home-paper-equity-daily.yml'
      - '.github/workflows/phase52-daily-persistence.yml'
      - '.github/workflows/phase57-realtime-live.yml'
      - '.github/workflows/phase57-lane-y-raw-capture.yml'
      - 'tools/archive_legacy_persistence_triggers.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify legacy persistence archive policy
        shell: bash
        run: |
          set -euo pipefail
          node tools/archive_legacy_persistence_triggers.mjs --check
          git diff --exit-code -- .github/workflows

      - name: Verify retained realtime automatic writers
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const realtime=fs.readFileSync('.github/workflows/phase57-realtime-live.yml','utf8');
          const laneY=fs.readFileSync('.github/workflows/phase57-lane-y-raw-capture.yml','utf8');
          must(/schedule:/.test(realtime),'Phase57 Realtime schedule missing');
          must(/schedule:/.test(laneY),'Lane Y raw capture schedule missing');
          must(realtime.includes('automation/phase57-realtime-live-data'),'Realtime durable branch missing');
          must(laneY.includes('automation/phase57-realtime-live-data'),'Lane Y durable branch missing');
          console.log('REALTIME_PERSISTENCE_KEEP_CHECK=PASS');
          NODE

      - name: Verify archived P25 research safety remains locked
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sources=[
            'predict/daytrade/phase57-p25-2c-prospective-preopen-universe-capture.js',
            'predict/daytrade/phase57-p25-intraday-dynamic-universe.js',
            'predict/daytrade/phase57-p25-exit-v3-independent-protocol.js',
          ].map(p=>fs.readFileSync(p,'utf8'));
          const keys=['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'];
          for(const source of sources) for(const key of keys){
            if(!new RegExp(`${key}\\s*:\\s*false`).test(source)) throw new Error(`safety lock not false: ${key}`);
          }
          console.log('P25_ARCHIVED_SAFETY_CHECK=PASS');
          NODE

      - name: Safety boundary
        run: echo 'Static persistence/safety audit only; no broker, Excel order, RSS order, paper, or live trading action is invoked.'
