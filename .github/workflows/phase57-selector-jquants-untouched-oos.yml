name: Phase57 Frozen Selector Untouched OOS

# The one-time Untouched OOS release completed in run 34039779876.
# The pull-request trigger is intentionally removed so later evidence commits
# cannot replay an already-consumed OOS as though it were untouched.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrity:
    if: github.event.pull_request.number == 577 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/phase57-selector-v1-v3-minimal-hybrid'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable contracts and frozen evidence bytes
        run: |
          (cd predict/research && sha256sum --check phase57-selector-jquants-fresh120-allocation.sha256)
          (cd predict/research && sha256sum --check phase57-selector-v3-freeze.sha256)
          (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-oos-release.sha256)
          (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-development-model.json.sha256)
          (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-development-freeze.json.sha256)
          (cd predict/research && sha256sum --check phase57-selector-jquants-fresh120-dataset-manifest.json.sha256)
          (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-fresh-validation.json.sha256)
      - name: Download immutable acquisition audits from the admitted Dataset run
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-fresh-shard-*-34031214529
          path: artifacts/phase57-oos-integrity-input
          run-id: 34031214529
          github-token: ${{ github.token }}
      - name: Recompute Hybrid Freeze and prove OOS was untouched
        env:
          INPUT_ROOT: artifacts/phase57-oos-integrity-input
        run: node scripts/verify_phase57_selector_jquants_oos_release.mjs
      - name: Run focused fail-closed tests
        run: node --test predict/tests/phase57-selector-jquants-oos-final.test.mjs
      - name: Upload OOS release gate
        uses: actions/upload-artifact@v4
        with:
          name: phase57-oos-integrity-${{ github.run_id }}
          path: artifacts/phase57-jquants-oos-integrity/
          if-no-files-found: error
          retention-days: 3

  oos:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: phase57-oos-integrity-${{ github.run_id }}
          path: artifacts/phase57-oos-integrity
      - name: Replay assigned Untouched OOS sessions with frozen selectors
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          INPUT_ROOT: artifacts/phase57-oos-integrity
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 3
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/evaluate_phase57_selector_jquants_oos_shard.mjs
      - name: Upload OOS-only results
        uses: actions/upload-artifact@v4
        with:
          name: phase57-oos-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/phase57-jquants-oos-shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 7

  final-summary:
    needs: oos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-oos-shard-*-${{ github.run_id }}
          path: artifacts/phase57-oos-results
      - name: Summarize frozen V1, V3 and Hybrid OOS
        env:
          INPUT_ROOT: artifacts/phase57-oos-results
          VALIDATION_PATH: predict/research/phase57-selector-minimal-hybrid-fresh-validation.json
        run: node scripts/summarize_phase57_selector_jquants_oos.mjs
      - name: Upload sanitized final OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase57-jquants-oos-final-${{ github.run_id }}
          path: artifacts/phase57-jquants-oos-final/
          if-no-files-found: error
          retention-days: 14
