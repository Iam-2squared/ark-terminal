name: Phase57 NEW LONG EXIT Profit Protection v3 FAST-FAIL
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-new-long-exit-profit-protection-v3-fast-fail.yml'
      - 'scripts/*phase57_new_long_exit_profit_protection_v3_fast_fail*'
      - 'docs/evidence/phase57-new-long-exit-profit-protection-v3-contract-2026-09-18.md'
permissions: {contents: read}
jobs:
  profit-protection-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {ARK_TEST_OFFLINE: '1'}
        run: python3 scripts/offline/kernel_exec.py python3 -m unittest scripts.test_phase57_new_long_exit_profit_protection_v3_fast_fail
      - env: {ARK_TEST_OFFLINE: '1'}
        run: |
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_profit_protection_v3_fast_fail --out /tmp/pp3-a | tee /tmp/pp3.txt
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_profit_protection_v3_fast_fail --out /tmp/pp3-b >/tmp/pp3b.txt
          cmp /tmp/pp3-a/summary.json /tmp/pp3-b/summary.json
          cmp /tmp/pp3-a/ledger.json.gz /tmp/pp3-b/ledger.json.gz
          cmp /tmp/pp3-a/manifest.json /tmp/pp3-b/manifest.json
