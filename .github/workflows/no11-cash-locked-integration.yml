name: No1.1 Cash-only Locked Integration Checks

on:
  push:
    branches:
      - integration/no1-1-msii-cash-locked-v1
    paths:
      - 'integration/no1-1-msii/**'
      - '.github/workflows/no11-cash-locked-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Confirm no external broker tools used by test
        shell: bash
        run: |
          test -f integration/no1-1-msii/runtime/locked_intent.mjs
          test -f integration/no1-1-msii/runtime/safety_ledger.mjs
          test -f integration/no1-1-msii/runtime/account_gate.mjs
          test -f integration/no1-1-msii/tests/locked_pipeline.test.mjs
      - name: Run locked offline tests (Node preinstalled)
        shell: bash
        run: |
          node --version
          node --test integration/no1-1-msii/tests/*.test.mjs
      - name: Byte-exact Frozen Capital v5 synthetic bridge tests
        shell: bash
        run: |
          python3 -m unittest discover -s integration/no1-1-msii/tests -p 'test_capital_v5_shadow.py' -v
      - name: Original UI2 loopback server unit tests
        shell: bash
        run: |
          python3 -m unittest discover -s integration/no1-1-msii/ui -p 'test_ark_ui2_readonly_server.py' -v
      - name: Original UI2 HTML and overlay byte-identity check
        shell: bash
        run: |
          test "$(git hash-object integration/no1-1-msii/ui/public/index.html)" = ec79214fcc8ad9f200d7899ee562ed11b917b686
          test "$(git hash-object integration/no1-1-msii/ui/public/ark-readonly-overlay.js)" = b0f27e1ad0e62b24052ce839c9eac29f934a677f
      - name: Parse Windows PowerShell without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = Get-ChildItem 'integration/no1-1-msii/windows' -Filter '*.ps1'
          foreach ($source in $sources) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.ToString() }
              throw "POWERSHELL_PARSER_FAILED:$($source.Name)"
            }
          }
          Write-Host "POWERSHELL_STATIC_PARSE_PASS=$($sources.Count)"

  windows-powershell-51-parse:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify V3 SHA256 byte-identity after Windows Git checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='integration/no1-1-msii/windows/Ark-No11-CaptureReadOnly-v3-CANDIDATE.ps1'
          $expect='8B396BF22724ABBCA4BCEB7B93862AE46D40ACBDFE95B385F492E960E9F08DA3'
          $actual=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          if ($actual -cne $expect) { throw 'V3_CHECKOUT_HASH_MISMATCH' }
          Write-Host 'V3_WINDOWS_WORKTREE_SHA256_PIN_PASS=True'
      - name: Parse all Windows scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "WINDOWS_POWERSHELL_51_REQUIRED" }
          $files = @(Get-ChildItem 'integration/no1-1-msii/windows' -Filter '*.ps1')
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $source = [System.IO.File]::ReadAllText($file.FullName, [Text.Encoding]::UTF8)
            if ($source -match '[^\x00-\x7F]') {
              if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                throw "UTF8_BOM_REQUIRED_FOR_WINDOWS_PS51:$($file.Name)"
              }
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PS51_PARSE_ERROR:$($file.Name):$($errors[0])" }
          }
          Write-Host "WINDOWS_POWERSHELL_51_PARSE_PASS=$($files.Count)"
      - name: Exercise desktop capture mutex primitive (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mutex = [System.Threading.Mutex]::new($false, 'Local\ArkTerminal_No11_RSS_ReadOnly_CI')
          $acquired = $false
          try {
            $acquired = $mutex.WaitOne(0)
            if (-not $acquired) { throw 'NO11_MUTEX_TEST_BLOCKED' }
            Write-Host 'NO11_DESKTOP_MUTEX_CONSTRUCTOR_PASS'
          } finally {
            if ($acquired) { [void]$mutex.ReleaseMutex() }
            $mutex.Dispose()
          }
      - name: V3 isolated bulk capture offline test (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\integration\no1-1-msii\windows\Ark-No11-CaptureReadOnly-v3-CANDIDATE.ps1 -OfflineSelfTest
          if (-not $?) { throw 'NO11_V3_BULK_OFFLINE_SELFTEST_FAILED' }
      - name: Test RSS formula echo and strict error rejection (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\integration\no1-1-msii\windows\Test-No11RssStatusParser.ps1
          if (-not $?) { throw "RSS_FORMULA_ECHO_TEST_FAILED" }
