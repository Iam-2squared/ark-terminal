name: Phase57 R52 Continuation EXIT Preperformance Contract
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - scripts/phase57_exit_continuation_r52.py
      - scripts/test_phase57_exit_continuation_r52.py
      - docs/evidence/phase57-exit-continuation-r52/PREPERFORMANCE_SUPPORT_ADDENDUM.json
permissions:
  contents: read
  actions: read
concurrency:
  group: phase57-exit-r52-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  no-fit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: '.'
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8
      - name: Causality, frozen control, cash and accounting tests without fitting
        run: |
          mkdir -p /tmp/r52-contract
          python -m unittest -q scripts.test_phase57_exit_continuation_r52 scripts.test_phase57_capital_exit_integrated scripts.test_phase57_exit_winner_lifecycle_r50 2>&1 | tee /tmp/r52-contract/tests.log
      - name: Exact archived 24-session R50-A control parity
        run: python -m scripts.phase57_exit_continuation_r52 --mode control --out /tmp/r52-contract/control-parity.json
      - uses: actions/download-artifact@v4
        with:
          repository: Iam-2squared/ark-terminal
          run-id: 36251316248
          name: phase57-exit-gen3-r45-36251316248
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r45
      - name: Check 1,614 Entry IDs and 274,417 preperformance checkpoints
        run: |
          python -m scripts.phase57_exit_continuation_r52 --mode geometry --source "$RUNNER_TEMP/r45/gen3" --out /tmp/r52-contract/geometry.json
          python - <<'PY'
          import json,hashlib,pathlib,subprocess
          root=pathlib.Path('docs/evidence/phase57-exit-continuation-r52')
          old=json.loads((root/'PREPERFORMANCE_GEOMETRY.json').read_text())
          new=json.loads(pathlib.Path('/tmp/r52-contract/geometry.json').read_text())
          assert old==new and new['fits']==0 and new['candidatePerformanceRead'] is False
          pin=json.loads((root/'PRECOMMIT.json').read_text())
          assert hashlib.sha256((root/'PRECOMMIT.json').read_bytes()).hexdigest()==(root/'PRECOMMIT.sha256').read_text().strip()
          assert all(v is False for v in pin['safety'].values()) and len(pin['safety'])==9
          receipt={'executionSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'sourceSha256':hashlib.sha256(pathlib.Path('scripts/phase57_exit_continuation_r52.py').read_bytes()).hexdigest(),
                   'testSha256':hashlib.sha256(pathlib.Path('scripts/test_phase57_exit_continuation_r52.py').read_bytes()).hexdigest(),
                   'protocolSha256':(root/'PRECOMMIT.sha256').read_text().strip(),
                   'supportAddendumSha256':hashlib.sha256((root/'PREPERFORMANCE_SUPPORT_ADDENDUM.json').read_bytes()).hexdigest(),
                   'archivedControlIdentical':True,'entryCoverage':new['frozenEntries'],'modelFits':0,
                   'candidateReplays':0,'providerRequests':0,'protectedPartitionsOpened':0,'safety':pin['safety']}
          pathlib.Path('/tmp/r52-contract/receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-r52-contract-${{ github.sha }}
          path: /tmp/r52-contract/
          retention-days: 90
          if-no-files-found: error
