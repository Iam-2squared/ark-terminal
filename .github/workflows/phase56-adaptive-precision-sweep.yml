name: Phase56 Adaptive Precision Sweep
on:
  pull_request:
    paths:
      - 'predict/scripts/phase56-adaptive-precision-sweep.mjs'
      - '.github/workflows/phase56-adaptive-precision-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run adaptive precision sweep
        run: node predict/scripts/phase56-adaptive-precision-sweep.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase56-adaptive-precision-sweep
          path: phase56-adaptive-precision-sweep.json
