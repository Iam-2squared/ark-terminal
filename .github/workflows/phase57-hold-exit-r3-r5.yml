name: Phase57 HOLD EXIT R3-R5 Historical Walk-Forward

on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-hold-exit-r3-r5-walkforward.js'
      - 'predict/daytrade/run-phase57-hold-exit-r3-r5-historical.mjs'
      - 'predict/tests/phase57-hold-exit-r3-r5-walkforward.test.mjs'
      - '.github/workflows/phase57-hold-exit-r3-r5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run R3-R5 causal and safety guards
        run: node predict/tests/phase57-hold-exit-r3-r5-walkforward.test.mjs

  historical-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact pinned P24 canonical byte snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-pinned-history-pack.json
      - name: Measure canonical historical HOLD PROTECT EXIT research
        env:
          PHASE57_PINNED_HISTORY_PACK: /tmp/p25-pinned-history-pack.json
        run: node predict/daytrade/run-phase57-hold-exit-r3-r5-historical.mjs
      - name: Upload R3-R5 historical artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase57-hold-exit-r3-r5-historical
          path: artifacts/phase57-hold-exit-r3-r5-historical.json
          if-no-files-found: error
