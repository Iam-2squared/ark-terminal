name: Phase57 Selector Minimum Price 75 Impact
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-selector-min-price75.yml'
      - 'predict/long-only/phase57_long_selector_min_price75.py'
      - 'scripts/phase57_selector_min_price75*.py'
      - 'scripts/phase57_selector_min_price75_paths.mjs'
      - 'scripts/test_phase57_selector_min_price75.py'
permissions:
  actions: read
  contents: read

concurrency:
  group: phase57-min-price75-single-run
  cancel-in-progress: true

jobs:
  price75-impact:
    if: github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed aggregation libraries (no model library)
        run: pip install numpy==2.3.5 pandas==2.2.3
      - name: Dedicated gate and unchanged parent regression
        run: |
          python3 scripts/offline/kernel_exec.py python3 -m unittest -v scripts.test_phase57_selector_min_price75 scripts.test_phase57_new_long_entry_two_opportunity scripts.test_phase57_strict30_mae_attribution
          python3 scripts/offline/kernel_exec.py python3 scripts/test_phase57_long_only_corrected_measurement.py
          python3 scripts/offline/kernel_exec.py python3 scripts/test_phase57_long_only_eligibility_measurement.py
          python3 scripts/offline/kernel_exec.py python3 scripts/test_phase57_long_only_top5_hit_distribution.py
          python3 scripts/verify_phase57_long_only_frozen_selector_v1.py
          python3 scripts/verify_phase57_development_preservation.py
          python3 scripts/offline/kernel_exec.py node --test predict/tests/phase57-long-only-corrected-measurement.test.mjs predict/tests/phase57-long-only-top5-hit-evaluator.test.mjs
      - name: Download saved encrypted Development base
        uses: actions/download-artifact@v4
        with:
          name: phase57-long-only-l0-replication-34917676944
          path: ${{ runner.temp }}/hit-distribution-base
          repository: Iam-2squared/ark-terminal
          run-id: 34917676944
          github-token: ${{ github.token }}
      - name: Download saved L1 Minute checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-l1-minute-shard-*-34926225832
          path: ${{ runner.temp }}/hit-distribution-l1
          repository: Iam-2squared/ark-terminal
          run-id: 34926225832
          github-token: ${{ github.token }}
      - name: Download saved C+D Minute checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-l2-minute-shard-*-34936002178
          path: ${{ runner.temp }}/hit-distribution-l2
          repository: Iam-2squared/ark-terminal
          run-id: 34936002178
          github-token: ${{ github.token }}
      - name: Download saved additional Development checkpoints
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-v2-minute-shard-*-34964031692
          path: ${{ runner.temp }}/hit-distribution-v2
          repository: Iam-2squared/ark-terminal
          run-id: 34964031692
          github-token: ${{ github.token }}
      - name: Materialize exact embedded frozen weights (no fit)
        run: |
          mkdir -p "$RUNNER_TEMP/hit-distribution-weights"
          python3 - <<'PYCODE'
          import json,os,pathlib
          s=json.loads(pathlib.Path('predict/research/phase57-long-only-frozen-selector-v1.json').read_text())['freezePayload']['selectorSpecification']
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'hit-distribution-weights/l2-selector-freeze-report.json'
          p.write_text(json.dumps({'freeze':{'finalArtifact':s['model']['configuration'],'selectedFeatureNames':s['featureUniverse']['orderedNames']}}))
          PYCODE
      - name: Verify and mount existing private cache (no provider calls)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        shell: bash
        run: |
          test -n "${JQUANTS_API_KEY:-}"
          test "$(find "$RUNNER_TEMP/hit-distribution-l1" -name acquisition-summary.json | wc -l)" = 2
          test "$(find "$RUNNER_TEMP/hit-distribution-l2" -name acquisition-summary.json | wc -l)" = 4
          test "$(find "$RUNNER_TEMP/hit-distribution-v2" -name acquisition-summary.json | wc -l)" = 2
          mapfile -t summaries < <(find "$RUNNER_TEMP/hit-distribution-l1" -name acquisition-summary.json | sort)
          jq -s '[.[].unavailable[].sessionDate] | unique' "${summaries[@]}" > "$RUNNER_TEMP/hit-distribution-unavailable.json"
          test "$(jq length "$RUNNER_TEMP/hit-distribution-unavailable.json")" = 4
          cd "$RUNNER_TEMP/hit-distribution-base"
          test "$(cut -d' ' -f1 private-cache.tar.gz.enc.sha256)" = "$(sha256sum private-cache.tar.gz.enc | cut -d' ' -f1)"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JQUANTS_API_KEY -in private-cache.tar.gz.enc -out "$RUNNER_TEMP/hit-distribution-base.tar.gz"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/hit-distribution-base.tar.gz"
          while IFS= read -r encrypted; do
            test "$(cut -d' ' -f1 "${encrypted}.sha256")" = "$(sha256sum "$encrypted" | cut -d' ' -f1)"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JQUANTS_API_KEY -in "$encrypted" | tar -C "$RUNNER_TEMP/phase57-l0-cache" -xzf -
          done < <(find "$RUNNER_TEMP/hit-distribution-l1" "$RUNNER_TEMP/hit-distribution-l2" "$RUNNER_TEMP/hit-distribution-v2" -name minute-shard.tar.gz.enc | sort)
      - name: Reconstruct evaluator-only rows from saved Development (no fit)
        run: |
          python3 scripts/offline/kernel_exec.py node scripts/prepare_phase57_long_only_top5_hit_distribution.mjs \
            --cache-root "$RUNNER_TEMP/phase57-l0-cache" \
            --freeze-report "$RUNNER_TEMP/hit-distribution-weights/l2-selector-freeze-report.json" \
            --unavailable-sessions "$RUNNER_TEMP/hit-distribution-unavailable.json" \
            --output-dir "$RUNNER_TEMP/hit-distribution-private-datasets"
      - name: Fixed policy paired measurement and exact downstream audit
        run: |
          set -euo pipefail
          mkdir -p artifacts/min-price75
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_selector_min_price75 --dataset-dir "$RUNNER_TEMP/hit-distribution-private-datasets" --out artifacts/min-price75/selector
          python3 scripts/offline/kernel_exec.py node scripts/phase57_selector_min_price75_paths.mjs "$RUNNER_TEMP/phase57-l0-cache" artifacts/min-price75/selector/selector-ledger.json.gz artifacts/min-price75/new-paths.json.gz
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_selector_min_price75_downstream --source artifacts/min-price75/selector --paths artifacts/min-price75/new-paths.json.gz --out artifacts/min-price75/downstream
      - name: Deterministic regeneration and preservation
        run: |
          set -euo pipefail
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_selector_min_price75 --dataset-dir "$RUNNER_TEMP/hit-distribution-private-datasets" --out "$RUNNER_TEMP/price75-selector-repro"
          for file in selector-summary.json selector-ledger.json.gz selector-manifest.json; do
            cmp "artifacts/min-price75/selector/$file" "$RUNNER_TEMP/price75-selector-repro/$file"
          done
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_selector_min_price75_downstream --source artifacts/min-price75/selector --paths artifacts/min-price75/new-paths.json.gz --out "$RUNNER_TEMP/price75-downstream-repro"
          for file in downstream-summary.json entry-ledger.json.gz entry-decisions.json.gz downstream-manifest.json; do
            cmp "artifacts/min-price75/downstream/$file" "$RUNNER_TEMP/price75-downstream-repro/$file"
          done
          python3 scripts/verify_phase57_long_only_frozen_selector_v1.py
          python3 scripts/verify_phase57_development_preservation.py
          git diff --exit-code
      - name: Purge private inputs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/phase57-l0-cache" "$RUNNER_TEMP/hit-distribution-private-datasets" "$RUNNER_TEMP/hit-distribution-base.tar.gz" "$RUNNER_TEMP/hit-distribution-base" "$RUNNER_TEMP/hit-distribution-l1" "$RUNNER_TEMP/hit-distribution-l2" "$RUNNER_TEMP/hit-distribution-v2" "$RUNNER_TEMP/hit-distribution-weights"
      - name: Upload derived impact evidence (no raw provider cache)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-min-price75-${{ github.event.pull_request.head.sha }}
          path: artifacts/min-price75/
          if-no-files-found: error
          retention-days: 30
