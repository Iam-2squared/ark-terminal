name: Phase57 LONG-only Frozen Selector v1 Integrity

on:
  workflow_dispatch:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-long-only-frozen-selector-v1.yml
      - predict/research/phase57-long-only-frozen-selector-v1.json
      - docs/evidence/phase57-long-only-frozen-selector-v1-development-evidence.json
      - scripts/verify_phase57_long_only_frozen_selector_v1.py

permissions:
  contents: read

jobs:
  verify-frozen-selector-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable contract and aggregate evidence
        run: python scripts/verify_phase57_long_only_frozen_selector_v1.py

