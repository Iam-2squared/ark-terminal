name: Phase57 P25 Dynamic 5m Daily Bundle

on:
  schedule:
    - cron: '0 7 * * 1-5' # 16:00 JST weekdays
    - cron: '20 7 * * 1-5' # 16:20 JST recovery fallback
  workflow_dispatch:
    inputs:
      session_date:
        description: 'Session date YYYY-MM-DD; blank=current JST date. Historical missing buckets are never fabricated.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-dynamic5m-daily-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve session date
        shell: bash
        env:
          REQUESTED: ${{ inputs.session_date }}
        run: |
          set -euo pipefail
          date="${REQUESTED:-$(TZ=Asia/Tokyo date +%F)}"
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "SESSION_DATE=$date" >> "$GITHUB_ENV"
      - name: Skip if immutable daily bundle already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin automation/p25-dynamic5m-day-data:refs/remotes/origin/automation/p25-dynamic5m-day-data 2>/dev/null \
            && git cat-file -e "origin/automation/p25-dynamic5m-day-data:data/p25-dynamic5m-day/${SESSION_DATE}.json" 2>/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download all point-in-time measurement artifacts for the session
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dynamic-points
          run_ids="$({ gh run list --repo "$GH_REPO" --workflow phase57-p25-marketwide-5m-measurement.yml --branch main --status success --limit 100 --json databaseId --jq '.[].databaseId'; gh run list --repo "$GH_REPO" --workflow phase57-p25-marketwide-session-redundant.yml --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId'; } | sort -u)"
          test -n "$run_ids"
          count=0
          while read -r id; do
            [ -z "$id" ] && continue
            dir="/tmp/dynamic-points/run-$id"; mkdir -p "$dir"
            gh run download "$id" --repo "$GH_REPO" --dir "$dir" >/dev/null 2>&1 || true
            count=$((count+1))
          done <<< "$run_ids"
          echo "downloaded/inspected $count candidate runs"
      - name: Build exact daily selection timeline and post-close bars
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_p25_dynamic5m_daily_bundle.mjs --input-dir /tmp/dynamic-points --session-date "$SESSION_DATE" --output /tmp/p25-dynamic5m-day.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/p25-dynamic5m-day.json','utf8'));
          if(x.sessionDate!==process.env.SESSION_DATE||x.barsReady!==true)throw new Error('daily Dynamic5m bundle not ready');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(x.safety?.[k]!==false)throw new Error(`unsafe ${k}`);
          NODE
      - name: Persist immutable Dynamic 5m daily bundle
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ark Dynamic5m Daily Bot'
          git config user.email 'ark-dynamic5m-day@users.noreply.github.com'
          git fetch origin automation/p25-dynamic5m-day-data:refs/remotes/origin/automation/p25-dynamic5m-day-data || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/p25-dynamic5m-day-data; then git switch -C automation/p25-dynamic5m-day-data origin/automation/p25-dynamic5m-day-data; else git switch --orphan automation/p25-dynamic5m-day-data; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p data/p25-dynamic5m-day
          target="data/p25-dynamic5m-day/${SESSION_DATE}.json"
          test ! -e "$target"
          cp /tmp/p25-dynamic5m-day.json "$target"
          git add "$target" && git commit -m "Persist Dynamic5m point-in-time day $SESSION_DATE" && git push origin HEAD:automation/p25-dynamic5m-day-data
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: phase57-p25-dynamic5m-daily-${{ env.SESSION_DATE }}
          path: /tmp/p25-dynamic5m-day.json
          retention-days: 90
      - name: Safety boundary
        if: always()
        run: echo 'Point-in-time selection archive + post-close read-only bars only; no backfill of missing intraday buckets and no trading writes.'
