name: Phase57 P23.10H Direction Setup Management Holdout

on:
  pull_request:
    branches:
      - phase57/p23-8d-frozen-exit-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direction-management-shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 0
            symbols: 1333.T,1721.T,1911.T,1963.T,2501.T,2503.T,2809.T,3038.T,3064.T,3436.T
          - shard: 1
            symbols: 4021.T,4042.T,4204.T,4503.T,4528.T,4684.T,4902.T,5101.T,5333.T,5706.T
          - shard: 2
            symbols: 5711.T,5801.T,5803.T,6113.T,6361.T,6479.T,6586.T,6724.T,6963.T,6988.T
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test frozen direction architecture
        run: node predict/tests/p23-10h-direction-setup-management.test.mjs
      - name: Remeasure paired baseline and direction setup manager
        env:
          PHASE57_SYMBOLS: ${{ matrix.symbols }}
          PHASE57_MIN_HISTORY_BARS: '1600'
          PHASE57_STEP_BARS: '3'
          PHASE57_MAX_CONTEXT_BARS: '2600'
        run: node predict/daytrade/run-phase57-p23-10h-direction-setup-holdout.mjs
      - name: Verify shard methodology and safety
        env:
          EXPECTED_SYMBOLS: ${{ matrix.symbols }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/phase57-p23-10h-direction-setup-holdout.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const expected=process.env.EXPECTED_SYMBOLS.split(',').sort();
          if(r.status!=='DIRECTION_SETUP_MANAGEMENT_PAIRED_HOLDOUT_COMPLETE') throw new Error('wrong status');
          if(JSON.stringify([...r.symbols].sort())!==JSON.stringify(expected)) throw new Error('shard symbol mismatch');
          if(!r.methodology?.fifthDisjointSymbolBasketFrozenBeforeOutcomeRetrieval) throw new Error('holdout not frozen');
          if(!r.methodology?.directionArchitectureFrozenBeforeHoldoutOutcomeRetrieval) throw new Error('direction architecture not frozen');
          if(r.methodology?.numericExitParameterSearch!==false) throw new Error('numeric exit search forbidden');
          if(r.methodology?.futureOutcomeUsedForSelection!==false) throw new Error('outcome selection leakage');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed','transmitted']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
          mv artifacts/phase57-p23-10h-direction-setup-holdout.json artifacts/phase57-p23-10h-direction-setup-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-10h-direction-setup-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-10h-direction-setup-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: direction-management-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-10h-direction-setup-shard-*
          path: artifacts/p23-10h-input
          merge-multiple: true
      - name: Aggregate exact paired exits
        env:
          PHASE57_ARTIFACT_ROOT: artifacts/p23-10h-input
        run: node predict/daytrade/aggregate-phase57-p23-10h-direction-setup.mjs
      - name: Verify aggregate methodology and safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/phase57-p23-10h-direction-setup-aggregate.json','utf8'));
          if(r.status!=='DIRECTION_SETUP_MANAGEMENT_PAIRED_HOLDOUT_AGGREGATED') throw new Error('wrong aggregate status');
          if(r.symbolCount!==30||r.shardCount!==3) throw new Error('aggregate universe mismatch');
          if(!r.methodology?.exactFifthHoldoutSymbolSet||!r.methodology?.directionArchitecturePreRegistered) throw new Error('methodology integrity failed');
          if(r.methodology?.numericExitParameterSearch!==false||r.methodology?.futureOutcomeUsedForSelection!==false) throw new Error('selection leakage');
          if(r.methodology?.untouchedTemporalOos!==false) throw new Error('must not mislabel temporal OOS');
          if(r.edgeClaimAllowed!==false||r.recommendationAllowed!==false||r.transmitted!==false) throw new Error('research-only flags violated');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-10h-direction-setup-management-holdout
          path: artifacts/phase57-p23-10h-direction-setup-aggregate.json
          if-no-files-found: error
