name: Phase57 P25 Marketwide 5m Redundant Session Collector

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-marketwide-session-redundant.yml'
  workflow_dispatch:
    inputs:
      session_part:
        description: 'MORNING or AFTERNOON'
        required: true
        default: 'MORNING'
        type: choice
        options: [MORNING, AFTERNOON]
  schedule:
    - cron: '58 23 * * 0-4' # 08:58 JST Mon-Fri primary morning kickoff
    - cron: '3 0 * * 1-5'   # 09:03 JST Mon-Fri backup morning kickoff
    - cron: '28 3 * * 1-5'  # 12:28 JST Mon-Fri primary afternoon kickoff
    - cron: '33 3 * * 1-5'  # 12:33 JST Mon-Fri backup afternoon kickoff

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-marketwide-5m-redundant-${{ github.event.schedule || inputs.session_part || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve session half
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            part='${{ inputs.session_part }}'
          else
            hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ "$hm" -lt 1200 ]; then part='MORNING'; else part='AFTERNOON'; fi
          fi
          echo "SESSION_PART=$part" >> "$GITHUB_ENV"
          echo "SESSION_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
      - name: Avoid duplicate long-running collector
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          other="$(gh run list --repo "$GH_REPO" --workflow phase57-p25-marketwide-session-redundant.yml --status in_progress --limit 20 --json databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .databaseId" | head -n1 || true)"
          if [ -n "$other" ]; then
            echo "Another redundant session collector is already in progress: $other"
            echo "SKIP_DUPLICATE=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_DUPLICATE=false" >> "$GITHUB_ENV"
          fi
      - name: Collect independent point-in-time snapshots every five minutes
        if: env.SKIP_DUPLICATE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p tmp/redundant
          if [ "$SESSION_PART" = 'MORNING' ]; then
            start_hm=0900; end_hm=1130
          else
            start_hm=1230; end_hm=1530
          fi
          persist_point() {
            local dir="$1"
            local observed session_date stamp remote_dir path payload
            observed="$(node -p "require('./$dir/measurement.json').observedAt")"
            session_date="$(TZ=Asia/Tokyo date -d "$observed" +%F)"
            stamp="$(date -u -d "$observed" +%Y%m%dT%H%M%SZ)"
            remote_dir="data/p25-marketwide-5m/${session_date}/${stamp}"
            for spec in "measurement.json:$dir/measurement.json" "marketwide.ndjson:$dir/marketwide.ndjson"; do
              path="${spec%%:*}"; local_file="${spec#*:}"
              if gh api "repos/$GH_REPO/contents/$remote_dir/$path?ref=automation/p25-marketwide-5m-data" >/dev/null 2>&1; then
                echo "durable exists: $remote_dir/$path"
                continue
              fi
              payload="$(base64 -w0 "$local_file")"
              gh api --method PUT "repos/$GH_REPO/contents/$remote_dir/$path" \
                -f message="Persist redundant Dynamic5m point ${session_date} ${stamp} ${path}" \
                -f content="$payload" \
                -f branch='automation/p25-marketwide-5m-data' >/dev/null
            done
            echo "durably persisted redundant point=$remote_dir"
          }
          attempt=0; success=0
          while true; do
            hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ "$hm" -gt "$end_hm" ]; then break; fi
            now="$(date +%s)"; next="$(( (now + 299) / 300 * 300 ))"; wait="$((next-now))"
            [ "$wait" -gt 0 ] && sleep "$wait"
            hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ "$hm" -lt "$start_hm" ]; then continue; fi
            if [ "$hm" -gt "$end_hm" ]; then break; fi
            attempt=$((attempt+1)); stamp="$(date -u +%Y%m%dT%H%M%SZ)"; dir="tmp/redundant/$stamp"; mkdir -p "$dir"
            echo "[$stamp] redundant Dynamic5m attempt $attempt ($SESSION_PART)"
            if node scripts/fetch_p25_marketwide_5m_spark.mjs --output "$dir/marketwide.json" \
              && node scripts/capture_p25_marketwide_5m_snapshot.mjs --input "$dir/marketwide.json" --as-of "$(node -p "require('./$dir/marketwide.json').meta.observedAt")" --output "$dir/marketwide.ndjson" \
              && node scripts/measure_p25_intraday_dynamic_universe_snapshot.mjs --input "$dir/marketwide.json" --output "$dir/measurement.json"; then
              if persist_point "$dir"; then
                success=$((success+1))
              else
                echo "Durable persistence failed closed for $stamp"
                rm -f "$dir/measurement.json"
              fi
            else
              echo "Point failed closed; keeping no fabricated measurement for $stamp"
              rm -f "$dir/measurement.json"
            fi
          done
          echo "attempts=$attempt successes=$success"
          test "$success" -gt 0
      - name: Verify all retained measurements are marketwide and safe
        if: env.SKIP_DUPLICATE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const files=[];const walk=d=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.name==='measurement.json')files.push(p);}};walk('tmp/redundant');
          if(!files.length)throw new Error('no redundant measurements');
          for(const f of files){const x=JSON.parse(fs.readFileSync(f,'utf8'));if(x.status!=='MARKETWIDE_DYNAMIC_5M_MEASUREMENT_READY'||x.inputSymbols<3000)throw new Error(`invalid ${f}`);for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(x.safety?.[k]!==false)throw new Error(`unsafe ${k} in ${f}`);}
          console.log(`verified ${files.length} redundant point-in-time measurements`);
          NODE
      - uses: actions/upload-artifact@v4
        if: env.SKIP_DUPLICATE != 'true'
        with:
          name: phase57-p25-marketwide-5m-redundant-${{ env.SESSION_DATE }}-${{ env.SESSION_PART }}
          path: tmp/redundant
          retention-days: 90
      - name: Safety boundary
        if: always()
        run: echo 'Redundant point-in-time research capture only; append-only evidence, no broker/RSS/Excel/order/paper/live/promotion/production action.'
