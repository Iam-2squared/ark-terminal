name: Phase56 P11.5 Regime Specialists

on:
  pull_request:
    paths:
      - 'predict/scripts/phase56-p11-regime-specialists.mjs'
      - '.github/workflows/phase56-p11-regime-specialists.yml'
      - 'predict/models/phase47-real-training.js'
      - 'predict/chart/phase56-precision-search.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nested regime-specialist evaluation
        run: node predict/scripts/phase56-p11-regime-specialists.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase56-p11-regime-specialists
          path: phase56-p11-regime-specialists.json
