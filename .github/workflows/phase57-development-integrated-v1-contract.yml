name: Phase57 Development Integrated v1 Contract
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - scripts/phase57_development_integrated_v1.py
      - scripts/test_phase57_development_integrated_v1.py
      - scripts/phase57_integrated_v1_result_audit.py
      - .github/workflows/phase57-development-integrated-v1-contract.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-development-integrated-v1-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-and-preperformance-support:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch independently frozen R1 source
        uses: actions/download-artifact@v4
        with:
          name: phase57-all-material-r1-afb38b7a5421ca4f6ff6d439bf89096236efd119
          run-id: 36099497597
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r1-frozen
      - name: Fetch R50 terminal-hold control
        uses: actions/download-artifact@v4
        with:
          name: phase57-r50-result-36287943625
          run-id: 36287943625
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r50-control
      - name: Strict synthetic and frozen capital regression
        run: python -m unittest scripts.test_phase57_development_integrated_v1 scripts.test_phase57_development_integrated_v0 scripts.test_phase57_cash_capital_r34 scripts.test_phase57_cash_portfolio_r37
      - name: Frozen input identity and source support only
        run: |
          python -m scripts.phase57_development_integrated_v1 \
            --benchmark-ledger /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-a.jsonl.gz \
            --benchmark-ledger-b /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-b.jsonl.gz \
            --r1-records /tmp/phase57-r1-frozen/all-material-r1/ci-run-a/entry-records.json.gz \
            --preflight-only --out /tmp/phase57-v1-ci-receipt.json
      - name: Tested source and protocol manifest
        env:
          EXACT_TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          paths=[
            'docs/evidence/phase57-comprehensive-exit-v1/DEVELOPMENT_INTEGRATED_V1_PRECOMMIT.json',
            'scripts/phase57_development_integrated_v0.py',
            'scripts/phase57_development_integrated_v1.py',
            'scripts/phase57_integrated_v1_result_audit.py',
            'scripts/test_phase57_development_integrated_v0.py',
            'scripts/test_phase57_development_integrated_v1.py',
            'scripts/phase57_cash_capital_r34.py',
            'scripts/phase57_cash_portfolio_r37.py',
            '.github/workflows/phase57-development-integrated-v1-contract.yml',
            '.github/workflows/phase57-development-integrated-v1-replay.yml']
          receipt=json.loads(pathlib.Path('/tmp/phase57-v1-ci-receipt.json').read_text())
          assert receipt['portfolioReplays']==receipt['modelFits']==receipt['protectedPartitionsOpened']==receipt['providerRequests']==0
          assert receipt['performanceInspected'] is False
          assert receipt['protocolSha256']=='cb4ad1f28471cf26c1ddd50453445323f132410d7a7e34cabffdcfaa8c56ad71'
          assert len(receipt['safety'])==9 and not any(receipt['safety'].values())
          manifest={x:hashlib.sha256(pathlib.Path(x).read_bytes()).hexdigest() for x in paths}
          pathlib.Path('/tmp/phase57-v1-ci-source-manifest.json').write_text(json.dumps({
            'testedSourceSha':os.environ['EXACT_TESTED_SHA'],
            'protocolSha256':receipt['protocolSha256'],'sourceManifest':manifest,
            'tests':'63 focused/regression unittest cases','portfolioReplays':0,
            'providerRequests':0,'protectedPartitionsOpened':0,'safety':receipt['safety']},
            sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-development-integrated-v1-contract-receipt
          path: |
            /tmp/phase57-v1-ci-receipt.json
            /tmp/phase57-v1-ci-source-manifest.json
          if-no-files-found: error
