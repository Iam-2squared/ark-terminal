name: No11 real Windows worker probe correction
on:
  push:
    branches: [fix/no11-week-resilience-20261108]
    paths:
      - "research/no11-morning-master-20261103/no11_nightly_resume_workeraware.py"
      - "research/no11-morning-master-20261103/install_no11_worker_probe_fix.py"
      - "research/no11-morning-master-20261103/test_no11_worker_probe_fix.py"
      - ".github/workflows/no11-worker-probe-fix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Versioned worker probe and immutable binding overlay
        shell: bash
        run: |
          set -euo pipefail
          root=research/no11-morning-master-20261103
          python -m unittest discover -s "$root" -p test_no11_worker_probe_fix.py -v
          python -m unittest discover -s "$root" -p test_no11_nightly_resume.py -v
          python -m unittest discover -s "$root" -p test_no11_resilience_install.py -v
          python -m unittest discover -s "$root" -p test_no11_completed_session_update.py -v
      - name: Parse actual embedded Windows CIM probe and validate bindings
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='research/no11-morning-master-20261103'
          & python -B -X utf8 -c "import sys,re,pathlib;sys.path.insert(0,'research/no11-morning-master-20261103');import no11_nightly_resume_workeraware as n;src=pathlib.Path(n.__file__).read_text();ps=src.split('    probe = r\x27\x27\x27',1)[1].split('\x27\x27\x27',1)[0];pathlib.Path('worker-probe-candidate.ps1').write_text(ps,encoding='utf-8')"
          if($LASTEXITCODE -ne 0){throw 'PROBE_SOURCE_EXTRACT_FAILED'}
          $tok=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'worker-probe-candidate.ps1'),[ref]$tok,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Host ('PROBE_PARSE_ERROR:'+ $_.Message)};throw 'PROBE_AST_FAILED'}
          Write-Host 'NO11_WORKER_PROBE_POWERSHELL_AST=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
