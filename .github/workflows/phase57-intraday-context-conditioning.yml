name: Phase57 Intraday Context-Conditioned OOS

on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-intraday-context-conditioning.js'
      - 'predict/daytrade/phase57-intraday-context-conditioning.test.js'
      - 'predict/daytrade/run-phase57-intraday-context-conditioning.mjs'
      - '.github/workflows/phase57-intraday-context-conditioning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: predict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install predict dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts; fi
      - name: Test P20.3 context conditioning
        run: node --test daytrade/phase57-intraday-context-conditioning.test.js
      - name: Run historical 5m context-conditioned nested OOS
        env:
          PHASE57_SYMBOLS: 7203.T,6758.T,9984.T,8306.T,8035.T
        run: node daytrade/run-phase57-intraday-context-conditioning.mjs
      - name: Upload P20.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase57-intraday-context-conditioning
          path: predict/artifacts/phase57-intraday-context-conditioning.json
