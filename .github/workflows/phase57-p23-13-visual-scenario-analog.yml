name: Phase57 P23.13 Visual Scenario Analog

on:
  pull_request:
    branches:
      - phase57/p23-8d-frozen-exit-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-source-shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 0
            symbols: 7203.T,6758.T,9984.T,8306.T,8035.T,6501.T,6861.T,6098.T,9432.T,9433.T
          - shard: 1
            symbols: 9983.T,4063.T,6367.T,6954.T,7011.T,8058.T,8001.T,8316.T,8411.T,8766.T
          - shard: 2
            symbols: 7741.T,7974.T,6902.T,7267.T,6594.T,4502.T,4519.T,2914.T,4661.T,6273.T
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test visual scenario analog core
        run: node predict/tests/p23-13-visual-scenario-analog.test.mjs
      - name: Rebuild frozen P23.12 causal visual records
        env:
          PHASE57_SYMBOLS: ${{ matrix.symbols }}
          PHASE57_MIN_HISTORY_BARS: '1600'
          PHASE57_STEP_BARS: '3'
          PHASE57_MAX_CONTEXT_BARS: '2600'
        run: node predict/daytrade/run-phase57-p23-12-visual-reasoning-dev.mjs
      - name: Verify source record methodology and safety
        env:
          EXPECTED_SYMBOLS: ${{ matrix.symbols }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/phase57-p23-12-visual-reasoning-dev.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          const expected=process.env.EXPECTED_SYMBOLS.split(',').sort();
          if(r.status!=='VISUAL_CHART_REASONING_DEVELOPMENT_MEASURED') throw new Error('wrong P23.12 source status');
          if(JSON.stringify([...r.symbols].sort())!==JSON.stringify(expected)) throw new Error('source symbol mismatch');
          if(r.methodology?.developmentUniverseOnly!==true || r.methodology?.freshHoldoutConsumed!==false) throw new Error('source development boundary violation');
          if(r.methodology?.futureOutcomesEvaluationOnly!==true || r.methodology?.visualScoreUsedAsEntryGate!==false) throw new Error('source methodology violation');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed','transmitted']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
          mv artifacts/phase57-p23-12-visual-reasoning-dev.json artifacts/phase57-p23-13-visual-source-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-13-visual-source-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-13-visual-source-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate-analog:
    needs: visual-source-shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-13-visual-source-shard-*
          path: artifacts/p23-13-input
          merge-multiple: true
      - name: Build causal visual-scenario analog predictions
        run: node predict/daytrade/aggregate-phase57-p23-13-visual-scenario-analog.mjs artifacts/p23-13-input
      - name: Verify causal analog methodology and safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/phase57-p23-13-visual-scenario-analog-development.json','utf8'));
          if(r.status!=='VISUAL_SCENARIO_CAUSAL_ANALOG_DEVELOPMENT_MEASURED') throw new Error('wrong P23.13 status');
          if(r.symbolCount!==30 || r.shardCount!==3) throw new Error('expected exact 30-symbol development universe');
          if(r.methodology?.sameSetupAnalogsOnly!==true || r.methodology?.sameSessionAnalogsExcluded!==true) throw new Error('scenario/causal filter violation');
          if(r.methodology?.candidateOutcomesMustBeFullyRealizedBeforeQuery!==true || r.methodology?.robustScalerFitCausalPoolOnly!==true) throw new Error('PIT analog violation');
          if(r.methodology?.outcomeLabelsNeverUsedInSimilarityDistance!==true || r.methodology?.futureOutcomeUsedForPredictionSelection!==false) throw new Error('outcome leakage violation');
          if(r.methodology?.predictionUsedAsEntryGate!==false || r.methodology?.thresholdSearchPerformed!==false) throw new Error('selection/gate violation');
          if(r.methodology?.freshCrossSymbolHoldoutConsumed!==false || r.methodology?.untouchedTemporalOos!==false) throw new Error('must remain development evidence');
          if(r.edgeClaimAllowed!==false || r.recommendationAllowed!==false || r.transmitted!==false) throw new Error('research-only flags violated');
          if(!(r.readyPredictionCount>0)) throw new Error('no ready visual scenario analog predictions');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-13-visual-scenario-analog-development
          path: artifacts/phase57-p23-13-visual-scenario-analog-development.json
          if-no-files-found: error
