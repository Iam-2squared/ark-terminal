name: Phase57 P23.42 Frozen Development Benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'predict/daytrade/run-phase57-p23-42-frozen-development-benchmark.mjs'
      - 'predict/daytrade/aggregate-phase57-p23-42-frozen-development-benchmark.mjs'
      - '.github/workflows/phase57-p23-42-frozen-development-benchmark.yml'
jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: 0
            symbols: '1605.T,1925.T,2502.T,2802.T,3382.T,3402.T,3659.T,4307.T,4452.T,4568.T'
          - id: 1
            symbols: '4901.T,5108.T,5401.T,5713.T,5802.T,6146.T,6178.T,6301.T,6326.T,6702.T'
          - id: 2
            symbols: '6723.T,6981.T,7182.T,7733.T,7751.T,7832.T,8801.T,9020.T,9101.T,9202.T'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Run frozen development benchmark
        env:
          PHASE57_SYMBOLS: ${{ matrix.symbols }}
        run: node predict/daytrade/run-phase57-p23-42-frozen-development-benchmark.mjs
      - name: Verify frozen-window methodology and safety
        run: node -e "const x=require('./artifacts/phase57-p23-42-frozen-development-benchmark.json');if(!x.methodology.fixedAbsoluteWindow||!x.methodology.sameRows||!x.methodology.priorSessionsOnly||x.methodology.freshHoldoutConsumed)throw Error('methodology');for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted'])if(x[k]!==false)throw Error(k);"
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-42-shard-${{ matrix.id }}
          path: artifacts/phase57-p23-42-frozen-development-benchmark.json
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-42-shard-*
          path: artifacts/p23-42-shards
      - name: Aggregate frozen benchmark
        run: node predict/daytrade/aggregate-phase57-p23-42-frozen-development-benchmark.mjs artifacts/p23-42-shards
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-42-frozen-development-benchmark-aggregate
          path: artifacts/phase57-p23-42-frozen-development-benchmark-aggregate.json
