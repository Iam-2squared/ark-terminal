name: Phase57 Dictionary Anatomy
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-dictionary-anatomy.yml'
      - 'scripts/phase57_dictionary_anatomy.py'
      - 'scripts/test_phase57_dictionary_anatomy.py'
permissions:
  contents: read
concurrency:
  group: phase57-dictionary-anatomy-v1
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARK_TEST_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 fastapi pytest httpx
      - name: Generate fixed-evidence diagnostic twice and verify expected manifest
        run: |
          python scripts/offline/kernel_exec.py python -m scripts.phase57_dictionary_anatomy --output "$RUNNER_TEMP/anatomy/diagnostic"
          python scripts/offline/kernel_exec.py python -m scripts.phase57_dictionary_anatomy --output "$RUNNER_TEMP/anatomy-replay"
          cmp "$RUNNER_TEMP/anatomy/diagnostic/manifest.json" "$RUNNER_TEMP/anatomy-replay/manifest.json"
          cmp "$RUNNER_TEMP/anatomy/diagnostic/manifest.json" docs/evidence/phase57-dictionary-anatomy-v1/expected-manifest.json
          test ! -e docs/evidence/phase57-dictionary-anatomy-v1/diagnostic
          cp -a "$RUNNER_TEMP/anatomy/diagnostic" docs/evidence/phase57-dictionary-anatomy-v1/diagnostic
      - name: Focused tests and full offline regression
        run: |
          set -o pipefail
          python scripts/offline/kernel_exec.py python -m unittest -v scripts.test_phase57_dictionary_anatomy scripts.test_phase57_expansion_data scripts.test_phase57_expansion_research scripts.test_phase57_research_dictionary_v0 scripts.test_phase57_dictionary_pit_recovery scripts.test_phase57_behavior_dictionary scripts.test_phase57_dictionary_prospective 2>&1 | tee "$RUNNER_TEMP/anatomy/focused.log"
          python scripts/run_offline_regression.py --output-dir "$RUNNER_TEMP/anatomy/regression"
          python scripts/verify_phase57_development_preservation.py
      - name: Record measured CI receipt
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'anatomy'
          log=(root/'focused.log').read_text()
          report=json.loads((root/'regression/regression.json').read_text())
          assert report['status']=='PASS'
          item={'status':'PASS','runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'sourceHead':os.environ['GITHUB_SHA'],'focusedTests':int(re.search(r'Ran (\d+) tests',log).group(1)),'regressionTests':sum(s['counts']['tests'] for s in report['suites']),'deterministicRegeneration':'TWO_RUNS_AND_EXPECTED_MANIFEST_IDENTICAL','originalEvidenceHashes':'UNCHANGED','newProviderRequests':0,'protectedPayloadReads':0,'entryExitTrials':0,'productionAllowed':False}
          (root/'ci-receipt.json').write_text(json.dumps(item,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-dictionary-anatomy-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/anatomy
          retention-days: 90
  preserve:
    needs: diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: phase57-dictionary-anatomy-${{ github.event.pull_request.head.sha }}
          path: docs/evidence/phase57-dictionary-anatomy-v1/ci-result
      - name: Preserve additive evidence on research branch only
        env:
          BRANCH: ${{ github.head_ref }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BRANCH" = research/phase57-long-only-cash-equity
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/phase57-dictionary-anatomy-v1/ci-result
          git commit -m 'Phase57: preserve fixed Dictionary anatomy CI and evidence'
          git push origin "HEAD:$BRANCH"
