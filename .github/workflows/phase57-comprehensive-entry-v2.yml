name: Phase57 Comprehensive Entry v2 One-Step Research
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-comprehensive-entry-v2.yml'
      - 'scripts/phase57_comprehensive_entry_v2.py'
      - 'scripts/report_phase57_comprehensive_entry_v2.py'
      - 'scripts/test_phase57_comprehensive_entry_v2.py'
      - 'scripts/audit_phase57_comprehensive_entry_v2.py'
      - 'docs/evidence/phase57-comprehensive-entry-v2/**'
permissions:
  contents: read
jobs:
  verify-entry-v2:
    if: github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned research dependencies
        run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 pandas==2.3.3
      - name: Causal one-step tests and immutable upstream regression
        run: |
          mkdir -p /tmp/comprehensive-entry-v2
          python scripts/offline/kernel_exec.py python -m unittest -v scripts.test_phase57_comprehensive_entry_v2 scripts.test_phase57_comprehensive_entry scripts.test_phase57_new_long_entry_two_opportunity scripts.test_phase57_selector_min_price75 scripts.test_phase57_new_long_exit_candidate_a scripts.test_phase57_new_long_exit_candidate_a_robustness 2>&1 | tee /tmp/comprehensive-entry-v2/targeted-tests.log
      - name: Saved models, ledger, source pins and gates audit without additional fit
        run: |
          set -euo pipefail
          python scripts/offline/kernel_exec.py python -m scripts.audit_phase57_comprehensive_entry_v2 --out /tmp/comprehensive-entry-v2/audit
          git diff --exit-code
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline prediction regression without Project fit
        run: python scripts/run_offline_regression.py --suite predict --output-dir /tmp/comprehensive-entry-v2/regression
      - name: Record exact checked head and immutable evidence hashes
        env:
          RESEARCH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('/tmp/comprehensive-entry-v2')
          audit = json.loads((root/'audit/audit.json').read_text())
          regression = json.loads((root/'regression/regression.json').read_text())
          assert audit['status'] == regression['status'] == 'PASS'
          assert 'Ran 68 tests' in (root/'targeted-tests.log').read_text()
          evidence = Path('docs/evidence/phase57-comprehensive-entry-v2')
          receipt = {'checkedHead': os.environ['RESEARCH_HEAD'], 'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'pr': 587, 'targetedTestsPassed': 68,
              'regression': regression['suites'], 'newResearchFits': 0, 'audit': audit['status'],
              'verdict': audit['verdict'], 'safety': audit['safety'], 'freshOOSOpened': False,
              'developmentTestOpened': False,
              'pins': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in
                  [evidence/'protocol.json', evidence/'measurement/manifest.json', evidence/'report/manifest.json', evidence/'closure-manifest.json']}}
          (root/'final-ci-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-comprehensive-entry-v2-${{ github.event.pull_request.head.sha }}
          path: /tmp/comprehensive-entry-v2/
          if-no-files-found: error
          retention-days: 30
