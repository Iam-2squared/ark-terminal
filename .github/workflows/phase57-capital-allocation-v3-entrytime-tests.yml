name: Phase57 Capital Allocation v3 Entry-Time Tests

on:
  pull_request:
    paths:
      - 'predict/research/phase57-capital-allocation-v3-entrytime-contract.json'
      - 'predict/research/phase57-capital-allocation-v3-phase-a-source.json'
      - 'predict/research/phase57-capital-allocation-v3-phase-a-structural.json'
      - 'scripts/lib/phase57-capital-allocation-v3-entrytime.mjs'
      - 'scripts/phase57-capital-allocation-v3-phase-a.mjs'
      - 'scripts/tests/phase57-capital-allocation-v3-entrytime.test.mjs'
      - 'scripts/tests/phase57-capital-allocation-v3-phase-a.test.mjs'
      - '.github/workflows/phase57-capital-allocation-v3-entrytime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/lib/phase57-capital-allocation-v3-entrytime.mjs
          node --check scripts/phase57-capital-allocation-v3-phase-a.mjs
      - name: Run Capital Allocation v3 entry-time tests
        run: node --test scripts/tests/phase57-capital-allocation-v3-entrytime.test.mjs scripts/tests/phase57-capital-allocation-v3-phase-a.test.mjs
      - name: Safety boundary
        if: always()
        run: |
          echo 'Research-only Entry-time Allocation Phase A.'
          echo 'No broker/RSS/Excel/order/paper/live execution, persistence, promotion, or production update.'
