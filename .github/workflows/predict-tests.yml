name: Predict Tests

on:
  pull_request:
    paths:
      - "predict/**"
      - "discovery/**"
      - "tools/**"
      - "real-account-home.js"
      - "service-worker.js"
      - ".github/workflows/predict-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prediction dependencies
        working-directory: predict
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Install RSS bridge test dependencies
        run: python -m pip install fastapi pytest httpx

      - name: Run prediction tests
        working-directory: predict
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee prediction-test-output.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("prediction-test-output.log").read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()
          failed = [index for index, line in enumerate(lines) if line.startswith("not ok ")]

          if failed:
              chunks = []
              for index in failed:
                  start = max(0, index - 3)
                  end = min(len(lines), index + 35)
                  chunks.append("\n".join(lines[start:end]))
              message = "\n\n".join(chunks)
          else:
              message = "\n".join(lines[-160:])

          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Prediction test failure::{message}")
          PY
          fi

          exit "$status"

      - name: Run discovery tests
        working-directory: discovery
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee discovery-test-output.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("discovery-test-output.log").read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()
          failed = [index for index, line in enumerate(lines) if line.startswith("not ok ")]

          if failed:
              chunks = []
              for index in failed:
                  start = max(0, index - 3)
                  end = min(len(lines), index + 35)
                  chunks.append("\n".join(lines[start:end]))
              message = "\n\n".join(chunks)
          else:
              message = "\n".join(lines[-160:])

          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Discovery test failure::{message}")
          PY
          fi

          exit "$status"

      - name: Run RSS bridge tests
        run: >-
          python -m pytest
          tools/test_phase18_rss_bridge.py
          tools/test_phase19_account_bridge.py
          tools/test_phase57_intraday_capture.py
