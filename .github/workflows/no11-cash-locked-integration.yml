name: No1.1 Cash-only Locked Integration Checks

on:
  push:
    branches:
      - integration/no1-1-msii-cash-locked-v1
    paths:
      - 'integration/no1-1-msii/**'
      - '.github/workflows/no11-cash-locked-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Confirm no external broker tools used by test
        shell: bash
        run: |
          test -f integration/no1-1-msii/runtime/locked_intent.mjs
          test -f integration/no1-1-msii/runtime/safety_ledger.mjs
          test -f integration/no1-1-msii/runtime/account_gate.mjs
          test -f integration/no1-1-msii/tests/locked_pipeline.test.mjs
      - name: Run locked offline tests (Node preinstalled)
        shell: bash
        run: |
          node --version
          node --test integration/no1-1-msii/tests/*.test.mjs
      - name: Original UI2 loopback server unit tests
        shell: bash
        run: |
          python3 -m unittest discover -s integration/no1-1-msii/ui -p 'test_ark_ui2_readonly_server.py' -v
      - name: Original UI2 HTML and overlay byte-identity check
        shell: bash
        run: |
          test "$(git hash-object integration/no1-1-msii/ui/public/index.html)" = ec79214fcc8ad9f200d7899ee562ed11b917b686
          test "$(git hash-object integration/no1-1-msii/ui/public/ark-readonly-overlay.js)" = b0f27e1ad0e62b24052ce839c9eac29f934a677f
