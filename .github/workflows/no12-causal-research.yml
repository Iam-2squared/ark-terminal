name: No12 Prospective Pre-BUY Synthetic Research

on:
  push:
    branches:
      - research/no12-prebuy-causal-runtime-20261011
    paths:
      - 'research/no12-prebuy-causal-runtime-20261011/**'
      - '.github/workflows/no12-causal-research.yml'
  pull_request:
    paths:
      - 'research/no12-prebuy-causal-runtime-20261011/**'
      - '.github/workflows/no12-causal-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no12-synthetic-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Fetch pinned safety comparison base for either push or PR event
        shell: bash
        run: |
          set -euo pipefail
          pinned=4110059f30e9e6b984946897a39df677b22df2f1
          if ! git cat-file -e "${pinned}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${pinned}"
          fi
          git cat-file -e "${pinned}^{commit}"
      - name: Verify original strategy Freeze was not modified
        shell: bash
        run: |
          set -euo pipefail
          test -f research/ark-integrated-no1-1-freeze-20261008/INTEGRATED_NO1_1_FREEZE.json
          git diff --exit-code 4110059f30e9e6b984946897a39df677b22df2f1 HEAD -- research/ark-integrated-no1-1-freeze-20261008/
          git diff --exit-code 4110059f30e9e6b984946897a39df677b22df2f1 HEAD -- integration/no1-1-msii/
      - name: Exercise market probe formula safety without Excel or broker (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./research/no12-prebuy-causal-runtime-20261011/windows/Probe-No12MarketRssChartReadOnly.ps1 -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'NO12_RSS_CHART_SELFTEST_FAILED' }
      - name: Exercise isolated 1M RSS formula without Excel or broker (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./research/no12-prebuy-causal-runtime-20261011/windows/Probe-No12MarketRss1mReadOnly.ps1 -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'NO12_RSS_1M_SELFTEST_FAILED' }
      - name: Check holiday-safe 3000-bar 1M archive formula without broker (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./research/no12-prebuy-causal-runtime-20261011/windows/Probe-No12MarketRss1mReadOnly.ps1 -OfflineSelfTest -ArchiveHistoricalOnly -HistoryBars 3000
          if ($LASTEXITCODE -ne 0) { throw 'NO11_RSS_1M_ARCHIVE_OFFLINE_SELFTEST_FAILED' }
      - name: Exercise RssMarket seconds source formula without Excel or broker (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./research/no12-prebuy-causal-runtime-20261011/windows/Probe-No12RssMarketSecondsReadOnly.ps1 -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'NO12_RSS_SECONDS_SELFTEST_FAILED' }
      - name: Exercise one-click Tuesday 5M 1M seconds sequence without broker (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & ./research/no12-prebuy-causal-runtime-20261011/windows/Run-No12TuesdayReadOnly.ps1 -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'NO12_TUESDAY_RUNNER_OFFLINE_FAILED' }
      - name: Test synthetic prebuy ranking and life-cycle on real Node runtime
        shell: bash
        run: |
          node --version
          node --test research/no12-prebuy-causal-runtime-20261011/tests/*.test.mjs
      - name: Validate source contains no Excel order writes, network or live enable
        shell: bash
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          import path from 'node:path';
          const d='research/no12-prebuy-causal-runtime-20261011/runtime';
          for(const p of fs.readdirSync(d)) {
            const src=fs.readFileSync(path.join(d,p),'utf8');
            if(/RssStockOrder\s*\(|RssCancelOrder\s*\(|fetch\s*\(|Excel\.Application|productionReady\s*:\s*true|orderTransmission\s*:\s*true|explicitSafetyReset\s*\(/i.test(src))throw Error('NO12_LIVE_OPERATION_FORBIDDEN:'+p);
          }
          console.log('NO12_ORDER_TRANSMISSION_FORBIDDEN_PASS=True');
          "
