name: No11 OneClick offline checks
on:
  pull_request:
    paths:
      - "research/no11-morning-master-20261103/oneclick_*"
      - "research/no11-morning-master-20261103/Start-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/automatic_morning.py"
      - "research/no11-morning-master-20261103/launcher_automatic_bridge_v4.py"
      - "research/no11-morning-master-20261103/test_no11_transport_blocked_reason_forwarding.py"
      - "research/no11-morning-master-20261103/install_no11_transport_error_forwarding.py"
      - "research/no11-morning-master-20261103/test_no11_transport_log_install.py"
      - "research/no11-morning-master-20261103/Request-No11Nov06AfternoonPreorder.ps1"
      - "research/no11-morning-master-20261103/test_automatic_price_exclusions.py"
      - "research/no11-morning-master-20261103/Recover-No11FilteredMorning.ps1"
      - "research/no11-morning-master-20261103/Repair-No11MorningRetrySeedDate.ps1"
      - "research/no11-morning-master-20261103/Start-No11AfternoonFilteredRecovery.ps1"
      - "research/no11-morning-master-20261103/Install-No11AfternoonFilteredRecovery.ps1"
      - "research/no11-morning-master-20261103/test_no11_afternoon_install_windows.ps1"
      - "research/no11-morning-master-20261103/Retry-No11OneClickPreorder.ps1"
      - "research/no11-morning-master-20261103/Install-No11OneClickPreorderRetry.ps1"
      - "research/no11-morning-master-20261103/patch_oneclick_preorder_retry.py"
      - "research/no11-morning-master-20261103/patch_local_clean_reference_20261105.py"
      - "research/no11-morning-master-20261103/Install-No11LocalCleanRetry.ps1"
      - "research/no11-morning-master-20261103/test_local_clean_reference_patch.py"
      - "research/no11-morning-master-20261103/patch_local_rot_pid_probe.py"
      - "research/no11-morning-master-20261103/Install-No11RotPidDiagnostics.ps1"
      - "research/no11-morning-master-20261103/test_local_rot_pid_probe.py"
      - "research/no11-morning-master-20261103/test_no11_rot_pid_install_windows.ps1"
      - "research/no11-morning-master-20261103/no11_selection_status.py"
      - "research/no11-morning-master-20261103/patch_oneclick_selection_display.py"
      - "research/no11-morning-master-20261103/Install-No11OneClickSelectionStatus.ps1"
      - "research/no11-morning-master-20261103/test_no11_selection_status.py"
      - "research/no11-morning-master-20261103/test_no11_selection_ui_patch.py"
      - "research/no11-morning-master-20261103/test_no11_selection_install_windows.ps1"
      - "research/no11-morning-master-20261103/fixtures/nov05_reference_original.ps1.txt"
      - "research/no11-morning-master-20261103/test_no11_local_clean_retry_windows.ps1"
      - "research/no11-morning-master-20261103/test_no11_oneclick_post1230_retry_windows.ps1"
      - "research/no12-prebuy-causal-runtime-20261011/windows/Capture-No11SessionReferenceReadOnly.ps1"
      - "research/no11-morning-master-20261103/test_no11_retry_gate_repair_windows.ps1"
      - "research/no11-morning-master-20261103/Apply-No11PriceExclusionRecovery.ps1"
      - "research/no11-morning-master-20261103/test_no11_filter_install_windows.ps1"
      - "research/no11-morning-master-20261103/Start-No11PreopenStandby.ps1"
      - "research/no11-morning-master-20261103/Apply-No11PreopenStandby.ps1"
      - "research/no11-morning-master-20261103/test_preopen_0830.py"
      - "research/no11-morning-master-20261103/Watch-No11OneClickTradeUi.ps1"
      - "research/no11-morning-master-20261103/Apply-No11OneClickUi2AutoOpen.ps1"
      - "research/no11-morning-master-20261103/test_oneclick_trade_ui.py"
      - "research/no11-morning-master-20261103/Install-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/Bootstrap-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/Update-No11OneClickTheme.ps1"
      - "research/no11-morning-master-20261103/Review-No11RecoveryReadOnly.ps1"
      - "research/no11-morning-master-20261103/no11_same_day_reconcile.py"
      - "research/no11-morning-master-20261103/nightly_workbook_compat.py"
      - "research/no11-morning-master-20261103/install_daily_cycle.py"
      - "research/no11-morning-master-20261103/Bootstrap-No11NightlyCycleFix.ps1"
      - "research/no11-morning-master-20261103/verify_oct26_legacy_code.mjs"
      - "research/no11-morning-master-20261103/Repair-No11Oct26HistoricalCodePin.ps1"
      - "research/no11-morning-master-20261103/Repair-No11Oct26CrlfCodePin.ps1"
      - "research/no11-morning-master-20261103/attest_oct26_win_checkout.mjs"
      - "research/no11-morning-master-20261103/test_nightly_workbook_compat.py"
      - ".github/workflows/no11-oneclick-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OneClick status contract (synthetic local files only)
        shell: bash
        run: |
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_status.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_installer_ui_guard.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_trade_ui.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_preopen_0830.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_automatic_price_exclusions.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_transport_blocked_reason_forwarding.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_transport_log_install.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_local_clean_reference_patch.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_local_rot_pid_probe.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_selection_status.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_selection_ui_patch.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_nightly_workbook_compat.py -v
          node research/no11-morning-master-20261103/verify_oct26_legacy_code.mjs --self-test
          node research/no11-morning-master-20261103/attest_oct26_win_checkout.mjs --self-test

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax for add-on and its installer
        shell: powershell
        run: |
          $root='research/no11-morning-master-20261103'
          foreach ($name in @('Start-No11OneClick.ps1','Retry-No11OneClickPreorder.ps1','Install-No11OneClickPreorderRetry.ps1','Install-No11LocalCleanRetry.ps1','Install-No11RotPidDiagnostics.ps1','Install-No11OneClickSelectionStatus.ps1','Recover-No11FilteredMorning.ps1','Repair-No11MorningRetrySeedDate.ps1','Start-No11AfternoonFilteredRecovery.ps1','Install-No11AfternoonFilteredRecovery.ps1','Apply-No11PriceExclusionRecovery.ps1','Start-No11PreopenStandby.ps1','Apply-No11PreopenStandby.ps1','Watch-No11OneClickTradeUi.ps1','Apply-No11OneClickUi2AutoOpen.ps1','Install-No11OneClick.ps1','Bootstrap-No11OneClick.ps1','Bootstrap-No11NightlyCycleFix.ps1','Repair-No11Oct26HistoricalCodePin.ps1','Repair-No11Oct26CrlfCodePin.ps1','Update-No11OneClickTheme.ps1','Review-No11RecoveryReadOnly.ps1','Request-No11Nov06AfternoonPreorder.ps1')) {
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ('PARSE_FAILED_'+$name)}
          }
      - name: Actually add read-only weekly/daily selection display to isolated WHITE OneClick
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_selection_install_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'WEEKLY_DAILY_SELECTION_UI_INSTALL_MOCK_FAILED'}
      - name: Actually install strict 2-sample PID diagnostic in isolated WHITE OneClick
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_rot_pid_install_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'STRICT_ROT_PID_INSTALL_FAILED'}
      - name: Actually install local Clean-compatible retry on isolated WHITE OneClick
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_local_clean_retry_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'NO11_CLEAN_MOCK_INSTALL'}
      - name: Actually install verified pre-order retry on isolated WHITE OneClick
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_oneclick_post1230_retry_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'ONECLICK_PREORDER_RETRY_INSTALL_TEST'}
      - name: Actually install afternoon recovery on isolated WHITE OneClick (no real Excel)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_afternoon_install_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'AFTERNOON_INSTALL_MOCK_FAILED'}
      - name: Actually repair stale seed date on isolated WHITE OneClick (no real Excel)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_retry_gate_repair_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'RETRY_GATE_MOCK_INSTALL_FAILED'}
      - name: Actually install 39-symbol fix on isolated WHITE OneClick (no real Excel)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no11-morning-master-20261103/test_no11_filter_install_windows.ps1
          if($LASTEXITCODE -ne 0){throw 'FILTER_MOCK_INSTALL_FAILURE'}
      - name: Offline OneClick selftests - no Excel or orders
        shell: powershell
        run: |
          $root='research/no11-morning-master-20261103'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Start-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'ONECLICK_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Retry-No11OneClickPreorder.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'PREORDER_RETRY_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11OneClickPreorderRetry.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'PREORDER_RETRY_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11LocalCleanRetry.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'CLEAN_LOCAL_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11RotPidDiagnostics.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'ROT_PID_DIAG_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11OneClickSelectionStatus.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'SELECTION_STATUS_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/no12-prebuy-causal-runtime-20261011/windows/Capture-No11SessionReferenceReadOnly.ps1 -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'REF_CAPTURE_3BOOK_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Recover-No11FilteredMorning.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'FILTERED_SAME_DAY_RETRY_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Repair-No11MorningRetrySeedDate.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'RETRY_GATE_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Start-No11AfternoonFilteredRecovery.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'AFTERNOON_WORKER_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11AfternoonFilteredRecovery.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'AFTERNOON_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Apply-No11PriceExclusionRecovery.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'FILTERED_REPAIR_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Start-No11PreopenStandby.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'PREOPEN_STANDBY_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Apply-No11PreopenStandby.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'PREOPEN_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Watch-No11OneClickTradeUi.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'UI2_WATCH_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Apply-No11OneClickUi2AutoOpen.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'UI2_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'INSTALLER_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Bootstrap-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'BOOTSTRAP_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Update-No11OneClickTheme.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'THEME_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Bootstrap-No11NightlyCycleFix.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'NIGHTLY_BOOTSTRAP_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Repair-No11Oct26HistoricalCodePin.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'OCT26_REPAIR_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Repair-No11Oct26CrlfCodePin.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'OCT26_CRLF_REPAIR_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Review-No11RecoveryReadOnly.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_REVIEW_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Request-No11Nov06AfternoonPreorder.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_REVIEW_SELFTEST'}
          & python -B -m py_compile (Join-Path $root 'no11_same_day_reconcile.py')
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_PYTHON_PARSE'}
