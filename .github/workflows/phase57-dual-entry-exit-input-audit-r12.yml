name: Phase57 Dual Entry EXIT Input Audit R12
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths: [.github/workflows/phase57-dual-entry-exit-input-audit-r12.yml]
permissions:
  contents: read
jobs:
  frozen-input-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d391907796e526e3eb63acd4959d9d317071316
          persist-credentials: false
      - name: Preserve allowlisted frozen source and already exposed Development inputs
        env:
          ARK_TEST_OFFLINE: '1'
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('.')
          out = pathlib.Path('artifacts/dual-entry-exit-input-r12')
          out.mkdir(parents=True, exist_ok=False)
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert source == '4d391907796e526e3eb63acd4959d9d317071316'
          freeze_path = 'docs/evidence/phase57-entry-all-material-v1/ENTRY_DUAL_FREEZE_R10.json'
          freeze = json.loads(pathlib.Path(freeze_path).read_text())
          assert freeze['selectorDenominator'] == 2155
          assert freeze['decision']['retain'] == ['IMMEDIATE','ALL_MATERIAL_R1_TEMPORAL_NESTED_OOF']
          assert freeze['decision']['noFurtherEntryOptimization'] is True
          required = [
            freeze_path,
            'docs/evidence/phase57-entry-all-material-v1/EXIT_CAPITAL_INTEGRATION_PLAN_R11.md',
            'docs/evidence/phase57-new-long-exit-candidate-a-contract-2026-09-18.md',
            'docs/evidence/phase57-state-conditioned-signal-entry-v1/measurement/baseline-immediate-records.json.gz',
            'docs/evidence/phase57-entry-timing-signal-census-v1/measurement/opportunity-records.json.gz',
            'docs/evidence/phase57-msh-entry-long-v2-development/paths.json.gz',
            'scripts/phase57_new_long_exit_candidate_a.py',
            'scripts/test_phase57_new_long_exit_candidate_a.py',
            'scripts/phase57_new_long_entry_exit_conditional.py',
            'scripts/phase57_new_long_exit_path_study.py',
            'scripts/phase57_state_conditioned_signal_entry_v1.py',
            'scripts/phase57_state_v3_9pattern_entry_v1.py',
            'scripts/phase57_entry_timing_signals.py',
            'scripts/phase57_entry_all_material_evaluator_v1.py',
            'scripts/phase57_entry_all_material_r1_data.py',
            'scripts/phase57_entry_all_material_r1_train.py',
            'scripts/phase57_long_capital_integration.py',
            'scripts/test_phase57_long_capital_integration.py',
            'predict/long-only/phase57_long_exit_continuation_v1.py',
            'predict/long-only/phase57_long_exit_development_final.py',
          ]
          optional = [
            'docs/evidence/phase57-entry-pattern-v2/protocol.json',
            'docs/evidence/phase57-entry-pattern-v2/ci-result/substrate/manifest.json',
            'docs/evidence/phase57-entry-pattern-v2/ci-result/substrate/raw-paths-evaluator-only.json.gz',
            'docs/evidence/phase57-entry-timing-signal-census-v1/protocol.json',
            'docs/evidence/phase57-entry-timing-signal-census-v1/measurement/manifest.json',
            'docs/evidence/phase57-state-conditioned-signal-entry-v1/POLICY_LOCK.json',
            'docs/evidence/phase57-state-conditioned-signal-entry-v1/measurement/manifest.json',
            'scripts/phase57_entry_extended.py',
            'scripts/phase57_long_exit_paired_paths.mjs',
            'scripts/prepare_phase57_long_exit_paired_audit.py',
            'scripts/phase57_long_capital_weights.mjs',
          ]
          manifest = {}; absent = []
          for name in required + optional:
            p = pathlib.Path(name)
            if not p.is_file():
              if name in required: raise FileNotFoundError(name)
              absent.append(name); continue
            data = p.read_bytes()
            manifest[name] = {'sha256':hashlib.sha256(data).hexdigest(), 'bytes':len(data)}
            dest = out/'source'/name
            dest.parent.mkdir(parents=True, exist_ok=True)
            dest.write_bytes(data)
          assert manifest['docs/evidence/phase57-msh-entry-long-v2-development/paths.json.gz']['sha256'] == '9b051b630c1e5ac59fac42f0da32830f38e07c48ded56a26e2dec4c054a4b7ba'
          safety = {k:False for k in ('executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted')}
          receipt = {'schemaVersion':'phase57-dual-entry-exit-input-r12','status':'INPUT_SNAPSHOT_ONLY_NOT_REPLAY_PASS','sourceHead':source,'dualFreezeCommit':'4878a1cc53430e816261dea0fb16aeb53b3c238d','files':manifest,'optionalAbsent':absent,'providerRequests':0,'newProtectedPartitionsOpened':0,'entryReoptimization':False,'policyChanges':False,'safety':safety}
          (out/'INPUT_RECEIPT.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':receipt['status'],'sourceHead':source,'files':len(manifest),'optionalAbsent':absent,'providerRequests':0,'safety':safety},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-dual-entry-exit-input-r12-${{ github.run_id }}
          path: artifacts/dual-entry-exit-input-r12
          retention-days: 30
          if-no-files-found: error
          overwrite: false
