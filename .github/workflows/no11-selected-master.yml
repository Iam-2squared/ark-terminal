name: No11 selected-master source contracts
on:
  push:
    branches: [research/no12-prebuy-causal-runtime-20261011]
    paths:
      - .github/workflows/no11-selected-master.yml
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_auto_master*.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_auto_master*.py
      - research/no12-prebuy-causal-runtime-20261011/windows/*SelectedMaster*.ps1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-master:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated public-workbook parser
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: xlrd==2.0.2
      - name: Offline contract tests without broker Excel or AI
        run: |
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p "test_no11_auto_master*.py" -v
      - name: Inspect public XLS format only
        if: matrix.os == 'ubuntu-latest'
        run: python -B research/no12-prebuy-causal-runtime-20261011/tools/no11_auto_master_source_probe.py
      - name: Parse Windows helpers without Excel
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'research/no12-prebuy-causal-runtime-20261011/windows/*SelectedMaster*.ps1' | ForEach-Object {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw 'SELECTED_MASTER_PS_PARSE_FAILED'}
          }
