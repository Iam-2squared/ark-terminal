name: Phase57 P25 Lane C Fixed Portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-lane-c-fixed-portfolio.yml'
      - 'scripts/run_p25_lane_c_fixed_portfolio.mjs'
      - 'scripts/package_p25_lane_c_fixed_portfolio.mjs'
      - 'predict/portfolio/phase57-p25-lane-c-fixed-checkpoint-runner.js'
      - 'predict/portfolio/phase57-p25-lane-c-fixed-persistence.js'
      - 'predict/portfolio/phase57-p25-lane-c-portfolio-simulator.js'
  workflow_run:
    workflows: ['Phase57 P25 Checkpointed Evaluation']
    types: [completed]
  schedule:
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful main-branch Phase57 P25 Checkpointed Evaluation run id; blank = latest successful run'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-lane-c-fixed-portfolio
  cancel-in-progress: false

jobs:
  fixed-portfolio:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve successful main-branch checkpointed evaluation
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            run_id="$EVENT_RUN_ID"
          elif [ -n "${REQUESTED_RUN_ID:-}" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            run_id="$(gh run list --repo "$GH_REPO" --workflow 'phase57-p25-checkpointed-evaluation.yml' --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          mapfile -t metadata < <(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion, .path, .head_branch')
          test "${#metadata[@]}" -eq 3
          test "${metadata[0]}" = 'success'
          test "${metadata[1]}" = '.github/workflows/phase57-p25-checkpointed-evaluation.yml'
          test "${metadata[2]}" = 'main'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact immutable inputs, captures, checkpoints, and formal evaluation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p25-lane-c-source /tmp/p25-lane-c-inputs/captures /tmp/p25-lane-c-checkpoints
          gh run download "$RUN_ID" --repo "$GH_REPO" --dir /tmp/p25-lane-c-source
          mapfile -t histories < <(find /tmp/p25-lane-c-source -type f -name history.json | sort)
          mapfile -t integrities < <(find /tmp/p25-lane-c-source -type f -name integrity.json | sort)
          mapfile -t lineages < <(find /tmp/p25-lane-c-source -type f -name lineage.json | sort)
          mapfile -t evaluations < <(find /tmp/p25-lane-c-source -type f -name p25-evaluation.json | sort)
          mapfile -t captures < <(find /tmp/p25-lane-c-source -type f -path '*/captures/*.json' | sort)
          mapfile -t checkpoints < <(find /tmp/p25-lane-c-source -type f -name 'checkpoint-*.json' | sort)
          test "${#histories[@]}" -eq 1
          test "${#integrities[@]}" -eq 1
          test "${#lineages[@]}" -eq 1
          test "${#evaluations[@]}" -eq 1
          test "${#captures[@]}" -gt 0
          test "${#checkpoints[@]}" -gt 0
          cp "${histories[0]}" /tmp/p25-lane-c-inputs/history.json
          cp "${integrities[0]}" /tmp/p25-lane-c-inputs/integrity.json
          cp "${lineages[0]}" /tmp/p25-lane-c-inputs/lineage.json
          cp "${evaluations[0]}" /tmp/p25-lane-c-inputs/source-evaluation.json
          for source in "${captures[@]}"; do
            target="/tmp/p25-lane-c-inputs/captures/$(basename "$source")"
            test ! -e "$target"
            cp "$source" "$target"
          done
          for source in "${checkpoints[@]}"; do
            target="/tmp/p25-lane-c-checkpoints/$(basename "$source")"
            test ! -e "$target"
            cp "$source" "$target"
          done
          test "$(find /tmp/p25-lane-c-inputs/captures -type f -name '*.json' | wc -l)" -eq "${#captures[@]}"
          test "$(find /tmp/p25-lane-c-checkpoints -type f -name 'checkpoint-*.json' | wc -l)" -eq "${#checkpoints[@]}"
      - name: Reconcile formal Fixed evidence and run causal portfolio matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_p25_lane_c_fixed_portfolio.mjs \
            --history-pack /tmp/p25-lane-c-inputs/history.json \
            --capture-dir /tmp/p25-lane-c-inputs/captures \
            --integrity-ledger /tmp/p25-lane-c-inputs/integrity.json \
            --lineage-manifest /tmp/p25-lane-c-inputs/lineage.json \
            --checkpoint-dir /tmp/p25-lane-c-checkpoints \
            --source-evaluation /tmp/p25-lane-c-inputs/source-evaluation.json \
            --output /tmp/p25-lane-c-fixed-portfolio.json
      - name: Build reviewable summary and compressed full-curve snapshot
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          node scripts/package_p25_lane_c_fixed_portfolio.mjs \
            --input /tmp/p25-lane-c-fixed-portfolio.json \
            --summary /tmp/p25-lane-c-fixed-portfolio-summary.json \
            --archive /tmp/p25-lane-c-fixed-portfolio.json.gz \
            --source-run-id "$SOURCE_RUN_ID"
          evidence_date="$(node -e "const x=require('/tmp/p25-lane-c-fixed-portfolio-summary.json'); process.stdout.write(String(x.evidenceDate||''))")"
          [[ "$evidence_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "EVIDENCE_DATE=$evidence_date" >> "$GITHUB_ENV"
      - name: Verify packaged artifact integrity and safety locks
        shell: bash
        run: |
          set -euo pipefail
          gzip -t /tmp/p25-lane-c-fixed-portfolio.json.gz
          archive_raw_sha="$(gzip -dc /tmp/p25-lane-c-fixed-portfolio.json.gz | sha256sum | cut -d' ' -f1)"
          node - "$archive_raw_sha" <<'NODE'
          const fs=require('fs');
          const summary=JSON.parse(fs.readFileSync('/tmp/p25-lane-c-fixed-portfolio-summary.json','utf8'));
          const archiveRawSha=process.argv[2];
          const variants=['FIXED_5','OLD_FIXED_30','DYNAMIC_30','DYNAMIC_40','DYNAMIC_50'];
          const profiles=['CURRENT_EXISTING','MAX_10','MAX_4','MAX_3','MAX_2'];
          const falseKeys=['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'];
          if(summary.status!=='LANE_C_FIXED_PORTFOLIO_PERSISTENCE_SUMMARY_READY')throw new Error('Lane C summary is not ready');
          if(JSON.stringify(summary.universeVariantOrder)!==JSON.stringify(variants))throw new Error('Lane C variant order changed');
          if(JSON.stringify(summary.profileOrder)!==JSON.stringify(profiles))throw new Error('Lane C profile order changed');
          if(summary.matrixRows?.length!==25||summary.matrixRows.some(row=>row.winnerEligible!==false))throw new Error('Lane C matrix interpretation lock failed');
          if(summary.methodology?.winnerSelectionAllowed!==false||summary.methodology?.dynamicManagementArtifactUsed!==false)throw new Error('Lane C methodology lock failed');
          if(archiveRawSha!==summary.fullArtifact?.rawSha256)throw new Error('Lane C gzip does not reproduce the raw artifact');
          for(const key of falseKeys)if(summary.safety?.[key]!==false)throw new Error(`unsafe Lane C flag: ${key}`);
          NODE
      - name: Persist immutable dated summary and full snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='automation/p25-lane-c-data'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch":refs/remotes/origin/"$branch"
            git switch -C "$branch" origin/"$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data/p25-lane-c/fixed
          summary_target="data/p25-lane-c/fixed/${EVIDENCE_DATE}.summary.json"
          archive_target="data/p25-lane-c/fixed/${EVIDENCE_DATE}.json.gz"
          if [ -e "$summary_target" ] || [ -e "$archive_target" ]; then
            test -f "$summary_target" -a -f "$archive_target"
            CURRENT_SUMMARY=/tmp/p25-lane-c-fixed-portfolio-summary.json EXISTING_SUMMARY="$summary_target" node - <<'NODE'
            const current=require(process.env.CURRENT_SUMMARY);
            const existing=require(`./${process.env.EXISTING_SUMMARY}`);
            for(const key of ['evidenceDate','lineageManifestHeadSha256','resultCanonicalSha256','sourceEvaluationCanonicalSha256']){
              if(current[key]!==existing[key])throw new Error(`immutable Lane C summary mismatch: ${key}`);
            }
            NODE
            gzip -t "$archive_target"
            existing_raw_sha="$(gzip -dc "$archive_target" | sha256sum | cut -d' ' -f1)"
            expected_raw_sha="$(node -e "const x=require('./$summary_target'); process.stdout.write(x.fullArtifact.rawSha256)")"
            test "$existing_raw_sha" = "$expected_raw_sha"
            echo 'same Lane C Fixed evidence already persisted; immutable no-op'
          else
            cp /tmp/p25-lane-c-fixed-portfolio-summary.json "$summary_target"
            cp /tmp/p25-lane-c-fixed-portfolio.json.gz "$archive_target"
            git add "$summary_target" "$archive_target"
            git commit -m "Phase57 P25 Lane C Fixed portfolio ${EVIDENCE_DATE}"
            git push origin HEAD:"$branch"
          fi
      - name: Upload raw and packaged Lane C Fixed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-lane-c-fixed-portfolio-${{ env.EVIDENCE_DATE }}
          path: |
            /tmp/p25-lane-c-fixed-portfolio.json
            /tmp/p25-lane-c-fixed-portfolio-summary.json
            /tmp/p25-lane-c-fixed-portfolio.json.gz
          retention-days: 90
      - name: Safety boundary
        run: |
          echo 'Research-only Lane C Fixed portfolio persistence using already-frozen Entry and unchanged Fixed-Horizon EXIT.'
          echo 'Current is reference-only; Max10 remains separate; no profile winner is selected.'
          echo 'No broker, Excel/RSS order write, MARKETSPEED order, board, Tick, paper/live trading, promotion, production update, transmission, or fresh holdout.'
