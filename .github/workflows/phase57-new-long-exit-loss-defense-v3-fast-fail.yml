name: Phase57 NEW LONG EXIT Loss Defense v3 FAST-FAIL
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-new-long-exit-loss-defense-v3-fast-fail.yml'
      - 'scripts/*phase57_new_long_exit_loss_defense_v3_fast_fail*'
      - 'docs/evidence/phase57-new-long-exit-v3-tail-boundary-contract-2026-09-18.md'
permissions: {contents: read}
jobs:
  loss-defense-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {ARK_TEST_OFFLINE: '1'}
        run: python3 scripts/offline/kernel_exec.py python3 -m unittest scripts.test_phase57_new_long_exit_loss_defense_v3_fast_fail
      - env: {ARK_TEST_OFFLINE: '1'}
        run: |
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_loss_defense_v3_fast_fail --out /tmp/ld3-a | tee /tmp/ld3.txt
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_loss_defense_v3_fast_fail --out /tmp/ld3-b >/tmp/ld3b.txt
          cmp /tmp/ld3-a/summary.json /tmp/ld3-b/summary.json
          cmp /tmp/ld3-a/ledger.json.gz /tmp/ld3-b/ledger.json.gz
          cmp /tmp/ld3-a/manifest.json /tmp/ld3-b/manifest.json
