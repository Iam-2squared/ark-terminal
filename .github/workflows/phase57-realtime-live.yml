name: Phase57 Realtime Stateful Live Measurement

on:
  workflow_dispatch:
    inputs:
      session_part:
        description: 'AUTO, MORNING, or AFTERNOON'
        required: true
        default: 'AUTO'
        type: choice
        options: [AUTO, MORNING, AFTERNOON]
  schedule:
    - cron: '55 23 * * 0-4' # 08:55 JST Mon-Fri
    - cron: '25 3 * * 1-5'  # 12:25 JST Mon-Fri fallback

permissions:
  contents: write
  actions: read

# Scheduled afternoon and the morning handoff must share one concurrency key.
# Otherwise both can write the durable data branch at the same time.
concurrency:
  group: phase57-realtime-live-${{ inputs.session_part || (github.event.schedule == '55 23 * * 0-4' && 'MORNING') || (github.event.schedule == '25 3 * * 1-5' && 'AFTERNOON') || 'AUTO' }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve causal session half
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.session_part }}'
          hm="$(TZ=Asia/Tokyo date +%H%M)"
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "$requested" != 'AUTO' ] && [ -n "$requested" ]; then
            part="$requested"
          elif [ "$hm" -le 1130 ]; then
            part='MORNING'
          else
            part='AFTERNOON'
          fi
          echo "SESSION_PART=$part" >> "$GITHUB_ENV"
          echo "SESSION_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"
          echo "Resolved $part for $(TZ=Asia/Tokyo date --iso-8601=seconds)"

      - name: Build exact pinned Frozen Entry and EXIT history pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-history.json

      - name: Prepare durable realtime data worktree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='automation/phase57-realtime-live-data'
          if git fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            git worktree add -B "$branch" /tmp/realtime-data "origin/$branch"
          else
            git branch "$branch" main
            git push origin "$branch"
            git worktree add -B "$branch" /tmp/realtime-data "$branch"
          fi
          cd /tmp/realtime-data
          git config user.name 'Ark Realtime Research Bot'
          git config user.email 'ark-realtime-research@users.noreply.github.com'
          mkdir -p \
            "data/phase57-realtime-live/$SESSION_DATE/points" \
            "data/phase57-realtime-live/$SESSION_DATE/raw" \
            "data/phase57-realtime-live/$SESSION_DATE/msii-envelopes"
          if [ -f "data/phase57-realtime-live/$SESSION_DATE/state.json" ]; then
            cp "data/phase57-realtime-live/$SESSION_DATE/state.json" /tmp/realtime-prior-state.json
            echo 'Restored same-session realtime state.'
          else
            rm -f /tmp/realtime-prior-state.json
            echo 'No same-session state: first committed point will be causal late-start if after 09:05.'
          fi

      - name: Run finalized 5m stateful measurement loop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          # Yahoo Japan public chart data is empirically ~15 minutes delayed intraday.
          # We therefore capture the selector snapshot at event time, durably queue it,
          # and only evaluate that immutable snapshot after its exact closed 5m bar has
          # become observable. This is delayed ingestion, not a post-close recomputation:
          # selection/entry/exit event time remains the original snapshot timestamp.
          SOURCE_DELAY_SECONDS=960
          # Lane M is intentionally paused while Lane Y is validated. Keep the capsule
          # adapter available for later, but never let it gate or alter Lane Y durability.
          LANE_M_CAPSULE_ENABLED=0
          if [ "$SESSION_PART" = 'MORNING' ]; then
            capture_start_hm=0905; capture_end_hm=1130; loop_end_hm=1150
          else
            capture_start_hm=1235; capture_end_hm=1530; loop_end_hm=1550
          fi
          mkdir -p /tmp/realtime-live
          attempts=0; successes=0; failures=0; captures=0
          data_root="/tmp/realtime-data/data/phase57-realtime-live/$SESSION_DATE"

          persist_data_branch(){
            cd /tmp/realtime-data
            git add "data/phase57-realtime-live/$SESSION_DATE"
            if ! git diff --cached --quiet; then
              git commit -m "$1"
              if ! git push origin HEAD:automation/phase57-realtime-live-data; then
                echo 'Realtime persistence push failed closed.'
                exit 1
              fi
            fi
            cd "$GITHUB_WORKSPACE"
          }

          export_msii_capsule(){
            state_file="$1"
            point_stamp="$2"
            envelope="$data_root/msii-envelopes/${point_stamp}.json"
            if [ -e "$envelope" ]; then
              echo "Immutable Lane M envelope already exists for $point_stamp; refusing overwrite."
              return 1
            fi
            actual_start="$(node -p "require('$state_file').liveMeasurement.startedAt")"
            if [ -z "$actual_start" ] || [ "$actual_start" = 'undefined' ] || [ "$actual_start" = 'null' ]; then
              echo 'Lane M envelope export blocked: missing immutable liveMeasurement.startedAt.'
              return 1
            fi
            predeclared_start="${SESSION_DATE}T09:05:00+09:00"
            node tools/phase57_export_msii_envelope.mjs \
              --state "$state_file" \
              --output "$envelope" \
              --predeclared-start-at "$predeclared_start" \
              --actual-start-at "$actual_start" \
              --missing-capture-count 0 \
              --initial-capital 1000000 \
              --reference-max-age-ms 5000 \
              --ttl-ms 5000 \
              --decision-latency-ms 100
            node -e "const e=require('$envelope'); const stamp=new Date(e.pointResult.at).toISOString().replace(/\.\d{3}Z$/,'Z').replace(/[-:]/g,''); if(stamp!=='$point_stamp') throw new Error('Lane M envelope timestamp mismatch '+stamp+' != $point_stamp'); if(e.methodology?.sourceDecisionAlreadyFrozen!==true||e.methodology?.futureOutcomeUsed!==false||e.backfillUsed!==false) throw new Error('Lane M envelope methodology invariant failed'); for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed']) if(e.safety?.[k]!==false) throw new Error('unsafe Lane M envelope '+k);"
          }

          process_eligible_raw(){
            now_epoch="$(date +%s)"
            for raw in $(find "$data_root/raw" -maxdepth 1 -type f -name '*.json' | sort); do
              observed="$(node -p "require('$raw').meta.observedAt")"
              observed_epoch="$(date -u -d "$observed" +%s)"
              age="$((now_epoch-observed_epoch))"
              if [ "$age" -lt "$SOURCE_DELAY_SECONDS" ]; then continue; fi
              point_stamp="$(date -u -d "$observed" +%Y%m%dT%H%M%SZ)"
              if [ -f "$data_root/points/${point_stamp}.json" ]; then continue; fi

              attempts=$((attempts+1))
              dir="/tmp/realtime-live/process-${point_stamp}"
              mkdir -p "$dir"
              cp "$raw" "$dir/marketwide.json"
              echo "[$point_stamp] evaluating immutable point-in-time snapshot after source publication delay (${age}s)"
              args=(
                --marketwide "$dir/marketwide.json"
                --history-pack /tmp/p25-history.json
                --output-state "$dir/state.json"
                --output-snapshot "$dir/snapshot.json"
                --output-postclose "$dir/postclose.json"
              )
              if [ -f /tmp/realtime-prior-state.json ]; then args+=(--state /tmp/realtime-prior-state.json); fi
              if node scripts/run_phase57_realtime_live_point.mjs "${args[@]}"; then
                if [ "$LANE_M_CAPSULE_ENABLED" = '1' ]; then
                  if ! export_msii_capsule "$dir/state.json" "$point_stamp"; then
                    failures=$((failures+1))
                    rm -f "$data_root/msii-envelopes/${point_stamp}.json"
                    echo "Optional Lane M capsule export failed; Lane Y point remains eligible for durable commit."
                  fi
                fi
                successes=$((successes+1))
                cp "$dir/state.json" /tmp/realtime-prior-state.json
                cp "$dir/state.json" "$data_root/state.json"
                cp "$dir/snapshot.json" "$data_root/latest.json"
                cp "$dir/snapshot.json" "$data_root/points/${point_stamp}.json"
                node -e "const fs=require('fs');const s=require('$dir/state.json');fs.writeFileSync('$data_root/ledger.json',JSON.stringify(s.ledger,null,2)+'\\n')"
                if [ -f "$dir/postclose.json" ]; then cp "$dir/postclose.json" "$data_root/postclose.json"; fi
                persist_data_branch "Persist Phase57 delayed-ingestion Lane Y realtime point $SESSION_DATE $point_stamp"
              else
                failures=$((failures+1))
                echo "Realtime point failed closed for immutable snapshot $point_stamp; retained raw evidence for retry."
              fi
            done
          }

          while true; do
            hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ "$hm" -gt "$loop_end_hm" ]; then break; fi
            now="$(date +%s)"
            next="$(( (now + 299) / 300 * 300 ))"
            wait="$((next-now))"
            [ "$wait" -gt 0 ] && sleep "$wait"
            hm="$(TZ=Asia/Tokyo date +%H%M)"
            if [ "$hm" -gt "$loop_end_hm" ]; then break; fi

            if [ "$hm" -ge "$capture_start_hm" ] && [ "$hm" -le "$capture_end_hm" ]; then
              stamp="$(date -u +%Y%m%dT%H%M%SZ)"
              dir="/tmp/realtime-live/capture-$stamp"
              mkdir -p "$dir"
              if node scripts/fetch_p25_marketwide_5m_spark.mjs --output "$dir/marketwide.json"; then
                observed="$(node -p "require('$dir/marketwide.json').meta.observedAt")"
                raw_stamp="$(date -u -d "$observed" +%Y%m%dT%H%M%SZ)"
                cp "$dir/marketwide.json" "$data_root/raw/${raw_stamp}.json"
                captures=$((captures+1))
                persist_data_branch "Queue Phase57 realtime raw snapshot $SESSION_DATE $raw_stamp"
              else
                failures=$((failures+1))
                echo "Marketwide capture failed closed at $stamp."
              fi
            fi

            process_eligible_raw
          done

          # Final drain for every raw snapshot whose provider-delay window has elapsed.
          process_eligible_raw
          echo "captures=$captures attempts=$attempts successes=$successes failures=$failures sourceDelaySeconds=$SOURCE_DELAY_SECONDS laneMCapsuleEnabled=$LANE_M_CAPSULE_ENABLED"
          test "$captures" -gt 0
          test "$attempts" -gt 0
          test "$successes" -gt 0
          test -f "$data_root/state.json"
          test -f "$data_root/latest.json"
          test -f "$data_root/ledger.json"

      - name: Hand off afternoon live measurement
        if: env.SESSION_PART == 'MORNING'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run phase57-realtime-live.yml --repo "$GH_REPO" --ref main -f session_part=AFTERNOON
          echo 'Dispatched causal AFTERNOON continuation; scheduled afternoon fallback shares the same concurrency key.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-realtime-live-${{ env.SESSION_DATE }}-${{ env.SESSION_PART }}
          path: /tmp/realtime-live
          if-no-files-found: ignore
          retention-days: 90

      - name: Safety boundary
        if: always()
        run: |
          echo 'Realtime research/shadow measurement only.'
          echo 'No broker write, Excel order write, RSS order function, paper/live trading, auto-promotion, or production update.'
