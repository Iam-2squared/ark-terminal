name: Phase57 Capital Rank v2 Contract
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - scripts/phase57_capital_rank_v2.py
      - scripts/test_phase57_capital_rank_v2.py
      - .github/workflows/phase57-capital-rank-v2-contract.yml
      - .github/workflows/phase57-capital-rank-v2-finite.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-capital-rank-v2-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  causal-preperformance:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3
      - name: Download frozen R1 Entry
        uses: actions/download-artifact@v4
        with:
          name: phase57-all-material-r1-afb38b7a5421ca4f6ff6d439bf89096236efd119
          run-id: 36099497597
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r1-frozen
      - name: Download pinned R50 terminal benchmark
        uses: actions/download-artifact@v4
        with:
          name: phase57-r50-result-36287943625
          run-id: 36287943625
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r50-control
      - name: Synthetic causal rank and frozen cash valuation regression
        run: python -m unittest scripts.test_phase57_capital_rank_v2 scripts.test_phase57_development_integrated_v1 scripts.test_phase57_development_integrated_v0 scripts.test_phase57_cash_capital_r34 scripts.test_phase57_cash_portfolio_r37
      - name: Source identity, 24 fold-arm supports, full NOW feature coverage, zero fits
        run: |
          python -m scripts.phase57_capital_rank_v2 \
            --benchmark-ledger /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-a.jsonl.gz \
            --r1-records /tmp/phase57-r1-frozen/all-material-r1/ci-run-a/entry-records.json.gz \
            --mode preflight --out /tmp/phase57-v2-contract-receipt.json
      - name: Tested source manifest and zero-exposure checks
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('/tmp/phase57-v2-contract-receipt.json')
          x=json.loads(p.read_text())
          assert x['protocolSha256']=='8b5f9eb1753a2967edd4991fc90bbff6e21898764d1fb13d3693572c72d335de'
          assert x['featureAuditSha256']=='556d5f29e0a54f8878ffb4ae6f87ddd4e79d03a047a5581907c123707501a053'
          assert x['modelFits']==x['portfolioReplays']==x['candidatePerformanceInspected']==x['protectedOpened']==x['providerRequests']==0
          assert x['fullFeatureRowsByArm']=={'IMMEDIATE':1150,'ALL_MATERIAL_R1_TEMPORAL_NESTED_OOF':1107}
          assert x['featureDimensions']==254 and all(len(y)==4 for y in x['support'].values())
          assert len(x['safety'])==9 and not any(x['safety'].values())
          paths=['docs/evidence/phase57-comprehensive-exit-v1/'+name for name in
                 ('CAPITAL_RANK_V2_PRECOMMIT.json','CAPITAL_RANK_V2_FEATURE_AUDIT.json','CAPITAL_RANK_V2_SCORING_WINDOW_ADDENDUM.json')]
          paths+=['scripts/phase57_capital_rank_v2.py','scripts/test_phase57_capital_rank_v2.py',
                  '.github/workflows/phase57-capital-rank-v2-contract.yml',
                  '.github/workflows/phase57-capital-rank-v2-finite.yml']
          paths+=list(json.loads(pathlib.Path(paths[0]).read_text())['inputs']['sha256ByPath'])
          m={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in sorted(set(paths))}
          pathlib.Path('/tmp/phase57-v2-ci-manifest.json').write_text(json.dumps({
              'testedSha':os.environ['TESTED_SHA'],'protocolSha256':x['protocolSha256'],
              'sourceManifest':m,'fullFeatureMatrixSha256':x['featureMatrixSha256'],
              'tests':76,'modelFits':0,'portfolioReplays':0,'performanceInspected':False,
              'safety':x['safety']},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-capital-rank-v2-contract-receipt
          path: |
            /tmp/phase57-v2-contract-receipt.json
            /tmp/phase57-v2-ci-manifest.json
          if-no-files-found: error
