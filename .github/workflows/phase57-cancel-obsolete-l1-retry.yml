name: Phase57 Cancel Superseded Research Runs

on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-cancel-obsolete-l1-retry.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Only superseded jobs auto-triggered by the contract / audit pushes.
            // Preserve North-Star audit 34976208234 and ordinary CI.
            for (const run_id of [34975517579, 34975517538, 34976219728, 34976219787, 34976219838, 34976219852]) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
              } catch (error) {
                if (error.status !== 409) throw error;
              }
            }
