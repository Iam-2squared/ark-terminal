name: Phase57 P23.11A Sequential Persistence Dev
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-sequential-persistence-scheduler.js'
      - 'predict/daytrade/run-phase57-sequential-persistence-dev-shard.mjs'
      - 'predict/tests/p23-11a-sequential-persistence.test.mjs'
      - '.github/workflows/phase57-sequential-persistence-dev.yml'
permissions: { contents: read, actions: read }
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node predict/tests/p23-11a-sequential-persistence.test.mjs
  shard:
    needs: unit
    strategy: { fail-fast: false, matrix: { shard: [0,1,2] } }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { PHASE57_SHARD_INDEX: '${{ matrix.shard }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node predict/daytrade/run-phase57-sequential-persistence-dev-shard.mjs
      - name: Verify sequential realism and safety
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=Number(process.env.PHASE57_SHARD_INDEX)+1,p=`artifacts/phase57-p23-11a-sequential-persistence-dev-shard-${s}.json`;if(!fs.existsSync(p))throw new Error('missing result');const d=JSON.parse(fs.readFileSync(p,'utf8'));if(d.integrity?.baseSignalsOuterOos!==true||d.integrity?.oneActiveTradePerSymbol!==true||d.integrity?.sameSessionOnly!==true||d.integrity?.noThresholdSearchInThisRun!==true)throw new Error('integrity');for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed','transmitted'])if(d[k]!==false)throw new Error(`${k} must remain false`);
          NODE
      - uses: actions/upload-artifact@v4
        with: { name: 'phase57-p23-11a-shard-${{ matrix.shard }}', path: 'artifacts/phase57-p23-11a-sequential-persistence-dev-shard-*.json', if-no-files-found: error }
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'phase57-p23-11a-shard-*', path: shards, merge-multiple: true }
      - name: Aggregate sequential persistence development evidence
        run: |
          node - <<'NODE'
          const fs=require('fs'),files=fs.readdirSync('shards').filter(x=>/^phase57-p23-11a-sequential-persistence-dev-shard-\d+\.json$/.test(x)).sort();if(files.length!==3)throw new Error('expected3');const shards=files.map(f=>JSON.parse(fs.readFileSync(`shards/${f}`,'utf8'))),rows=shards.flatMap(s=>s.accepted||[]);const sum=a=>{const x=a.map(r=>Number(r.ratchet.netReturnPct)),p=x.filter(v=>v>0).reduce((s,v)=>s+v,0),n=-x.filter(v=>v<0).reduce((s,v)=>s+v,0);return{signalCount:x.length,hitRate:x.length?x.filter(v=>v>0).length/x.length:null,netAverageReturnPct:x.length?x.reduce((s,v)=>s+v,0)/x.length:null,profitFactor:n>0?p/n:(p>0?Infinity:null)}};const agg=sum(rows),symbolCounts={};for(const r of rows)symbolCounts[r.symbol]=(symbolCounts[r.symbol]||0)+1;const maxSymbolShare=rows.length?Math.max(...Object.values(symbolCounts))/rows.length:0;const result={phase:'57.p23.11a-sequential-persistence-dev-aggregate',status:'SEQUENTIAL_PERSISTENCE_DEVELOPMENT_AGGREGATED',aggregate:agg,positiveShardCount:shards.filter(s=>Number(s.sequentialPersistence.netAverageReturnPct)>0).length,maxSymbolShare,byShard:shards.map(s=>({shardNumber:s.shardNumber,adaptive:s.source.adaptiveOosRows,sequential:s.sequentialPersistence})),integrity:{developmentOnly:true,noThresholdSearchInRun:true,oneActiveTradePerSymbol:true,baseSignalsOuterOos:true},edgeClaimAllowed:false,recommendationAllowed:false,executionAllowed:false,brokerWriteAllowed:false,excelOrderWriteAllowed:false,rssOrderFunctionAllowed:false,liveTradingAllowed:false,paperTradingAllowed:false,automaticPromotionAllowed:false,productionUpdateAllowed:false,overnightHoldingAllowed:false,transmitted:false};fs.mkdirSync('artifacts',{recursive:true});fs.writeFileSync('artifacts/phase57-p23-11a-sequential-persistence-dev-aggregate.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with: { name: phase57-p23-11a-sequential-persistence-dev-aggregate, path: artifacts/phase57-p23-11a-sequential-persistence-dev-aggregate.json, if-no-files-found: error }
