name: Phase57 Entry Reserve87 Full Source Parity

on:
  workflow_dispatch:
  push:
    branches: [research/phase57-minimal-stateful-hybrid-entry]
    paths:
      - .github/workflows/phase57-entry-reserve87-full-source-parity.yml
      - scripts/phase57-entry-reserve87-full-source-parity.mjs
      - predict/research/phase57-entry-reserve87-full-source-parity-precommit.json

permissions:
  contents: read
  actions: read

jobs:
  full-parity:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable v2.1 admission ancestry
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-1-admission-summary-34189128681
          path: artifacts/input/admission-v21
          run-id: 34189128681
          github-token: ${{ github.token }}
      - name: Verify immutable admission hash
        run: |
          (cd artifacts/input/admission-v21 && sha256sum --check admission.json.sha256)
          test "$(sha256sum artifacts/input/admission-v21/admission.json | cut -d' ' -f1)" = "18edbdb30325797cde7bdd1316c6086077fc8907a09d9e1755575f2722c04379"
      - name: Run outcome-blind full source parity shard
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          FULL_PARITY_PRECOMMIT_PATH: predict/research/phase57-entry-reserve87-full-source-parity-precommit.json
          ADMISSION_V21_PATH: artifacts/input/admission-v21/admission.json
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 6
        run: node scripts/phase57-entry-reserve87-full-source-parity.mjs
      - name: Upload full source parity shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-entry-reserve87-full-source-parity-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/phase57-entry-reserve87-full-source-parity/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: full-parity
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download all full parity shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-entry-reserve87-full-source-parity-shard-*-${{ github.run_id }}
          path: artifacts/shards
          merge-multiple: true
      - name: Aggregate and enforce 58/58 fail-closed gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';

          const precommit = JSON.parse(fs.readFileSync('predict/research/phase57-entry-reserve87-full-source-parity-precommit.json', 'utf8'));
          const dir = 'artifacts/shards';
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((name) => /^source-parity-shard-\d+\.json$/.test(name)).sort()
            : [];
          const shards = files.map((name) => JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8')));
          const results = shards.flatMap((shard) => shard.results ?? []);
          const resultByDate = new Map(results.map((row) => [row.sessionDate, row]));
          const missing = precommit.sessions.filter((date) => !resultByDate.has(date));
          const duplicateCount = results.length - resultByDate.size;
          const failed = results.filter((row) => row.status !== 'SOURCE_PARITY_PASS');
          const shardFailures = shards.filter((shard) => shard.status !== 'FULL_SOURCE_PARITY_SHARD_PASS');
          const safeguardsPass = shards.every((shard) =>
            shard.developmentUnlocked === false &&
            shard.featureCalculationPerformed === false &&
            shard.labelGenerationPerformed === false &&
            shard.outcomeInspectionPerformed === false &&
            shard.rawPersisted === false &&
            shard.reserve180To282Opened === 0 &&
            shard.freshValidationOpened === 0 &&
            shard.freshOosOpened === 0
          );
          const pass =
            files.length === 6 &&
            shards.length === 6 &&
            results.length === 58 &&
            resultByDate.size === 58 &&
            missing.length === 0 &&
            duplicateCount === 0 &&
            failed.length === 0 &&
            shardFailures.length === 0 &&
            safeguardsPass;

          const output = {
            schemaVersion: 1,
            phase: precommit.phase,
            status: pass ? 'FULL_SOURCE_PARITY_58_OF_58_PASS' : 'FULL_SOURCE_PARITY_FAIL',
            purpose: precommit.purpose,
            expectedSessions: 58,
            observedSessions: resultByDate.size,
            missing,
            duplicateCount,
            failed,
            shardCountExpected: 6,
            shardCountObserved: shards.length,
            shardFailures: shardFailures.map((row) => row.shardIndex),
            developmentUnlocked: false,
            featureCalculationPerformed: false,
            labelGenerationPerformed: false,
            outcomeInspectionPerformed: false,
            rawPersisted: false,
            reserve180To282Opened: 0,
            freshValidationOpened: 0,
            freshOosOpened: 0,
            safety: precommit.safety,
          };
          fs.mkdirSync('artifacts/aggregate', { recursive: true });
          const text = JSON.stringify(output, null, 2) + '\n';
          fs.writeFileSync('artifacts/aggregate/full-source-parity-aggregate.json', text);
          const digest = createHash('sha256').update(text).digest('hex');
          fs.writeFileSync('artifacts/aggregate/full-source-parity-aggregate.json.sha256', `${digest}  full-source-parity-aggregate.json\n`);
          if (!pass) process.exit(20);
          NODE
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-entry-reserve87-full-source-parity-aggregate-${{ github.run_id }}
          path: artifacts/aggregate/
          if-no-files-found: error
          retention-days: 30
