name: Phase57 P23.10C Full30 Chart Remeasurement

on:
  pull_request:
    paths:
      - 'predict/daytrade/aggregate-phase57-chart-perception-full30.mjs'
      - '.github/workflows/phase57-p23-10c-full30-chart-remeasurement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full30-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            symbols: '7203.T,6758.T,9984.T,8306.T,8035.T,6501.T,6861.T,6098.T,9432.T,9433.T'
          - shard: 1
            symbols: '9983.T,4063.T,6367.T,6954.T,7011.T,8058.T,8001.T,8316.T,8411.T,8766.T'
          - shard: 2
            symbols: '7741.T,7974.T,6902.T,7267.T,6594.T,4502.T,4519.T,2914.T,4661.T,6273.T'
    env:
      PHASE57_SYMBOLS: ${{ matrix.symbols }}
      PHASE57_MIN_HISTORY_BARS: '1600'
      PHASE57_STEP_BARS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run session-aware perception unit tests
        run: node predict/tests/p23-10-session-aware-measurement.test.mjs
      - name: Measure fixed 10-symbol shard
        run: node predict/daytrade/run-phase57-chart-perception-remeasurement.mjs
      - name: Verify shard safety and rename artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'artifacts/phase57-p23-10-chart-perception-remeasurement.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.symbolCount !== 10) throw new Error(`expected 10 symbols, got ${r.symbolCount}`);
          if (!(r.totalDirectionalSetups > 0)) throw new Error('empty shard');
          if (r.integrity?.futureOutcomesEvaluationOnly !== true) throw new Error('future label isolation failed');
          if (r.integrity?.sessionAwareHigherTimeframes !== true) throw new Error('session-aware higher timeframe integrity failed');
          for (const key of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) {
            if (r[key] !== false) throw new Error(`${key} must remain false`);
          }
          NODE
          mv artifacts/phase57-p23-10-chart-perception-remeasurement.json artifacts/phase57-p23-10c-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-10c-full30-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-10c-shard-${{ matrix.shard }}.json
          retention-days: 90

  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: full30-shard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-10c-full30-shard-*
          path: full30-shards
          merge-multiple: true
      - name: Aggregate all 30 symbols without averaging shard ratios
        run: node predict/daytrade/aggregate-phase57-chart-perception-full30.mjs
      - name: Verify aggregate safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('artifacts/phase57-p23-10c-full30-chart-perception.json', 'utf8'));
          if (r.status !== 'FULL30_CHART_PERCEPTION_REMEASUREMENT_COMPLETE') throw new Error('full30 aggregate incomplete');
          if (r.symbolCount !== 30) throw new Error('full30 symbol count mismatch');
          if (r.methodology?.setupThresholdsOptimizedOnFull30Outcomes !== false) throw new Error('outcome tuning forbidden');
          if (r.methodology?.p23_8FrozenOutcomesUsedForSelection !== false) throw new Error('P23.8 frozen outcome reuse forbidden');
          for (const key of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) {
            if (r[key] !== false) throw new Error(`${key} must remain false`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-10c-full30-chart-perception
          path: artifacts/phase57-p23-10c-full30-chart-perception.json
          retention-days: 90
