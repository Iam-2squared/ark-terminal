name: Phase57 NEW LONG EXIT Candidate B
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-new-long-exit-candidate-b.yml'
      - 'scripts/*phase57_new_long_exit_candidate_b*'
      - 'docs/evidence/phase57-new-long-exit-candidate-b-contract-2026-09-18.md'
permissions: {contents: read}
jobs:
  candidate-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {ARK_TEST_OFFLINE: '1'}
        run: python3 scripts/offline/kernel_exec.py python3 -m unittest scripts.test_phase57_new_long_exit_candidate_b
      - env: {ARK_TEST_OFFLINE: '1'}
        run: |
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_candidate_b --out /tmp/cb-a | tee /tmp/cb.txt
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_candidate_b --out /tmp/cb-b >/tmp/cbb.txt
          cmp /tmp/cb-a/summary.json /tmp/cb-b/summary.json
          cmp /tmp/cb-a/ledger.json.gz /tmp/cb-b/ledger.json.gz
          cmp /tmp/cb-a/manifest.json /tmp/cb-b/manifest.json
