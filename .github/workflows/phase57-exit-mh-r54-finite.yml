name: Phase57 R54 finite direct-price EXIT all-config Development replay
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - docs/evidence/phase57-exit-mh-r54/FINITE_LAUNCH.json
permissions:
  contents: read
  actions: read
concurrency:
  group: phase57-r54-finite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixed-one-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: '.'
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8 joblib==1.5.2
      - name: Synthetic and frozen-contract tests before any Development fit
        run: python -m unittest -q scripts.test_phase57_mh_r54 scripts.test_phase57_exit_continuation_r52
      - uses: actions/download-artifact@v4
        with:
          repository: Iam-2squared/ark-terminal
          run-id: 36251316248
          name: phase57-exit-gen3-r45-36251316248
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r45
      - uses: actions/download-artifact@v4
        with:
          repository: Iam-2squared/ark-terminal
          run-id: 36360421232
          name: phase57-r54-readiness-summary-36360421232
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/summary
      - uses: actions/download-artifact@v4
        with:
          repository: Iam-2squared/ark-terminal
          run-id: 36360421232
          name: phase57-r54-teacher-labels-36360421232
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/labels
      - name: Verify exact zero-fit input identities before spending fit budget
        run: python -m scripts.phase57_mh_ci_r54 --source "$RUNNER_TEMP/r45/gen3" --summary "$RUNNER_TEMP/summary" --labels "$RUNNER_TEMP/labels/training-labels.npz" --skip-smoke --out "$RUNNER_TEMP/finite-input-ci.json"
      - name: Exactly 176 real Development fits at most; manifest written before each fit
        run: python -m scripts.phase57_mh_train_r54 --source "$RUNNER_TEMP/r45/gen3" --summary "$RUNNER_TEMP/summary" --labels "$RUNNER_TEMP/labels/training-labels.npz" --out "$RUNNER_TEMP/r54-train"
      - name: Preserve fits and saved OOF before outcome evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-r54-model-forecasts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/finite-input-ci.json
            ${{ runner.temp }}/r54-train
          compression-level: 0
          if-no-files-found: warn
      - name: All 14 configs twice, 12 fee stress, 4 independent refit integrations, curves and frozen gate
        run: python -m scripts.phase57_mh_replay_r54 --source "$RUNNER_TEMP/r45/gen3" --summary "$RUNNER_TEMP/summary" --labels "$RUNNER_TEMP/labels/training-labels.npz" --forecasts "$RUNNER_TEMP/r54-train/oof-forecasts.npz" --refits "$RUNNER_TEMP/r54-train/oof-refit-d.npz" --out "$RUNNER_TEMP/r54-result"
      - name: Separate full-ledger cash, OOF, 24-day null and gate audit
        run: python -m scripts.phase57_mh_independent_audit_r54 --source "$RUNNER_TEMP/r45/gen3" --labels "$RUNNER_TEMP/labels/training-labels.npz" --training "$RUNNER_TEMP/r54-train" --result "$RUNNER_TEMP/r54-result" --out "$RUNNER_TEMP/r54-independent-audit.json"
      - name: Preserve all success and failure artifacts, including null curves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-r54-all-replays-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r54-result
            ${{ runner.temp }}/r54-independent-audit.json
          compression-level: 0
          if-no-files-found: warn
