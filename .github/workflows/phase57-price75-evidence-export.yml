name: Phase57 Price75 Immutable Evidence Export
on:
  pull_request:
    paths: ['.github/workflows/phase57-price75-evidence-export.yml']
permissions:
  contents: read
  actions: read
jobs:
  export-existing-artifact:
    if: github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase57-min-price75-dee68ee333f28679399c564b9d7f24efd43a5a0d
          path: ${{ runner.temp }}/price75-immutable
          repository: Iam-2squared/ark-terminal
          run-id: 35336375591
          github-token: ${{ github.token }}
      - name: Export existing derived files only; no measurement or private cache
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'price75-immutable'
          expected={'selector/selector-ledger.json.gz','selector/selector-summary.json','selector/selector-manifest.json','downstream/entry-ledger.json.gz','downstream/entry-decisions.json.gz','downstream/downstream-summary.json','downstream/downstream-manifest.json','new-paths.json.gz'}
          files={p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          assert set(files)==expected
          for folder,prefix in [('selector','selector'),('downstream','downstream')]:
              manifest=json.loads(files[f'{folder}/{prefix}-manifest.json'].read_text())
              for name,h in manifest['outputPins'].items():assert hashlib.sha256(files[folder+'/'+name].read_bytes()).hexdigest()==h
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name,p in sorted(files.items()):
                  info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,p.read_bytes())
          data=buf.getvalue();print('PRICE75_BUNDLE_SHA256='+hashlib.sha256(data).hexdigest())
          b64=base64.b64encode(data).decode()
          print('PRICE75_BUNDLE_BEGIN')
          for i in range(0,len(b64),4096):print('PRICE75_DATA='+b64[i:i+4096])
          print('PRICE75_BUNDLE_END')
          PY
