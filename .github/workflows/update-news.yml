name: Update AI News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AI news
        run: python scripts/fetch_news.py

      - name: Commit updated news
        run: |
          git config user.name "Ark News Bot"
          git config user.email "ark-news-bot@users.noreply.github.com"
          git add data/news.json

          if git diff --cached --quiet; then
            echo "ニュースに変更はありません。"
          else
            git commit -m "Update AI news"
            git push
          fi