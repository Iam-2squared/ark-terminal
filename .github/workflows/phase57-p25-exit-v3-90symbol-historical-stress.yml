name: Phase57 P25 EXIT v3 90-Symbol Historical Stress

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-exit-v3-90symbol-historical-stress.yml'
      - 'predict/daytrade/run-phase57-p25-exit-v3-90symbol-historical-stress.mjs'
      - 'predict/daytrade/aggregate-phase57-p25-exit-v3-90symbol-historical-stress.mjs'
      - 'predict/tests/p25-exit-v3-90symbol-historical-stress.test.mjs'
      - 'predict/daytrade/phase57-p25-exit-v3-dual-gate.js'
      - 'predict/daytrade/phase57-p25-exit-v3-independent-protocol.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-p25-exit-v3-90symbol-historical-stress-${{ github.ref }}
  cancel-in-progress: false

env:
  PINNED_P24_RUN_ID: '31785422471'
  PINNED_P24_ARTIFACT: 'phase57-p24-9-oos-canonical-candidate'
  EVALUATION_START: '2026-08-13'
  EVALUATION_END: '2026-08-27'
  PERIOD_START: '2026-07-01T00:00:00+09:00'
  PERIOD_END: '2026-08-28T00:00:00+09:00'

jobs:
  stress-shard:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - shard: 0
            symbols: 7203.T,6758.T,9984.T,8306.T,8035.T,6501.T,6861.T,6098.T,9432.T,9433.T
          - shard: 1
            symbols: 9983.T,4063.T,6367.T,6954.T,7011.T,8058.T,8001.T,8316.T,8411.T,8766.T
          - shard: 2
            symbols: 7741.T,7974.T,6902.T,7267.T,6594.T,4502.T,4519.T,2914.T,4661.T,6273.T
          - shard: 3
            symbols: 1605.T,1925.T,2502.T,2802.T,3382.T,3402.T,3659.T,4307.T,4452.T,4568.T
          - shard: 4
            symbols: 4901.T,5108.T,5401.T,5713.T,5802.T,6146.T,6178.T,6301.T,6326.T,6702.T
          - shard: 5
            symbols: 6723.T,6981.T,7182.T,7733.T,7751.T,7832.T,8801.T,9020.T,9101.T,9202.T
          - shard: 6
            symbols: 1801.T,1802.T,1803.T,1808.T,1812.T,2269.T,2282.T,2413.T,2587.T,2768.T
          - shard: 7
            symbols: 3092.T,4188.T,5020.T,5201.T,5332.T,5411.T,6503.T,6504.T,6506.T,6508.T
          - shard: 8
            symbols: 6701.T,6703.T,6752.T,6753.T,6762.T,6841.T,6857.T,6920.T,6971.T,7012.T
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guard tests
        run: node predict/tests/p25-exit-v3-90symbol-historical-stress.test.mjs
      - name: Download exact pinned P24 historical base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24
          gh run download "$PINNED_P24_RUN_ID" --repo "$GH_REPO" --name "$PINNED_P24_ARTIFACT" --dir /tmp/p24
          snap="$(find /tmp/p24 -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snap"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snap" --output /tmp/p25-pinned-history-pack.json
      - name: Run frozen v3 cross-symbol historical stress shard
        env:
          SYMBOLS: ${{ matrix.symbols }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/stress
          node predict/daytrade/run-phase57-p25-exit-v3-90symbol-historical-stress.mjs \
            --symbols "$SYMBOLS" \
            --history-pack /tmp/p25-pinned-history-pack.json \
            --evaluation-start "$EVALUATION_START" \
            --evaluation-end "$EVALUATION_END" \
            --period-start "$PERIOD_START" \
            --period-end "$PERIOD_END" \
            --min-history-bars 1600 \
            --step-bars 3 \
            --max-context-bars 2600 \
            --output "/tmp/stress/shard-${SHARD}.json"
      - name: Verify shard classification and safety
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync(`/tmp/stress/shard-${process.env.SHARD}.json`,'utf8'));
          if(x.status!=='P25_EXIT_V3_90SYMBOL_HISTORICAL_STRESS_COMPLETE') throw new Error('wrong status');
          if(x.classification?.formalOos!==false||x.classification?.promotionEligible!==false||x.classification?.currentDynamic50Comparable!==false||x.classification?.retuningAllowed!==false) throw new Error('classification violation');
          if(x.methodology?.frozenV3Policy!==true||x.methodology?.resultBasedRetuning!==false||x.methodology?.freshDynamic50HoldoutConsumed!==false) throw new Error('methodology violation');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed']) if(x.safety?.[k]!==false) throw new Error(`safety violation ${k}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-exit-v3-90symbol-stress-shard-${{ matrix.shard }}
          path: /tmp/stress/shard-${{ matrix.shard }}.json
          retention-days: 90

  aggregate:
    needs: stress-shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p25-exit-v3-90symbol-stress-shard-*
          path: /tmp/stress-input
          merge-multiple: true
      - name: Aggregate all 90 symbols
        run: node predict/daytrade/aggregate-phase57-p25-exit-v3-90symbol-historical-stress.mjs /tmp/stress-input /tmp/phase57-p25-exit-v3-90symbol-historical-stress-aggregate.json
      - name: Verify aggregate guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('/tmp/phase57-p25-exit-v3-90symbol-historical-stress-aggregate.json','utf8'));
          if(x.status!=='P25_EXIT_V3_90SYMBOL_HISTORICAL_STRESS_AGGREGATED') throw new Error('wrong aggregate status');
          if(x.symbolCount!==90) throw new Error(`symbol count ${x.symbolCount}`);
          if(!(x.counters?.sourceBars>100000)) throw new Error(`expected >100k source bars, got ${x.counters?.sourceBars}`);
          if(!(x.summary?.pairedCount>0)) throw new Error('no paired trades');
          if(x.classification?.formalOos!==false||x.classification?.promotionEligible!==false||x.classification?.currentDynamic50Comparable!==false) throw new Error('aggregate classification violation');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed']) if(x.safety?.[k]!==false) throw new Error(`safety violation ${k}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-exit-v3-90symbol-historical-stress
          path: /tmp/phase57-p25-exit-v3-90symbol-historical-stress-aggregate.json
          retention-days: 90
      - name: Research boundary
        run: |
          echo '90-symbol historical transfer stress only.'
          echo 'Does NOT recreate historical JPX-wide DYNAMIC_50 and does NOT replace fresh prospective evidence.'
          echo 'No retuning, no promotion, no broker/Excel/RSS order/paper/live writes.'
