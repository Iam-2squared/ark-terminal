name: Phase48.3 Feature Ablation

on:
  push:
    branches:
      - phase48-3/feature-ablation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install prediction dependencies
        working-directory: predict
        run: npm install --ignore-scripts
      - name: Run regression tests
        working-directory: predict
        run: npm test
      - name: Download five-symbol historical universe
        run: >-
          node tools/run_phase50_historical_downloader.mjs
          --symbols 7203.T,6758.T,9984.T,8306.T,8035.T
          --start 2020-01-01
          --end 2026-08-08
      - name: Build Phase48 alpha/regime dataset
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_SHA=$(sha256sum data/data-lake/manifest.json | awk '{print $1}')
          node tools/run_phase46_dataset_pipeline.mjs \
            --input data/historical/downloaded.phase45.json \
            --output data/training/phase48-alpha-regime-v2.json \
            --dataset-version phase48-alpha-regime-v2 \
            --source-manifest-checksum "$MANIFEST_SHA"
      - name: Run feature ablation
        run: node tools/run_phase48_ablation.mjs data/training/phase48-alpha-regime-v2.json data/ablation
      - name: Upload ablation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase48-3-feature-ablation
          if-no-files-found: error
          retention-days: 14
          path: |
            data/ablation/summary.json
            data/ablation/*-model.json
            data/data-lake/manifest.json
            data/data-lake/rejected.json
