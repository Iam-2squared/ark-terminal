name: Phase57 P25 Incomplete Session ABCD

on:
  pull_request:
    paths:
      - '.github/workflows/phase57-p25-incomplete-session-abcd.yml'
      - 'scripts/build_p25_incomplete_session_partial_substrate.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-incomplete-session-abcd.yml'
      - 'scripts/build_p25_incomplete_session_partial_substrate.mjs'
  workflow_dispatch:
    inputs:
      session_date:
        description: 'Incomplete JPX session date YYYY-MM-DD; blank = current JST date'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-incomplete-session-abcd-${{ inputs.session_date || github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve session date and durable evidence
        shell: bash
        env:
          REQUESTED: ${{ inputs.session_date }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then SESSION_DATE="$REQUESTED"; else SESSION_DATE="$(TZ=Asia/Tokyo date +%F)"; fi
          [[ "$SESSION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "SESSION_DATE=$SESSION_DATE" >> "$GITHUB_ENV"
          git fetch origin automation/p25-universe-data:refs/remotes/origin/automation/p25-universe-data
          git fetch origin automation/p25-marketwide-5m-data:refs/remotes/origin/automation/p25-marketwide-5m-data
          git show origin/automation/p25-universe-data:data/p25-prospective-universe-timeline.ndjson > /tmp/p25-universe-timeline.ndjson
          git worktree add --detach /tmp/p25-marketwide origin/automation/p25-marketwide-5m-data
          test -d "/tmp/p25-marketwide/data/p25-marketwide-5m/$SESSION_DATE"

      - name: Build fail-closed incomplete-session substrate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_p25_incomplete_session_partial_substrate.mjs \
            --timeline /tmp/p25-universe-timeline.ndjson \
            --marketwide-root /tmp/p25-marketwide/data/p25-marketwide-5m \
            --session-date "$SESSION_DATE" \
            --output-dir /tmp/p25-partial
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('/tmp/p25-partial/partial-manifest.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/p25-partial/freeze.json','utf8'));
          if(m.status!=='PARTIAL_FRESH_SUBSTRATE_READY'||m.formalFullSession!==false||m.formalOos!==false||m.missingExpectedBucketCount<1)throw new Error('incomplete-session manifest classification failed');
          if(f.status!=='PARTIAL_LATE_START_D50_FROZEN'||f.classification?.requestedSessionType!=='PARTIAL_INCOMPLETE_SESSION')throw new Error('partial wrapper classification failed');
          for(const o of [m,f])for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(o.safety?.[k]!==false)throw new Error(`unsafe ${k}`);
          console.log(JSON.stringify({sessionDate:m.sessionDate,points:m.dynamicPointCount,missing:m.missingExpectedBuckets,first:m.firstObservedBucketJst,last:m.lastObservedBucketJst},null,2));
          NODE

      - name: Build exact pinned pre-cutoff history pack
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-history.json

      - name: Measure A B C D from genuine captured points
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_p25_partial_abcd_postclose.mjs --partial-dir /tmp/p25-partial --history-pack /tmp/p25-history.json --output /tmp/p25-abcd.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/p25-abcd.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/p25-partial/partial-manifest.json','utf8'));
          if(r.status!=='P25_PARTIAL_ABCD_POSTCLOSE_EVALUATED'||r.sessionDate!==process.env.SESSION_DATE)throw new Error('ABCD result invalid');
          r.classification={...r.classification,sessionType:'PARTIAL_INCOMPLETE_SESSION',sourceEvaluatorCompatibilityType:'PARTIAL_LATE_START',formalFullSession:false,formalOos:false,promotionEligible:false,missingExpectedBucketCount:m.missingExpectedBucketCount,missingExpectedBuckets:m.missingExpectedBuckets,hasInternalGap:m.hasInternalGap};
          r.methodology={...r.methodology,noBackfillOrFabrication:true,fullSessionClaimForbidden:true,resultBasedRetuning:false};
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(r.safety?.[k]!==false)throw new Error(`unsafe ${k}`);
          fs.writeFileSync('/tmp/p25-abcd.json',JSON.stringify(r,null,2)+'\n');
          console.log(JSON.stringify({sessionDate:r.sessionDate,classification:r.classification,A:r.A?.summary,B:r.B?.summary,C:r.C?.summary,D:Object.fromEntries(Object.entries(r.D?.profiles??{}).map(([k,v])=>[k,{returnPct:v.return?.totalReturnPct,maxDrawdownPct:v.risk?.maxDrawdownPct,finalEquityJpy:v.return?.finalEquityJpy}]))},null,2));
          NODE

      - name: Persist append-only incomplete-session evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/p25-abcd.json /tmp/p25-abcd-copy.json
          cp /tmp/p25-partial/freeze.json /tmp/p25-freeze-copy.json
          cp /tmp/p25-partial/partial-manifest.json /tmp/p25-manifest-copy.json
          cp /tmp/p25-partial/partial-measurements.ndjson /tmp/p25-measurements-copy.ndjson
          git config user.name 'Ark P25 Incomplete Session Bot'
          git config user.email 'ark-p25-incomplete@users.noreply.github.com'
          git fetch origin automation/p25-partial-data:refs/remotes/origin/automation/p25-partial-data
          git switch -C automation/p25-partial-data origin/automation/p25-partial-data
          target="data/p25-incomplete-session/${SESSION_DATE}"
          test ! -e "$target/abcd-result.json"
          mkdir -p "$target"
          cp /tmp/p25-abcd-copy.json "$target/abcd-result.json"
          cp /tmp/p25-freeze-copy.json "$target/freeze.json"
          cp /tmp/p25-manifest-copy.json "$target/partial-manifest.json"
          cp /tmp/p25-measurements-copy.ndjson "$target/partial-measurements.ndjson"
          git add "$target"
          git commit -m "Persist P25 incomplete-session ABCD ${SESSION_DATE}"
          git push origin HEAD:automation/p25-partial-data

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: phase57-p25-incomplete-session-abcd-${{ env.SESSION_DATE }}
          path: |
            /tmp/p25-abcd.json
            /tmp/p25-partial
          retention-days: 90

      - name: Safety boundary
        if: always()
        run: echo 'Incomplete-session research measurement only; no backfill/fabrication, no broker/RSS/Excel/order/paper/live execution, no tuning, no promotion.'
