name: Phase57 P25 Marketwide 5m Measurement
on:
  pull_request:
    paths:
      - 'scripts/fetch_p25_marketwide_5m_spark.mjs'
      - 'scripts/capture_p25_marketwide_5m_snapshot.mjs'
      - 'scripts/measure_p25_intraday_dynamic_universe_snapshot.mjs'
      - 'predict/daytrade/phase57-p25-intraday-dynamic-universe.js'
      - 'predict/daytrade/phase57-p25-intraday-dynamic-universe-v2.js'
      - '.github/workflows/phase57-p25-marketwide-5m-measurement.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_p25_marketwide_5m_spark.mjs'
      - 'scripts/capture_p25_marketwide_5m_snapshot.mjs'
      - 'scripts/measure_p25_intraday_dynamic_universe_snapshot.mjs'
      - 'predict/daytrade/phase57-p25-intraday-dynamic-universe.js'
      - 'predict/daytrade/phase57-p25-intraday-dynamic-universe-v2.js'
      - '.github/workflows/phase57-p25-marketwide-5m-measurement.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 0-1 * * 1-5'
    - cron: '0-30/5 2,6 * * 1-5'
    - cron: '30-55/5 3 * * 1-5'
    - cron: '*/5 4-5 * * 1-5'
permissions:
  contents: write
  actions: read
concurrency:
  group: phase57-p25-marketwide-5m-durable-capture
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch JPX-wide 5m point-in-time snapshot
        run: node scripts/fetch_p25_marketwide_5m_spark.mjs --output tmp/marketwide.json
      - name: Persist point-in-time snapshot contract
        run: node scripts/capture_p25_marketwide_5m_snapshot.mjs --input tmp/marketwide.json --as-of "$(node -p "require('./tmp/marketwide.json').meta.observedAt")" --output tmp/marketwide.ndjson
      - name: Load causal prior Dynamic5m v2 memberships
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p tmp/prior-v2
          ids="$(gh run list --repo "$GH_REPO" --workflow phase57-p25-marketwide-5m-measurement.yml --branch main --status success --limit 4 --json databaseId --jq '.[].databaseId' || true)"
          n=0
          while read -r id; do
            [ -z "$id" ] && continue
            d="tmp/prior-v2/$id"; mkdir -p "$d"
            gh run download "$id" --repo "$GH_REPO" --name phase57-p25-marketwide-5m-measurement --dir "$d" >/dev/null 2>&1 || true
            n=$((n+1))
          done <<< "$ids"
          echo "inspected $n prior successful measurement runs"
      - name: Measure dynamic 5m v1 and v2 selection
        run: node scripts/measure_p25_intraday_dynamic_universe_snapshot.mjs --input tmp/marketwide.json --prior-dir tmp/prior-v2 --output tmp/measurement.json
      - name: Guard research-only safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('tmp/measurement.json','utf8'));
          if(x.status!=='MARKETWIDE_DYNAMIC_5M_MEASUREMENT_READY')throw new Error('measurement not ready');
          if(x.inputSymbols<3000||x.selectedSymbols<20||x.selectedV2Symbols<15)throw new Error('marketwide/v2 selection incomplete');
          if(x.dynamic5mV2?.policy?.candidateId!=='INTRADAY_DYNAMIC_5M_UNIVERSE_V2')throw new Error('v2 policy missing');
          for(const s of [x.safety,x.dynamic5mV2?.safety])for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(s?.[k]!==false)throw new Error(`safety ${k}`);
          NODE
      - name: Stage immutable durable evidence
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p25-dynamic5m-durable
          cp tmp/measurement.json /tmp/p25-dynamic5m-durable/measurement.json
          cp tmp/marketwide.ndjson /tmp/p25-dynamic5m-durable/marketwide.ndjson
          observed="$(node -p "require('./tmp/measurement.json').observedAt")"
          session_date="$(TZ=Asia/Tokyo date -d "$observed" +%F)"
          stamp="$(date -u -d "$observed" +%Y%m%dT%H%M%SZ)"
          echo "SESSION_DATE=$session_date" >> "$GITHUB_ENV"
          echo "OBSERVED_STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-marketwide-5m-measurement
          path: |
            tmp/marketwide.ndjson
            tmp/measurement.json
          retention-days: 90
      - name: Persist append-only Dynamic5m point to durable branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ark Dynamic5m Capture Bot'
          git config user.email 'ark-dynamic5m-capture@users.noreply.github.com'
          git fetch origin automation/p25-marketwide-5m-data:refs/remotes/origin/automation/p25-marketwide-5m-data || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/p25-marketwide-5m-data; then
            git switch -C automation/p25-marketwide-5m-data origin/automation/p25-marketwide-5m-data
          else
            git switch --orphan automation/p25-marketwide-5m-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          dir="data/p25-marketwide-5m/${SESSION_DATE}/${OBSERVED_STAMP}"
          mkdir -p "$dir"
          test ! -e "$dir/measurement.json"
          test ! -e "$dir/marketwide.ndjson"
          cp /tmp/p25-dynamic5m-durable/measurement.json "$dir/measurement.json"
          cp /tmp/p25-dynamic5m-durable/marketwide.ndjson "$dir/marketwide.ndjson"
          git add "$dir"
          git commit -m "Persist Dynamic5m point ${SESSION_DATE} ${OBSERVED_STAMP}"
          git push origin HEAD:automation/p25-marketwide-5m-data
          echo "persisted=$dir"
      - name: Safety boundary
        if: always()
        run: echo 'Point-in-time research capture only; append-only evidence, no broker/RSS/Excel/order/paper/live/promotion/production action.'
