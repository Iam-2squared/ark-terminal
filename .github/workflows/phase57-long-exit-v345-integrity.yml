name: Phase57 LONG EXIT v345 Evidence Integrity
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-long-exit-v345-integrity.yml
      - scripts/test_phase57_long_exit_paired_*
      - scripts/summarize_phase57_long_exit_paired.py
      - docs/evidence/phase57-long-exit-v345-paired/**
permissions:
  contents: read
jobs:
  offline-evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic path and causal analog rejection tests
        run: ARK_TEST_OFFLINE=1 python3 scripts/offline/kernel_exec.py node --test scripts/test_phase57_long_exit_paired_paths.mjs
      - name: Saved evidence and upstream identity tests; no model prediction
        run: ARK_TEST_OFFLINE=1 python3 scripts/offline/kernel_exec.py python3 -m unittest scripts/test_phase57_long_exit_paired_summary.py scripts/test_phase57_long_exit_paired_integrity.py scripts/test_phase57_msh_entry_upstream_freeze.py
