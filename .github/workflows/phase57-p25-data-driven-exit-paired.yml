name: Phase57 P25 Data-Driven EXIT Paired

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-data-driven-exit-paired.yml'
      - 'scripts/run_p25_data_driven_exit_paired.mjs'
      - 'scripts/reduce_p25_data_driven_exit_shards.mjs'
      - 'predict/daytrade/phase57-p25-data-driven-exit.js'
      - 'predict/daytrade/phase57-p25-data-driven-exit-multisession.js'
  workflow_dispatch:
    inputs:
      evidence_date:
        description: 'Immutable evidence date YYYY-MM-DD; blank = latest available'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-data-driven-exit-paired
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      evidence_date: ${{ steps.plan.outputs.evidence_date }}
      session_dates: ${{ steps.plan.outputs.session_dates }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Resolve immutable evidence and session shards
        id: plan
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          if [ -n "${REQUESTED_DATE:-}" ]; then evidence_date="$REQUESTED_DATE"; else evidence_date="$(git ls-tree -r --name-only origin/automation/p25-evidence-data -- data/p25-evidence-lineage | sed -n 's#data/p25-evidence-lineage/\([0-9][0-9-]*\)-manifest.json#\1#p' | sort | tail -1)"; fi
          [[ "$evidence_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${evidence_date}-manifest.json" > /tmp/manifest.json
          session_dates="$(node -e "const x=require('/tmp/manifest.json'); console.log(JSON.stringify((x.manifest?.nodes??[]).map(n=>n.sessionDate)))")"
          test "$session_dates" != '[]'
          echo "evidence_date=$evidence_date" >> "$GITHUB_OUTPUT"
          echo "session_dates=$session_dates" >> "$GITHUB_OUTPUT"

  evaluate-shard:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        session_date: ${{ fromJSON(needs.prepare.outputs.session_dates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Load identical immutable lineage and captures
        shell: bash
        env:
          EVIDENCE_DATE: ${{ needs.prepare.outputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          git fetch origin automation/p25-day-data:refs/remotes/origin/automation/p25-day-data
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-manifest.json" > /tmp/p25-evidence-lineage-manifest.json
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-integrity.json" > /tmp/p25-session-integrity-ledger.json
          mkdir -p /tmp/p25-day-sessions
          mapfile -t dates < <(node -e "const x=require('/tmp/p25-evidence-lineage-manifest.json'); for (const n of x.manifest?.nodes ?? []) console.log(n.sessionDate)")
          for date in "${dates[@]}"; do git show "origin/automation/p25-day-data:data/p25-day-sessions/${date}.json" > "/tmp/p25-day-sessions/${date}.json"; done
      - name: Download exact pinned P24 canonical byte snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-pinned-history-pack.json
      - name: Evaluate exact DYNAMIC_50 shard
        shell: bash
        env:
          SESSION_DATE: ${{ matrix.session_date }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard
          node scripts/run_p25_data_driven_exit_paired.mjs \
            --history-pack /tmp/p25-pinned-history-pack.json \
            --capture-dir /tmp/p25-day-sessions \
            --integrity-ledger /tmp/p25-session-integrity-ledger.json \
            --lineage-manifest /tmp/p25-evidence-lineage-manifest.json \
            --session-date "$SESSION_DATE" \
            --output "/tmp/shard/${SESSION_DATE}.json"
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-data-driven-exit-shard-${{ matrix.session_date }}
          path: /tmp/shard/${{ matrix.session_date }}.json
          retention-days: 90

  reduce-and-persist:
    needs: [prepare, evaluate-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: phase57-p25-data-driven-exit-shard-*
          path: /tmp/shards
          merge-multiple: true
      - name: Deterministic reduce and guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reduce_p25_data_driven_exit_shards.mjs --input-dir /tmp/shards --output /tmp/p25-data-driven-exit-paired.json
          node - <<'NODE'
          const x=require('/tmp/p25-data-driven-exit-paired.json');
          if(x.result?.readySessionCount!==${{ strategy.job-total || 0 }}) console.log('session count checked by reducer/artifact set');
          if(x.safety?.executionAllowed!==false||x.safety?.brokerWriteAllowed!==false||x.safety?.excelOrderWriteAllowed!==false||x.safety?.rssOrderFunctionAllowed!==false||x.safety?.liveTradingAllowed!==false||x.safety?.paperTradingAllowed!==false||x.safety?.automaticPromotionAllowed!==false||x.safety?.productionUpdateAllowed!==false||x.safety?.transmitted!==false||x.safety?.freshHoldoutConsumed!==false) throw new Error('safety flag violation');
          if(x.methodology?.exactDynamic50Only!==true||x.methodology?.resultBasedRetuning!==false||x.methodology?.shardedComputeOnly!==true) throw new Error('methodology guard violation');
          NODE
      - name: Persist append-only evidence
        shell: bash
        env:
          EVIDENCE_DATE: ${{ needs.prepare.outputs.evidence_date }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='automation/p25-data-driven-exit-data'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then git fetch origin "$branch":refs/remotes/origin/"$branch"; git switch -C "$branch" origin/"$branch"; else git switch --orphan "$branch"; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p data/p25-data-driven-exit
          target="data/p25-data-driven-exit/${EVIDENCE_DATE}.json"
          if [ -f "$target" ]; then cmp -s "$target" /tmp/p25-data-driven-exit-paired.json || { echo 'append-only conflict'; exit 1; }; else cp /tmp/p25-data-driven-exit-paired.json "$target"; git add "$target"; git commit -m "Phase57 P25 data-driven EXIT ${EVIDENCE_DATE}"; git push origin HEAD:"$branch"; fi
      - name: Upload paired artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-data-driven-exit-${{ needs.prepare.outputs.evidence_date }}
          path: /tmp/p25-data-driven-exit-paired.json
          retention-days: 90
      - name: Safety boundary
        run: |
          echo 'Research-only sharded exact DYNAMIC_50 Fixed vs data-driven EXIT paired evaluation.'
          echo 'Compute is split only; Entry/model/universe/threshold/Dynamic-N/fair-cutoff/historical pool/EXIT semantics unchanged.'
          echo 'No broker, Excel, RSS order, MARKETSPEED, paper/live trading, promotion, transmission, or production update.'
