name: Phase57 P23.12 Visual Chart Reasoning

on:
  pull_request:
    branches:
      - phase57/p23-8d-frozen-exit-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 0
            symbols: 7203.T,6758.T,9984.T,8306.T,8035.T,6501.T,6861.T,6098.T,9432.T,9433.T
          - shard: 1
            symbols: 9983.T,4063.T,6367.T,6954.T,7011.T,8058.T,8001.T,8316.T,8411.T,8766.T
          - shard: 2
            symbols: 7741.T,7974.T,6902.T,7267.T,6594.T,4502.T,4519.T,2914.T,4661.T,6273.T
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test visual chart reasoning core
        run: node predict/tests/p23-12-visual-chart-reasoning.test.mjs
      - name: Measure visual reasoning on development shard
        env:
          PHASE57_SYMBOLS: ${{ matrix.symbols }}
          PHASE57_MIN_HISTORY_BARS: '1600'
          PHASE57_STEP_BARS: '3'
          PHASE57_MAX_CONTEXT_BARS: '2600'
        run: node predict/daytrade/run-phase57-p23-12-visual-reasoning-dev.mjs
      - name: Verify shard methodology and safety
        env:
          EXPECTED_SYMBOLS: ${{ matrix.symbols }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/phase57-p23-12-visual-reasoning-dev.json','utf8'));
          const expected=process.env.EXPECTED_SYMBOLS.split(',').sort();
          if(r.status!=='VISUAL_CHART_REASONING_DEVELOPMENT_MEASURED') throw new Error('wrong status');
          if(JSON.stringify([...r.symbols].sort())!==JSON.stringify(expected)) throw new Error('symbol mismatch');
          if(!r.methodology?.developmentUniverseOnly || r.methodology?.freshHoldoutConsumed!==false) throw new Error('development boundary violation');
          if(r.methodology?.futureOutcomesEvaluationOnly!==true || r.methodology?.visualScoreOutcomeTuned!==false || r.methodology?.visualScoreUsedAsEntryGate!==false) throw new Error('visual methodology violation');
          if(r.methodology?.externalVisionModelCalled!==false) throw new Error('unexpected external vision call');
          if(!(r.aggregate?.count>0)) throw new Error('no visual records');
          if(!fs.existsSync('artifacts/phase57-p23-12-visual-sample.svg')) throw new Error('missing visual SVG sample');
          if(!fs.existsSync('artifacts/phase57-p23-12-multimodal-manifest-sample.json')) throw new Error('missing multimodal manifest');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed','transmitted']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
          mv artifacts/phase57-p23-12-visual-reasoning-dev.json artifacts/phase57-p23-12-visual-reasoning-shard-${{ matrix.shard }}.json
          mv artifacts/phase57-p23-12-visual-sample.svg artifacts/phase57-p23-12-visual-sample-${{ matrix.shard }}.svg
          mv artifacts/phase57-p23-12-multimodal-manifest-sample.json artifacts/phase57-p23-12-multimodal-manifest-sample-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-12-visual-shard-${{ matrix.shard }}
          path: |
            artifacts/phase57-p23-12-visual-reasoning-shard-${{ matrix.shard }}.json
            artifacts/phase57-p23-12-visual-sample-${{ matrix.shard }}.svg
            artifacts/phase57-p23-12-multimodal-manifest-sample-${{ matrix.shard }}.json
          if-no-files-found: error

  aggregate:
    needs: visual-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-12-visual-shard-*
          path: artifacts/p23-12-input
          merge-multiple: true
      - name: Aggregate exact visual records
        run: node predict/daytrade/aggregate-phase57-p23-12-visual-reasoning.mjs artifacts/p23-12-input
      - name: Verify aggregate methodology and safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/phase57-p23-12-visual-reasoning-dev-aggregate.json','utf8'));
          if(r.status!=='VISUAL_CHART_REASONING_DEVELOPMENT_AGGREGATED') throw new Error('wrong aggregate status');
          if(r.symbolCount!==30 || r.shardCount!==3) throw new Error('expected full 30-symbol development aggregate');
          if(!r.methodology?.exactExpandedDevelopmentUniverse || !r.methodology?.ratiosRecomputedFromExactRecords) throw new Error('aggregate integrity failure');
          if(r.methodology?.freshHoldoutConsumed!==false || r.methodology?.untouchedTemporalOos!==false) throw new Error('must not mislabel OOS');
          if(r.methodology?.futureOutcomeUsedByVisualReasoning!==false || r.methodology?.visualScoreOutcomeTuned!==false || r.methodology?.visualScoreUsedAsEntryGate!==false) throw new Error('leakage/gating violation');
          if(r.edgeClaimAllowed!==false || r.recommendationAllowed!==false || r.transmitted!==false) throw new Error('research-only flags violated');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-12-visual-chart-reasoning-development
          path: |
            artifacts/phase57-p23-12-visual-reasoning-dev-aggregate.json
            artifacts/p23-12-input/*.svg
            artifacts/p23-12-input/*manifest*.json
          if-no-files-found: error
