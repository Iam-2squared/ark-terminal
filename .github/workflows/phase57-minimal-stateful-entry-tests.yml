name: Phase57 Minimal Stateful Entry Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/phase57-minimal-stateful-entry.mjs'
      - 'scripts/tests/phase57-minimal-stateful-entry.test.mjs'
      - 'scripts/audit_phase57_minimal_stateful_sanity.mjs'
      - 'scripts/phase57-entry-reserve87-source-parity-pilot.mjs'
      - 'scripts/lib/phase57-selector-jquants-minute.mjs'
      - 'predict/research/phase57-minimal-stateful-entry-*.json'
      - 'predict/research/phase57-entry-reserve87-*.json'
      - 'docs/phase57-minimal-stateful-entry*.md'
      - '.github/workflows/phase57-minimal-stateful-entry-tests.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/phase57-minimal-stateful-entry.test.mjs
      - run: node --check scripts/lib/phase57-minimal-stateful-entry.mjs
      - run: node --check scripts/audit_phase57_minimal_stateful_sanity.mjs
      - run: node --check scripts/phase57-entry-reserve87-source-parity-pilot.mjs

  reserve87-source-parity-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download immutable v2 allocation
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-allocation-34153192882
          path: artifacts/input/allocation-v2
          run-id: 34153192882
          github-token: ${{ github.token }}
      - name: Download immutable v2.1 allocation
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-1-allocation-34189128681
          path: artifacts/input/allocation-v21
          run-id: 34189128681
          github-token: ${{ github.token }}
      - name: Verify recovered allocation hashes
        run: |
          (cd artifacts/input/allocation-v2 && sha256sum --check allocation.json.sha256)
          (cd artifacts/input/allocation-v21 && sha256sum --check allocation.json.sha256)
          test "$(sha256sum artifacts/input/allocation-v2/allocation.json | cut -d' ' -f1)" = "77af0bb6055232980b0220a961b45019c6fba54de4fd0cab8eabce651a757fab"
          test "$(sha256sum artifacts/input/allocation-v21/allocation.json | cut -d' ' -f1)" = "295466a4d29eb48ad8926d60cb1ceb03962aeb63e136a3c9758afabba2b70a95"
      - name: Download immutable v2 admission ancestry
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-admission-summary-34153192882
          path: artifacts/input/admission-v2
          run-id: 34153192882
          github-token: ${{ github.token }}
      - name: Download immutable v2.1 admission ancestry
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-1-admission-summary-34189128681
          path: artifacts/input/admission-v21
          run-id: 34189128681
          github-token: ${{ github.token }}
      - name: Verify admission hashes
        run: |
          (cd artifacts/input/admission-v2 && sha256sum --check admission.json.sha256)
          (cd artifacts/input/admission-v21 && sha256sum --check admission.json.sha256)
      - name: Run outcome-blind 3-session source parity pilot
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          RECOVERY_MANIFEST_PATH: predict/research/phase57-entry-reserve87-formal-recovery.json
          ADMISSION_V2_PATH: artifacts/input/admission-v2/admission.json
          ADMISSION_V21_PATH: artifacts/input/admission-v21/admission.json
        run: node scripts/phase57-entry-reserve87-source-parity-pilot.mjs
      - name: Upload outcome-blind parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-entry-reserve87-source-parity-pilot-${{ github.run_id }}
          path: artifacts/phase57-entry-reserve87-source-parity-pilot/
          if-no-files-found: error
          retention-days: 30
