name: Phase57 P25 Checkpointed Evaluation Dispatch

# Archived 2026-09-16: legacy persistence automatic triggers retired; manual history retained.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main checkpointed evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run phase57-p25-checkpointed-evaluation.yml --repo "$GH_REPO" --ref main
      - name: Safety boundary
        run: echo 'Dispatcher only; research evaluation remains READ ONLY and all trading/write/promotion flags remain false.'
