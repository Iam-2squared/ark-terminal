name: Phase57 Capital EXIT Integrated Contract
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - scripts/phase57_capital_exit_integrated.py
      - scripts/test_phase57_capital_exit_integrated.py
      - .github/workflows/phase57-capital-exit-integrated-contract.yml
      - docs/evidence/phase57-capital-exit-integrated/INTEGRATION_PRECOMMIT.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase57-capital-exit-integrated-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  zero-performance-prefit:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8
      - name: Synthetic event ordering, EXIT and cash tests
        run: python -m unittest -q scripts.test_phase57_capital_exit_integrated scripts.test_phase57_capital_v3 scripts.test_phase57_cash_capital_r34 scripts.test_phase57_cash_portfolio_r37 scripts.test_phase57_development_integrated_v1
      - name: Verify source hashes, exact R50-A execution references and CI OOF coverage
        run: python -m scripts.phase57_capital_exit_integrated --mode preflight --out /tmp/phase57-integrated-contract.json
      - name: Verify zero replay and Safety9
        run: |
          python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('/tmp/phase57-integrated-contract.json').read_text())
          assert x['sessions']==24 and x['modelFits']==x['allocationReplays']==x['protectedPartitionsOpened']==x['providerRequests']==0
          assert x['fundedPerformanceRead'] is False and x['rankScores']==x['R50AScope']=={'IMMEDIATE':819,'ALL_MATERIAL_R1_TEMPORAL_NESTED_OOF':795}
          assert len(x['safety'])==9 and not any(x['safety'].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-capital-exit-integration-preperformance-contract
          path: /tmp/phase57-integrated-contract.json
          if-no-files-found: error
