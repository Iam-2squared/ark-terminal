name: No11 OneClick offline checks
on:
  pull_request:
    paths:
      - "research/no11-morning-master-20261103/oneclick_*"
      - "research/no11-morning-master-20261103/Start-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/Watch-No11OneClickTradeUi.ps1"
      - "research/no11-morning-master-20261103/Apply-No11OneClickUi2AutoOpen.ps1"
      - "research/no11-morning-master-20261103/test_oneclick_trade_ui.py"
      - "research/no11-morning-master-20261103/Install-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/Bootstrap-No11OneClick.ps1"
      - "research/no11-morning-master-20261103/Update-No11OneClickTheme.ps1"
      - "research/no11-morning-master-20261103/Review-No11RecoveryReadOnly.ps1"
      - "research/no11-morning-master-20261103/no11_same_day_reconcile.py"
      - "research/no11-morning-master-20261103/nightly_workbook_compat.py"
      - "research/no11-morning-master-20261103/install_daily_cycle.py"
      - "research/no11-morning-master-20261103/Bootstrap-No11NightlyCycleFix.ps1"
      - "research/no11-morning-master-20261103/verify_oct26_legacy_code.mjs"
      - "research/no11-morning-master-20261103/Repair-No11Oct26HistoricalCodePin.ps1"
      - "research/no11-morning-master-20261103/Repair-No11Oct26CrlfCodePin.ps1"
      - "research/no11-morning-master-20261103/attest_oct26_win_checkout.mjs"
      - "research/no11-morning-master-20261103/test_nightly_workbook_compat.py"
      - ".github/workflows/no11-oneclick-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OneClick status contract (synthetic local files only)
        shell: bash
        run: |
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_status.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_installer_ui_guard.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_oneclick_trade_ui.py -v
          python -m unittest discover -s research/no11-morning-master-20261103 -p test_nightly_workbook_compat.py -v
          node research/no11-morning-master-20261103/verify_oct26_legacy_code.mjs --self-test
          node research/no11-morning-master-20261103/attest_oct26_win_checkout.mjs --self-test

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 syntax for add-on and its installer
        shell: powershell
        run: |
          $root='research/no11-morning-master-20261103'
          foreach ($name in @('Start-No11OneClick.ps1','Watch-No11OneClickTradeUi.ps1','Apply-No11OneClickUi2AutoOpen.ps1','Install-No11OneClick.ps1','Bootstrap-No11OneClick.ps1','Bootstrap-No11NightlyCycleFix.ps1','Repair-No11Oct26HistoricalCodePin.ps1','Repair-No11Oct26CrlfCodePin.ps1','Update-No11OneClickTheme.ps1','Review-No11RecoveryReadOnly.ps1')) {
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $root $name),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ('PARSE_FAILED_'+$name)}
          }
      - name: Offline OneClick selftests - no Excel or orders
        shell: powershell
        run: |
          $root='research/no11-morning-master-20261103'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Start-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'ONECLICK_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Watch-No11OneClickTradeUi.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'UI2_WATCH_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Apply-No11OneClickUi2AutoOpen.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'UI2_INSTALL_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Install-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'INSTALLER_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Bootstrap-No11OneClick.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'BOOTSTRAP_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Update-No11OneClickTheme.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'THEME_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Bootstrap-No11NightlyCycleFix.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'NIGHTLY_BOOTSTRAP_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Repair-No11Oct26HistoricalCodePin.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'OCT26_REPAIR_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Repair-No11Oct26CrlfCodePin.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'OCT26_CRLF_REPAIR_SELFTEST'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $root 'Review-No11RecoveryReadOnly.ps1') -OfflineSelfTest
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_REVIEW_SELFTEST'}
          & python -B -m py_compile (Join-Path $root 'no11_same_day_reconcile.py')
          if($LASTEXITCODE -ne 0){throw 'RECOVERY_PYTHON_PARSE'}
