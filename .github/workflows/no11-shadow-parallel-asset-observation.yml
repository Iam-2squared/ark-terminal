name: No11 Concurrent Shadow Source and Frozen Asset Audits

on:
  push:
    branches:
      - research/no12-prebuy-causal-runtime-20261011
    paths:
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_review_queue_from_actual_rss.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_actual_rss_review_queue.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11Book3ReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_book3_reference_salvage_static.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11UnsavedReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_unsaved_reference_recovery_static.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_import_clipboard_reference_readonly.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Import-No11ClipboardReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_clipboard_reference_readonly.py
      - .github/workflows/no11-shadow-parallel-asset-observation.yml
  pull_request:
    paths:
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_review_queue_from_actual_rss.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_actual_rss_review_queue.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11Book3ReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_book3_reference_salvage_static.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11UnsavedReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_unsaved_reference_recovery_static.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_import_clipboard_reference_readonly.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Import-No11ClipboardReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_clipboard_reference_readonly.py
      - .github/workflows/no11-shadow-parallel-asset-observation.yml

permissions:
  contents: read

jobs:
  offline-independent-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and audit-only self test, no frozen private files
        run: |
          python -B -c "import ast,pathlib;ast.parse(pathlib.Path('research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py').read_text())"
          python -B research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py --offline-self-test
          python -B research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py --offline-self-test
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p test_no11_parallel_original_inference_smoke.py -v
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p test_no11_actual_rss_review_queue.py -v
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p test_no11_clipboard_reference_readonly.py -v
      - name: Node syntax and fail-closed safety contract
        run: |
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_book3_reference_salvage_static.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_unsaved_reference_recovery_static.test.mjs
      - name: Safety statement
        run: |
          echo "NO11_PARALLEL_AUDITS_OFFLINE_TESTS=PASS"
          echo "LIVE_RSS_ORIGINALS_TESTED=False"
          echo "ORDER_TRANSMISSION=False"

  windows-c50-diagnostic-parser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse additive diagnosed read-only collector (no Excel)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptFile = 'research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptFile).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'C50_DIAGNOSTIC_POWERSHELL_PARSE_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptFile -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'C50_DIAGNOSTIC_SELFTEST_FAILED' }
          Write-Host 'NO11_C50_DIAGNOSTIC_OFFLINE_SELFTEST=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
          $oneShot = 'research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $oneShot).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'ONE_SHOT_REFERENCE_POWERSHELL_PARSE_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $oneShot -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'ONE_SHOT_REFERENCE_SELFTEST_FAILED' }
          # Reproduce the user's actual failure: downloaded launcher in TEMP,
          # original reference collector available only under -EngineRoot.
          $tempOneShot = Join-Path $env:RUNNER_TEMP 'Run-No11TodayReferenceOneShotReadOnly.ps1'
          Copy-Item -LiteralPath $oneShot -Destination $tempOneShot -ErrorAction Stop
          $engineRoot = (Resolve-Path 'research/no12-prebuy-causal-runtime-20261011').Path
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $tempOneShot -OfflineSelfTest -EngineRoot $engineRoot
          if ($LASTEXITCODE -ne 0) { throw 'ONE_SHOT_TEMP_DOWNLOAD_SELFTEST_FAILED' }
          Write-Host 'NO11_ONESHOT_TEMP_DOWNLOAD_SELFTEST=PASS'
          $salvage = 'research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11Book3ReferenceReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $salvage).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host ("BOOK3_PARSE_ERROR_ID=" + $e.ErrorId + "|LINE=" + $e.Extent.StartLineNumber + "|COLUMN=" + $e.Extent.StartColumnNumber)
            }
            throw 'BOOK3_SALVAGE_POWERSHELL_PARSE_FAILED'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $salvage -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'BOOK3_SALVAGE_SELFTEST_FAILED' }
          $generic = 'research/no12-prebuy-causal-runtime-20261011/windows/Recover-No11UnsavedReferenceReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $generic).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host ("BOOKN_PARSE_ERROR_ID=" + $e.ErrorId + "|LINE=" + $e.Extent.StartLineNumber)
            }
            throw 'BOOKN_SALVAGE_POWERSHELL_PARSE_FAILED'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $generic -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'BOOKN_SALVAGE_SELFTEST_FAILED' }
          $clipboardScript = 'research/no12-prebuy-causal-runtime-20261011/windows/Import-No11ClipboardReferenceReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $clipboardScript).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host ("CLIPBOARD_PS_PARSE_ERROR=" + $e.ErrorId + "|LINE=" + $e.Extent.StartLineNumber)
            }
            throw 'CLIPBOARD_POWERSHELL_PARSE_FAILED'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $clipboardScript -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'CLIPBOARD_POWERSHELL_OFFLINE_SELFTEST_FAILED' }
          Write-Host 'NO11_CLIPBOARD_POWERSHELL_OFFLINE_SELFTEST=PASS'
          Write-Host 'NO11_BOOKN_SALVAGE_OFFLINE_SELFTEST=PASS'
          Write-Host 'NO11_BOOK3_SALVAGE_OFFLINE_SELFTEST=PASS'
          Write-Host 'NO11_ONESHOT_REFERENCE_OFFLINE_SELFTEST=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
