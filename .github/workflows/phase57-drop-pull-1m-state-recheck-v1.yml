name: Phase57 DROP/PULLBACK 1m State Recheck v1

on:
  push:
    branches:
      - research/phase57-long-only-cash-equity
    paths:
      - '.github/workflows/phase57-drop-pull-1m-state-recheck-v1.yml'
      - 'scripts/phase57_drop_pull_1m_state_recheck_v1.py'
      - 'scripts/test_phase57_drop_pull_1m_state_recheck_v1.py'
      - 'docs/evidence/phase57-drop-pull-1m-state-recheck-v1/**'
  pull_request:
    paths:
      - '.github/workflows/phase57-drop-pull-1m-state-recheck-v1.yml'
      - 'scripts/phase57_drop_pull_1m_state_recheck_v1.py'
      - 'scripts/test_phase57_drop_pull_1m_state_recheck_v1.py'
      - 'docs/evidence/phase57-drop-pull-1m-state-recheck-v1/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: phase57-drop-pull-1m-state-recheck-v1
  cancel-in-progress: true

env:
  ARK_TEST_OFFLINE: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  measure:
    if: github.event_name == 'push' || (github.event.pull_request.number == 587 && github.head_ref == 'research/phase57-long-only-cash-equity' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.7.2 pandas==2.2.3
      - name: Focused policy and frozen-regression tests
        run: |
          set -euo pipefail
          python scripts/offline/kernel_exec.py python -m unittest -v \
            scripts.test_phase57_drop_pull_1m_state_recheck_v1 \
            scripts.test_phase57_state_v3_9pattern_entry_v1 \
            scripts.test_phase57_state_v3_9pattern_contract \
            scripts.test_phase57_state_conditioned_signal_entry_v1 \
            scripts.test_phase57_entry_timing_census \
            | tee "$RUNNER_TEMP/drop-pull-1m-tests.log"
      - name: Download immutable evaluator artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10605887642/zip" > "$RUNNER_TEMP/entry-pattern-v2.zip"
          test "$(sha256sum "$RUNNER_TEMP/entry-pattern-v2.zip" | cut -d ' ' -f1)" = "749caf82bbd9d39969f5712ef5a6f2705ac973a2f74483f03307c671586ae05a"
          mkdir -p "$RUNNER_TEMP/substrate"
          for name in raw-paths-evaluator-only.json.gz rows.json.gz outcomes.json.gz; do
            unzip -p "$RUNNER_TEMP/entry-pattern-v2.zip" "substrate/$name" > "$RUNNER_TEMP/substrate/$name"
          done
      - name: Replay precommitted one-minute hypothesis twice
        run: |
          set -euo pipefail
          replay() {
            python scripts/offline/kernel_exec.py python -m scripts.phase57_drop_pull_1m_state_recheck_v1 \
              --measurement docs/evidence/phase57-entry-timing-signal-census-v1/measurement \
              --entry-v1-measurement docs/evidence/phase57-state-conditioned-signal-entry-v1/measurement \
              --state-v3-measurement docs/evidence/phase57-state-v3-9pattern-entry-v1/measurement \
              --state-checkpoints docs/evidence/phase57-state-v3-9pattern-entry-v1/measurement/state-checkpoints.json.gz \
              --raw-paths "$RUNNER_TEMP/substrate/raw-paths-evaluator-only.json.gz" \
              --rows "$RUNNER_TEMP/substrate/rows.json.gz" \
              --outcomes "$RUNNER_TEMP/substrate/outcomes.json.gz" \
              --policy docs/evidence/phase57-drop-pull-1m-state-recheck-v1/POLICY_LOCK.json \
              --base-policy docs/evidence/phase57-state-v3-9pattern-entry-v1/POLICY_LOCK.json \
              --output "$1"
          }
          replay "$RUNNER_TEMP/replay-a"
          replay "$RUNNER_TEMP/replay-b"
          diff -qr "$RUNNER_TEMP/replay-a" "$RUNNER_TEMP/replay-b"
      - name: Verify frozen Development preservation
        run: |
          python scripts/verify_phase57_development_preservation.py
          python scripts/verify_phase57_selector_min_price75_freeze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-drop-pull-1m-state-recheck-v1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/replay-a
            ${{ runner.temp }}/drop-pull-1m-tests.log
          if-no-files-found: error
          retention-days: 90
