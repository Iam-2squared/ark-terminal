name: Phase57 P23.20 Probabilistic Profit Protection

on:
  pull_request:
    branches:
      - phase57/p23-8d-frozen-exit-isolation
    paths:
      - 'predict/daytrade/phase57-probabilistic-profit-protection.js'
      - 'predict/daytrade/run-phase57-p23-20-probabilistic-profit-protection.mjs'
      - 'predict/daytrade/aggregate-phase57-p23-20-probabilistic-profit-protection.mjs'
      - 'predict/tests/p23-20-probabilistic-profit-protection.test.mjs'
      - '.github/workflows/phase57-p23-20-probabilistic-profit-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: 0
            symbols: '1605.T,1925.T,2502.T,2802.T,3382.T,3402.T,3659.T,4307.T,4452.T,4568.T'
          - shard: 1
            symbols: '4901.T,5108.T,5401.T,5713.T,5802.T,6146.T,6178.T,6301.T,6326.T,6702.T'
          - shard: 2
            symbols: '6723.T,6981.T,7182.T,7733.T,7751.T,7832.T,8801.T,9020.T,9101.T,9202.T'
    env:
      PHASE57_SYMBOLS: ${{ matrix.symbols }}
      PHASE57_MIN_HISTORY_BARS: '1600'
      PHASE57_STEP_BARS: '3'
      PHASE57_MAX_CONTEXT_BARS: '2600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test causal protection invariants
        run: node predict/tests/p23-20-probabilistic-profit-protection.test.mjs
      - name: Run paired HOLD-PROTECT-EXIT remeasurement
        run: node predict/daytrade/run-phase57-p23-20-probabilistic-profit-protection.mjs
      - name: Verify methodology and safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('artifacts/phase57-p23-20-probabilistic-profit-protection.json','utf8'));
          if(r.status!=='PROBABILISTIC_PROFIT_PROTECTION_REMEASUREMENT_COMPLETE') throw new Error('wrong status');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed','transmitted']) if(r[k]!==false) throw new Error(`${k} must remain false`);
          if(!r.methodology?.strongEntryFrozenQ4||!r.methodology?.exactSameEntriesPaired||!r.methodology?.empiricalDownsideQuantileProtection||r.methodology?.noThresholdSweep!==true) throw new Error('methodology violation');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-20-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-20-probabilistic-profit-protection.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p23-20-shard-*
          path: artifacts/p23-20-shards
      - name: Aggregate exact paired evidence
        run: node predict/daytrade/aggregate-phase57-p23-20-probabilistic-profit-protection.mjs artifacts/p23-20-shards
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-20-probabilistic-profit-protection-aggregate
          path: artifacts/phase57-p23-20-probabilistic-profit-protection-aggregate.json
          if-no-files-found: error
