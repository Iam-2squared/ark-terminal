name: Predict Tests

on:
  pull_request:
    paths:
      - "predict/**"
      - "discovery/**"
      - "tools/**"
      - "real-account-home.js"
      - "service-worker.js"
      - ".github/workflows/predict-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prediction dependencies
        working-directory: predict
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Install RSS bridge test dependencies
        run: python -m pip install fastapi pytest httpx

      - name: Run prediction tests
        working-directory: predict
        run: npm test

      - name: Run discovery tests
        working-directory: discovery
        run: npm test

      - name: Run RSS bridge tests
        run: >-
          python -m pytest
          tools/test_phase18_rss_bridge.py
          tools/test_phase19_account_bridge.py
