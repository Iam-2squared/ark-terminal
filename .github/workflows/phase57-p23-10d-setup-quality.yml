name: Phase57 P23.10D Setup Quality Remeasurement

on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-chart-setup-quality.js'
      - 'predict/daytrade/run-phase57-chart-setup-quality-remeasurement.mjs'
      - 'predict/tests/p23-10d-setup-quality.test.mjs'
      - '.github/workflows/phase57-p23-10d-setup-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-quality-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            symbols: '7203.T,6758.T,9984.T,8306.T,8035.T,6501.T,6861.T,6098.T,9432.T,9433.T'
          - shard: 1
            symbols: '9983.T,4063.T,6367.T,6954.T,7011.T,8058.T,8001.T,8316.T,8411.T,8766.T'
          - shard: 2
            symbols: '7741.T,7974.T,6902.T,7267.T,6594.T,4502.T,4519.T,2914.T,4661.T,6273.T'
    env:
      PHASE57_SYMBOLS: ${{ matrix.symbols }}
      PHASE57_MIN_HISTORY_BARS: '1600'
      PHASE57_STEP_BARS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test causal setup quality scoring
        run: node predict/tests/p23-10d-setup-quality.test.mjs
      - name: Remeasure fixed 10-symbol shard
        run: node predict/daytrade/run-phase57-chart-setup-quality-remeasurement.mjs
      - name: Verify safety and methodology
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync('artifacts/phase57-p23-10d-setup-quality.json','utf8'));
          if (result.methodology.qualityScoreOutcomeTuned !== false) throw new Error('quality score may not be outcome tuned');
          if (result.methodology.futureOutcomesEvaluationOnly !== true) throw new Error('future outcomes must remain evaluation only');
          for (const key of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','overnightHoldingAllowed']) if (result[key] !== false) throw new Error(`${key} must remain false`);
          NODE
      - name: Rename shard artifact
        run: mv artifacts/phase57-p23-10d-setup-quality.json artifacts/phase57-p23-10d-setup-quality-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-10d-setup-quality-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-10d-setup-quality-shard-${{ matrix.shard }}.json
