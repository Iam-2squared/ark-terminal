name: Phase57 P25 Lane C Capital Efficiency Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/analyze_p25_lane_c_capital_efficiency.mjs'
      - 'scripts/run_p25_lane_c_exit_v3_diagnostic.mjs'
      - 'predict/portfolio/phase57-p25-lane-c-exit-v3-connector.js'
      - 'predict/portfolio/phase57-p25-lane-c-portfolio-simulator.js'
      - '.github/workflows/phase57-p25-lane-c-capital-efficiency-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download immutable EXIT v3 replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/v3
          gh run download 33037297017 -n phase57-p25-exit-v3-historical-replay-legacy27 -D tmp/v3
      - name: Download lineage-pinned P25 captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp/inputs
          gh run download 32831810521 -n phase57-p25-3q-inputs-2026-08-25 -D tmp/inputs
      - name: Read immutable Fixed Lane C baseline summary
        run: |
          git fetch origin automation/p25-lane-c-data --depth=1
          git show FETCH_HEAD:data/p25-lane-c/fixed/2026-08-25.summary.json > tmp/fixed-summary.json
      - name: Rebuild EXIT v3 Lane C diagnostic
        run: |
          node scripts/run_p25_lane_c_exit_v3_diagnostic.mjs \
            --replay tmp/v3/p25-exit-v3-historical-replay-legacy27.json \
            --captures-dir tmp/inputs/captures \
            --fixed-summary tmp/fixed-summary.json \
            --output tmp/lane-c-exit-v3-diagnostic.json
      - name: Analyze capital efficiency
        run: |
          node scripts/analyze_p25_lane_c_capital_efficiency.mjs \
            --input tmp/lane-c-exit-v3-diagnostic.json \
            --output tmp/lane-c-capital-efficiency.json | tee tmp/lane-c-capital-efficiency.console.json
      - name: Guard diagnostic classification and safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('tmp/lane-c-capital-efficiency.json','utf8'));
          if(x.status!=='LANE_C_CAPITAL_EFFICIENCY_DIAGNOSTIC_READY') throw new Error('unexpected status');
          if(x.interpretation?.winnerSelectionAllowed!==false||x.interpretation?.formalOos!==false||x.interpretation?.promotionEligible!==false) throw new Error('classification guard failed');
          if(x.interpretation?.rankingRuleTuningAllowed!==false||x.interpretation?.allocationRuleTuningAllowed!==false) throw new Error('retuning guard failed');
          if((x.profiles??[]).length!==4) throw new Error('expected four allocation profiles');
          for(const key of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed']) if(x.safety?.[key]!==false) throw new Error(`safety guard ${key}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-lane-c-capital-efficiency-legacy27
          path: |
            tmp/lane-c-capital-efficiency.json
            tmp/lane-c-capital-efficiency.console.json
          retention-days: 90
