name: Phase57 NEW LONG EXIT Early Failure Protect v1 FAST-FAIL
on:
  pull_request:
    paths:
      - '.github/workflows/phase57-new-long-exit-early-failure-protect-v1.yml'
      - 'scripts/*phase57_new_long_exit_early_failure_protect_v1_fast_fail*'
      - 'docs/evidence/phase57-new-long-exit-early-failure-protect-v1-contract-2026-09-18.md'
permissions: {contents: read}
jobs:
  early-failure-protect-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - env: {ARK_TEST_OFFLINE: '1'}
        run: python3 scripts/offline/kernel_exec.py python3 -m unittest scripts.test_phase57_new_long_exit_early_failure_protect_v1_fast_fail
      - env: {ARK_TEST_OFFLINE: '1'}
        run: |
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_early_failure_protect_v1_fast_fail --out /tmp/efp1-a | tee /tmp/efp1.txt
          python3 scripts/offline/kernel_exec.py python3 -m scripts.phase57_new_long_exit_early_failure_protect_v1_fast_fail --out /tmp/efp1-b >/tmp/efp1b.txt
          cmp /tmp/efp1-a/summary.json /tmp/efp1-b/summary.json
          cmp /tmp/efp1-a/ledger.json.gz /tmp/efp1-b/ledger.json.gz
          cmp /tmp/efp1-a/manifest.json /tmp/efp1-b/manifest.json
