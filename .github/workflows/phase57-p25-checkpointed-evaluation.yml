name: Phase57 P25 Checkpointed Evaluation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-checkpointed-evaluation.yml'
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      evidence_date:
        description: 'Immutable evidence date (YYYY-MM-DD); blank = latest persisted evidence date'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-checkpointed-evaluation
  cancel-in-progress: true

env:
  BATCH_SIZE: '80'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      evidence_date: ${{ steps.resolve.outputs.evidence_date }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve latest immutable evidence date
        id: resolve
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          if [ -n "${REQUESTED_DATE:-}" ]; then
            EVIDENCE_DATE="$REQUESTED_DATE"
          else
            EVIDENCE_DATE="$(git ls-tree -r --name-only origin/automation/p25-evidence-data -- data/p25-evidence-lineage \
              | sed -n 's#data/p25-evidence-lineage/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)-manifest.json#\1#p' \
              | sort | tail -n1)"
          fi
          if ! [[ "$EVIDENCE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "no valid immutable evidence date available" >&2
            exit 1
          fi
          echo "EVIDENCE_DATE=$EVIDENCE_DATE" >> "$GITHUB_ENV"
          echo "evidence_date=$EVIDENCE_DATE" >> "$GITHUB_OUTPUT"
      - name: Skip if dated evaluation already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin automation/p25-evaluation-data >/dev/null 2>&1; then
            git fetch origin automation/p25-evaluation-data:refs/remotes/origin/automation/p25-evaluation-data
            if git cat-file -e "origin/automation/p25-evaluation-data:data/p25-evaluations/${EVIDENCE_DATE}.json" 2>/dev/null \
              && git cat-file -e "origin/automation/p25-evaluation-data:data/p25-scorecards/${EVIDENCE_DATE}.json" 2>/dev/null; then
              echo "already_persisted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "already_persisted=false" >> "$GITHUB_OUTPUT"
      - name: Load full lineage-pinned immutable evidence set
        if: steps.existing.outputs.already_persisted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/p25-day-data:refs/remotes/origin/automation/p25-day-data
          mkdir -p /tmp/p25-inputs/captures
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-manifest.json" > /tmp/p25-inputs/lineage.json
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-integrity.json" > /tmp/p25-inputs/integrity.json
          mapfile -t dates < <(node -e "const x=require('/tmp/p25-inputs/lineage.json'); for (const n of x.manifest?.nodes ?? []) console.log(n.sessionDate)")
          if [ "${#dates[@]}" -eq 0 ]; then
            echo 'lineage manifest contains no frozen capture nodes' >&2
            exit 1
          fi
          for date in "${dates[@]}"; do
            if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "invalid session date in lineage manifest: $date" >&2
              exit 1
            fi
            git show "origin/automation/p25-day-data:data/p25-day-sessions/${date}.json" > "/tmp/p25-inputs/captures/${date}.json"
          done
      - name: Download exact pinned P24 canonical byte snapshot
        if: steps.existing.outputs.already_persisted != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-inputs/history.json
      - name: Build deterministic cumulative checkpoint matrix
        if: steps.existing.outputs.already_persisted != 'true'
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/p25-inputs/matrix.json
          import fs from 'node:fs';
          import path from 'node:path';
          import {buildP253PCheckpointPlan} from './predict/daytrade/phase57-p25-3p-checkpoint-plan.js';
          const lineage=JSON.parse(fs.readFileSync('/tmp/p25-inputs/lineage.json','utf8'));
          const dates=[...new Set((lineage.manifest?.nodes ?? []).map(x=>String(x.sessionDate??'')))].sort();
          const readySessionDates=[];
          const include=[];
          for(const sessionDate of dates){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(sessionDate))throw new Error(`invalid session date ${sessionDate}`);
            const capture=JSON.parse(fs.readFileSync(path.join('/tmp/p25-inputs/captures',`${sessionDate}.json`),'utf8'));
            if(capture?.collection?.ready!==true){
              if(Array.isArray(capture?.sessions)&&capture.sessions.length)throw new Error(`blocked capture unexpectedly exposes session bars for ${sessionDate}`);
              continue;
            }
            const session=capture.sessions?.[0];
            if(!session)throw new Error(`ready capture missing session bundle for ${sessionDate}`);
            readySessionDates.push(sessionDate);
            const plan=buildP253PCheckpointPlan({universeRecord:session.universeRecord,batchSize:Number(process.env.BATCH_SIZE)});
            for(const batch of plan.batches)include.push({sessionDate,batchIndex:batch.batchIndex});
          }
          if(include.length===0)throw new Error('empty cumulative checkpoint matrix');
          if(include.length>256)throw new Error(`checkpoint matrix exceeds GitHub limit: ${include.length}`);
          fs.writeFileSync('/tmp/p25-inputs/plan-summary.json',JSON.stringify({schemaVersion:1,evidenceDate:process.env.EVIDENCE_DATE,batchSize:Number(process.env.BATCH_SIZE),sessionDates:dates,readySessionDates,jobCount:include.length},null,2)+'\n');
          process.stdout.write(JSON.stringify({include}));
          NODE
          echo "matrix=$(cat /tmp/p25-inputs/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/p25-inputs/plan-summary.json
      - name: Upload frozen cumulative evaluation inputs
        if: steps.existing.outputs.already_persisted != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-3q-inputs-${{ env.EVIDENCE_DATE }}
          path: /tmp/p25-inputs
          retention-days: 30

  shard:
    needs: prepare
    if: needs.prepare.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      EVIDENCE_DATE: ${{ needs.prepare.outputs.evidence_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: phase57-p25-3q-inputs-${{ env.EVIDENCE_DATE }}
          path: /tmp/p25-inputs
      - name: Run immutable scorer shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p25-checkpoint
          node scripts/run_p25_checkpoint_shard.mjs --history-pack /tmp/p25-inputs/history.json --capture "/tmp/p25-inputs/captures/${{ matrix.sessionDate }}.json" --batch-index "${{ matrix.batchIndex }}" --batch-size "$BATCH_SIZE" --output "/tmp/p25-checkpoint/checkpoint-${{ matrix.sessionDate }}-${{ matrix.batchIndex }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-3q-checkpoint-${{ env.EVIDENCE_DATE }}-${{ matrix.sessionDate }}-${{ matrix.batchIndex }}
          path: /tmp/p25-checkpoint/*.json
          retention-days: 30

  recombine:
    needs: [prepare, shard]
    if: needs.prepare.outputs.matrix != '' && needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DATE: ${{ needs.prepare.outputs.evidence_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: phase57-p25-3q-inputs-${{ env.EVIDENCE_DATE }}
          path: /tmp/p25-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-p25-3q-checkpoint-${{ env.EVIDENCE_DATE }}-*
          path: /tmp/p25-checkpoints
          merge-multiple: true
      - name: Recombine full-union ledger and evaluate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/recombine_p25_checkpoint_evaluation.mjs --history-pack /tmp/p25-inputs/history.json --capture-dir /tmp/p25-inputs/captures --integrity-ledger /tmp/p25-inputs/integrity.json --lineage-manifest /tmp/p25-inputs/lineage.json --checkpoint-dir /tmp/p25-checkpoints --output /tmp/p25-evaluation.json
          node scripts/build_p25_trade_pace_scorecard.mjs --evaluation /tmp/p25-evaluation.json --output /tmp/p25-scorecard.json
      - name: Verify cumulative full-union lineage before persistence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lineage=JSON.parse(fs.readFileSync('/tmp/p25-inputs/lineage.json','utf8'));
          const evaluation=JSON.parse(fs.readFileSync('/tmp/p25-evaluation.json','utf8'));
          const expected=[...new Set((lineage.manifest?.nodes ?? []).map(x=>String(x.sessionDate??'')))].filter(Boolean).sort();
          const captured=fs.readdirSync('/tmp/p25-inputs/captures').filter(x=>x.endsWith('.json')).map(x=>x.replace(/\.json$/,'')).sort();
          if(JSON.stringify(expected)!==JSON.stringify(captured))throw new Error(`capture full-union mismatch expected=${expected} captured=${captured}`);
          if(Number(evaluation.inputs?.captureArtifactCount)!==expected.length)throw new Error(`evaluation capture count mismatch ${evaluation.inputs?.captureArtifactCount}/${expected.length}`);
          if(evaluation.methodology?.checkpointedComputeOnly!==true)throw new Error('checkpointed compute marker missing');
          if(evaluation.methodology?.freshHoldoutConsumed!==false)throw new Error('fresh holdout safety mismatch');
          NODE
      - name: Persist evaluation and scorecard atomically
        shell: bash
        run: |
          set -euo pipefail
          eval_head="$(node -e "const x=require('/tmp/p25-evaluation.json'); console.log(x.inputs.lineageManifestHeadSha256)")"
          score_head="$(node -e "const x=require('/tmp/p25-scorecard.json'); console.log(x.inputs.lineageManifestHeadSha256)")"
          test "$eval_head" = "$score_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin automation/p25-evaluation-data:refs/remotes/origin/automation/p25-evaluation-data || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/p25-evaluation-data; then
            git switch -C automation/p25-evaluation-data origin/automation/p25-evaluation-data
          else
            git switch --orphan automation/p25-evaluation-data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data/p25-evaluations data/p25-scorecards
          eval_target="data/p25-evaluations/${EVIDENCE_DATE}.json"
          score_target="data/p25-scorecards/${EVIDENCE_DATE}.json"
          if [ -e "$eval_target" ] || [ -e "$score_target" ]; then
            test -f "$eval_target" -a -f "$score_target"
          else
            cp /tmp/p25-evaluation.json "$eval_target"
            cp /tmp/p25-scorecard.json "$score_target"
            git add "$eval_target" "$score_target"
            git commit -m "Phase57 P25 cumulative checkpointed evaluation ${EVIDENCE_DATE}"
            git push origin HEAD:automation/p25-evaluation-data
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-checkpointed-evaluation-${{ env.EVIDENCE_DATE }}
          path: |
            /tmp/p25-evaluation.json
            /tmp/p25-scorecard.json
            /tmp/p25-inputs/plan-summary.json
          retention-days: 90
      - name: Safety boundary
        run: echo 'Research-only evaluation; execution and external writes remain disabled.'
