name: Capital BigWinner one-shot existing Development source
on:
  push:
    branches: [capital-state9-vnext-20261004]
    paths:
      - .github/workflows/capital-bigwinner-saved-source-20261004.yml
      - research/capital-bigwinner-one-shot-20261004-v1/recover_saved_source.py
      - research/capital-bigwinner-one-shot-20261004-v1/SOURCE_RECOVERY_SCOPE.json
      - research/capital-bigwinner-one-shot-20261004-v1/SOURCE_RECOVERY_SCOPE_COHORT_SUPPLEMENT.json
permissions:
  contents: read
  actions: read
concurrency:
  group: capital-bigwinner-source-20261004
  cancel-in-progress: false
jobs:
  recovery:
    if: github.ref == 'refs/heads/capital-state9-vnext-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-expansion-raw-minute-*-35447995157
          repository: Iam-2squared/ark-terminal
          run-id: 35447995157
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bigwinner-encrypted
      - name: Exact allowed Development source only; no provider access
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python -u research/capital-bigwinner-one-shot-20261004-v1/recover_saved_source.py --archives "$RUNNER_TEMP/bigwinner-encrypted" --scope research/capital-bigwinner-one-shot-20261004-v1/SOURCE_RECOVERY_SCOPE_COHORT_SUPPLEMENT.json --out "$RUNNER_TEMP/bigwinner-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capital-bigwinner-source-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/bigwinner-source/SAVED_SOURCE_RECEIPT.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: capital-bigwinner-source-private-${{ github.run_id }}
          path: ${{ runner.temp }}/bigwinner-source/SAVED_SOURCE_PRIVATE.json.gz
          retention-days: 30
          if-no-files-found: error
