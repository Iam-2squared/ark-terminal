name: Phase56 Fusion Real Baseline
on:
  pull_request:
    paths:
      - 'predict/scripts/phase56-fusion-real-baseline.mjs'
      - 'predict/chart/phase56-oos-adaptive-fusion.js'
      - 'predict/chart/phase56-selective-signal.js'
      - 'predict/chart/phase56-regime-horizon.js'
      - '.github/workflows/phase56-fusion-real-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fusion real-data chart baseline
        run: node predict/scripts/phase56-fusion-real-baseline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase56-fusion-real-baseline
          path: phase56-fusion-real-baseline.json
