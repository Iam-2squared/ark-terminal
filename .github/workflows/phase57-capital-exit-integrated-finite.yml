name: Phase57 Capital EXIT Integrated Finite Development
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - docs/evidence/phase57-capital-exit-integrated/FINITE_LAUNCH.json
      - docs/evidence/phase57-capital-exit-integrated/FINITE_RECOVERY_LAUNCH.json
permissions:
  contents: read
concurrency:
  group: phase57-capital-exit-integrated-finite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  six-arm-replay-once:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8
      - name: Verify preflight implementation SHA and frozen launch marker
        env:
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          marker=pathlib.Path('docs/evidence/phase57-capital-exit-integrated/FINITE_RECOVERY_LAUNCH.json')
          x=json.loads(marker.read_text() if marker.exists() else pathlib.Path('docs/evidence/phase57-capital-exit-integrated/FINITE_LAUNCH.json').read_text())
          assert x['implementationSha']==subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert x['precommitSha256']==hashlib.sha256(pathlib.Path('docs/evidence/phase57-capital-exit-integrated/INTEGRATION_PRECOMMIT.json').read_bytes()).hexdigest()
          assert x['requiredCiConclusion']=='success' and x['replaysBeforeLaunch']==0 and x['performanceInspectedBeforeLaunch']==False
          for path,digest in x['testedSourceSha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest
          assert len(x['safety'])==9 and not any(x['safety'].values())
          PY
      - run: python -m unittest -q scripts.test_phase57_capital_exit_integrated
      - name: One 24-session zero-fit six-arm integrated replay
        run: python -m scripts.phase57_capital_exit_integrated --mode finite --out /tmp/phase57-capital-exit-integrated-result
      - name: Validate saved result and no formal selection
        run: |
          python - <<'PY'
          import gzip,hashlib,json,pathlib
          d=pathlib.Path('/tmp/phase57-capital-exit-integrated-result')
          r=json.loads((d/'report.json').read_text());m=json.loads((d/'manifest.json').read_text())
          assert r['status']=='EXPERIMENTAL_DEVELOPMENT_INTEGRATED_REPLAY'
          assert r['modelFits']==r['providerRequests']==r['protectedPartitionsOpened']==0
          assert not r['rankSelected'] and not r['finalExitSelected'] and not any(r['safety'].values())
          assert len(list(d.glob('*_ledger.json.gz')))==6 and len(list(d.glob('*_curve.csv')))==6
          assert len(list(d.glob('*.png')))==3
          for name,digest in m['filesSha256'].items():
              assert hashlib.sha256((d/name).read_bytes()).hexdigest()==digest
          for short in ('IM','R1'):
              arm=r['arms'][short]
              for method in ('V3_B_TERMINAL','V3_B_R50_A','CAUSAL_RANK_R50_A'):
                  x=arm[method]
                  assert x['dailySummary']['tradingSessions']==24
                  assert sum(z['count'] for z in x['fundedUpsideBuckets'])==x['turnover']['fundedEntries']
                  ledger=json.loads(gzip.decompress((d/f'{short}_{method}_ledger.json.gz').read_bytes()))
                  assert all(int(v['quantity'])%100==0 for v in ledger['funded'].values())
                  assert all(float(v['cashJpy'])>=0 and v['openCount']<=3 for v in ledger['snapshots'])
                  assert x['upside']['positiveN']==x['upside']['hitN']+x['upside']['missN']
                  assert sum(x['upside']['missReasons'].values())==x['upside']['missN']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-capital-exit-integrated-development-result
          path: /tmp/phase57-capital-exit-integrated-result/
          if-no-files-found: error
