name: Phase57 P25 Data-Driven EXIT Paired

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase57-p25-data-driven-exit-paired.yml'
      - 'scripts/run_p25_data_driven_exit_paired.mjs'
      - 'predict/daytrade/phase57-p25-data-driven-exit.js'
      - 'predict/daytrade/phase57-p25-data-driven-exit-multisession.js'
  workflow_dispatch:
    inputs:
      evidence_date:
        description: 'Immutable evidence date YYYY-MM-DD; blank = latest available'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-data-driven-exit-paired
  cancel-in-progress: false

jobs:
  evaluate-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve immutable evidence
        id: plan
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          if [ -n "${REQUESTED_DATE:-}" ]; then evidence_date="$REQUESTED_DATE"; else evidence_date="$(git ls-tree -r --name-only origin/automation/p25-evidence-data -- data/p25-evidence-lineage | sed -n 's#data/p25-evidence-lineage/\([0-9][0-9-]*\)-manifest.json#\1#p' | sort | tail -1)"; fi
          [[ "$evidence_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "evidence_date=$evidence_date" >> "$GITHUB_OUTPUT"
      - name: Load immutable lineage and captures
        shell: bash
        env:
          EVIDENCE_DATE: ${{ steps.plan.outputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          git fetch origin automation/p25-day-data:refs/remotes/origin/automation/p25-day-data
          manifest_path="data/p25-evidence-lineage/${EVIDENCE_DATE}-manifest.json"
          integrity_path="data/p25-evidence-lineage/${EVIDENCE_DATE}-integrity.json"
          git show "origin/automation/p25-evidence-data:$manifest_path" > /tmp/p25-evidence-lineage-manifest.json
          git show "origin/automation/p25-evidence-data:$integrity_path" > /tmp/p25-session-integrity-ledger.json
          mkdir -p /tmp/p25-day-sessions
          mapfile -t dates < <(node -e "const x=require('/tmp/p25-evidence-lineage-manifest.json'); for (const n of x.manifest?.nodes ?? []) console.log(n.sessionDate)")
          for date in "${dates[@]}"; do
            [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            git show "origin/automation/p25-day-data:data/p25-day-sessions/${date}.json" > "/tmp/p25-day-sessions/${date}.json"
          done
      - name: Download exact pinned P24 canonical byte snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"
          test -n "$snapshot"
          echo "P24_CANONICAL_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
      - name: Rebuild pinned historical analog source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$P24_CANONICAL_SNAPSHOT" --output /tmp/p25-pinned-history-pack.json
      - name: Evaluate exact DYNAMIC_50 Fixed vs data-driven EXIT
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_p25_data_driven_exit_paired.mjs \
            --history-pack /tmp/p25-pinned-history-pack.json \
            --capture-dir /tmp/p25-day-sessions \
            --integrity-ledger /tmp/p25-session-integrity-ledger.json \
            --lineage-manifest /tmp/p25-evidence-lineage-manifest.json \
            --output /tmp/p25-data-driven-exit-paired.json
          node - <<'NODE'
          const x=require('/tmp/p25-data-driven-exit-paired.json');
          if(x.safety?.executionAllowed!==false||x.safety?.brokerWriteAllowed!==false||x.safety?.excelOrderWriteAllowed!==false||x.safety?.rssOrderFunctionAllowed!==false||x.safety?.liveTradingAllowed!==false||x.safety?.paperTradingAllowed!==false||x.safety?.automaticPromotionAllowed!==false||x.safety?.productionUpdateAllowed!==false||x.safety?.transmitted!==false||x.safety?.freshHoldoutConsumed!==false) throw new Error('safety flag violation');
          if(x.methodology?.exactDynamic50Only!==true||x.methodology?.resultBasedRetuning!==false) throw new Error('methodology guard violation');
          if(!(Number(x.result?.summary?.pairedCount)>=0)) throw new Error('paired summary missing');
          NODE
      - name: Persist append-only evidence
        shell: bash
        env:
          EVIDENCE_DATE: ${{ steps.plan.outputs.evidence_date }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='automation/p25-data-driven-exit-data'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch":refs/remotes/origin/"$branch"
            git switch -C "$branch" origin/"$branch"
          else
            git switch --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data/p25-data-driven-exit
          target="data/p25-data-driven-exit/${EVIDENCE_DATE}.json"
          if [ -f "$target" ]; then
            cmp -s "$target" /tmp/p25-data-driven-exit-paired.json || { echo 'append-only conflict'; exit 1; }
            echo 'same evidence already persisted; idempotent no-op'
          else
            cp /tmp/p25-data-driven-exit-paired.json "$target"
            git add "$target"
            git commit -m "Phase57 P25 data-driven EXIT ${EVIDENCE_DATE}"
            git push origin HEAD:"$branch"
          fi
      - name: Upload paired artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p25-data-driven-exit-${{ steps.plan.outputs.evidence_date }}
          path: /tmp/p25-data-driven-exit-paired.json
          retention-days: 90
      - name: Safety boundary
        run: |
          echo 'Research-only exact DYNAMIC_50 Fixed vs data-driven EXIT paired evaluation.'
          echo 'No Entry/model/universe/threshold/Dynamic-N/fair-cutoff retuning and no fresh holdout.'
          echo 'No broker, Excel, RSS order, MARKETSPEED, paper/live trading, promotion, transmission, or production update.'
