name: No11 prestart source retry offline
on:
  push:
    branches: [fix/no11-week-resilience-20261108]
    paths:
      - 'research/no11-morning-master-20261103/no11_prestart_source_retry.py'
      - 'research/no11-morning-master-20261103/test_no11_prestart_*.py'
      - 'research/no11-morning-master-20261103/Request-No11PrestartSourceRetry.ps1'
      - 'research/no11-morning-master-20261103/Bootstrap-No11PrestartSourceRetry.ps1'
      - 'research/no11-morning-master-20261103/no11_weekly_filtered_lineage.py'
      - 'research/no11-morning-master-20261103/no11_manual_reconnect_review.py'
      - 'research/no11-morning-master-20261103/install_no11_weekly_filtered_lineage.py'
      - 'research/no11-morning-master-20261103/test_no11_weekly_filtered_install.py'
      - '.github/workflows/no11-prestart-source-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/no11-morning-master-20261103
      - name: Immutable Git source SHA256 identities
        shell: bash
        run: |
          python3 -B - <<'PY'
          import hashlib, subprocess
          base = 'research/no11-morning-master-20261103/'
          for name in ('Bootstrap-No11PrestartSourceRetry.ps1',
                       'Request-No11PrestartSourceRetry.ps1',
                       'no11_prestart_source_retry.py',
                       'no11_weekly_filtered_lineage.py',
                       'no11_manual_reconnect_review.py'):
              raw = subprocess.check_output(['git', 'show', 'HEAD:' + base + name])
              print('NO11_RELEASE_SHA256|' + name + '=' + hashlib.sha256(raw).hexdigest())
          PY
  prior-failure-preserved-once-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict retry, source lineage and installer regressions
        shell: bash
        run: |
          python -B -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_prestart_source_retry.py -v
          python -B -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_prestart_external_positions.py -v
          python -B -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_weekly_filtered_lineage.py -v
          python -B -m unittest discover -s research/no11-morning-master-20261103 -p test_no11_weekly_filtered_install.py -v
      - name: Generate staged original operator with offline fixture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -B - <<'PY'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path('research/no11-morning-master-20261103').resolve()))
          import test_no11_prestart_source_retry as t
          f = t.fixture(Path(tempfile.mkdtemp(prefix='ark-prestart-parser-', dir=os.environ['RUNNER_TEMP'])))
          m = t.retry.stage(f['store'], f['root'] / 'package', now=t.NOW)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('ARK_PRESTART_OPERATOR=' + m['operatorScript'] + '\n')
          print('STAGED_ORIGINAL_OPERATOR_CREATED_WITHOUT_EXCEL_OR_TRADE')
          PY
      - name: Windows PowerShell 5.1 parser and no-Excel entry checks
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = Join-Path $PWD 'research/no11-morning-master-20261103/Request-No11PrestartSourceRetry.ps1'
          $release = Join-Path $PWD 'research/no11-morning-master-20261103/Bootstrap-No11PrestartSourceRetry.ps1'
          $paths = @($entry, $env:ARK_PRESTART_OPERATOR)
          if (Test-Path -LiteralPath $release) { $paths += $release }
          foreach ($path in $paths) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw ('POWERSHELL_PARSE_FAILED: ' + ($errors | Out-String)) }
          }
          & $entry -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'ENTRY_SELFTEST_FAILED' }
          if (Test-Path -LiteralPath $release) {
            & $release -OfflineSelfTest
            if ($LASTEXITCODE -ne 0) { throw 'RELEASE_SELFTEST_FAILED' }
          }
