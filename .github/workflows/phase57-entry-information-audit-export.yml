name: Phase57 Entry information audit export
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths: [.github/workflows/phase57-entry-information-audit-export.yml]
permissions:
  contents: read
jobs:
  pinned-development-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7599df41199a8c4d1ea86d5f3cb595edd599dd21
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact allowlist only, no model imports or market providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import pathlib, json, hashlib, gzip, shutil
          root=pathlib.Path('.')
          out=pathlib.Path('entry-information-export')
          out.mkdir(exist_ok=False)
          files=[
            'docs/evidence/phase57-msh-entry-long-v1-preimplementation-feasibility-events.ndjson.gz',
            'docs/evidence/phase57-msh-entry-long-v1-historical-remeasurement/frozen-predictions.ndjson.gz',
            'docs/evidence/phase57-msh-entry-long-v1-historical-remeasurement/path-diagnostics.json.gz',
            'docs/evidence/phase57-entry-v2-2-fast-fail/target-ledger.json.gz',
            'docs/evidence/phase57-entry-v2-3-fast-fail/label-ledger.json.gz',
            'docs/evidence/phase57-entry-v2-3-fast-fail/manifest.json',
            'docs/evidence/phase57-entry-v2-3-fast-fail/manifest.json.sha256',
            'docs/evidence/phase57-msh-entry-long-v2-development/paths.json.gz',
            'docs/evidence/phase57-msh-entry-long-v2-architecture/feature-inventory.json',
            'predict/research/phase57-entry-v2-3-fast-fail-protocol-v1.json',
            'scripts/phase57_entry_v23_fast_fail.py',
            'scripts/phase57_entry_v22_fast_fail.py'
          ]
          manifest={'sourceHead':'7599df41199a8c4d1ea86d5f3cb595edd599dd21','scope':'EXISTING_76_SESSION_DEVELOPMENT_ONLY','sourceFiles':{},'missing':[], 'newFit':0,'newPrediction':0,'providerRequests':0,'freshAccess':0,'oosAccess':0,'tradingEnabled':False}
          for name in files:
              p=root/name
              if not p.is_file():
                  manifest['missing'].append(name)
                  continue
              raw=p.read_bytes()
              manifest['sourceFiles'][name]={'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              q=out/name
              q.parent.mkdir(parents=True,exist_ok=True)
              q.write_bytes(raw)
              if p.suffix=='.gz':
                  decoded=gzip.decompress(raw).decode()
                  v=json.loads(decoded.splitlines()[0]) if '.ndjson.' in name else json.loads(decoded)
                  if isinstance(v,list):
                      sample=v[0] if v else None
                      count=len(v)
                  else:
                      sample={k:(x[:1] if isinstance(x,list) else x) for k,x in v.items()}
                      count={k:len(x) for k,x in v.items() if isinstance(x,list)}
                  print(json.dumps({'path':name,'count':count,'sample':sample},ensure_ascii=False)[:6000])
          (out/'export-manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: entry-information-pinned-development-7599df4119
          path: entry-information-export/
          retention-days: 7
          if-no-files-found: error
