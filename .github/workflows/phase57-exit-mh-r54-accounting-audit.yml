name: Phase57 R54 frozen R34 Layer A accounting audit
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - docs/evidence/phase57-exit-mh-r54/CYCLE2_LAYER_A_AUDIT_LAUNCH.json
permissions:
  contents: read
  actions: read
concurrency:
  group: phase57-r54-layer-a-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile-saved-result:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: '.'
      PYTHONDONTWRITEBYTECODE: '1'
      ARK_TEST_OFFLINE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8 joblib==1.5.2
      - name: Test frozen sell-fee algebra without Development performance
        run: python -m unittest -q scripts.test_phase57_mh_layer_a_accounting_audit_r54
      - uses: actions/download-artifact@v4
        with:
          repository: Iam-2squared/ark-terminal
          run-id: 36382668368
          name: phase57-r54-all-replays-36382668368
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/r54-result
      - name: Reconcile saved Layer A against frozen R34 and reapply unchanged Gate
        run: python -m scripts.phase57_mh_layer_a_accounting_audit_r54 --result "$RUNNER_TEMP/r54-result" --out "$RUNNER_TEMP/r54-r34-audit"
      - name: Save original and corrected disposition separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-r54-r34-accounting-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/r54-r34-audit
          if-no-files-found: warn
