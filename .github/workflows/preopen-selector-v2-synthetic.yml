name: Preopen Selector V2 - Synthetic Only

on:
  push:
    branches:
      - research/preopen-selector-v2-design-20261014
      - research/preopen-selector-v2-engineering-*
    paths:
      - 'research/preopen-selector-v2-20261014/**'
      - '.github/workflows/preopen-selector-v2-synthetic.yml'
  pull_request:
    branches: [research/preopen-selector-v2-design-20261014]
    types: [opened, synchronize, reopened]
    paths:
      - 'research/preopen-selector-v2-20261014/**'
      - '.github/workflows/preopen-selector-v2-synthetic.yml'

permissions:
  contents: read

concurrency:
  group: preopen-v2-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v2-engineering:
    name: V2 72 requirements, optional contracts, two-model synthetic E2E
    if: github.event_name == 'push' || (github.event.pull_request.draft == true && startsWith(github.head_ref, 'research/preopen-selector-v2-engineering-'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Keep Python bytecode outside checkout
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/v2-pycache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            research/preopen-selector-v2-20261014
            research/independent-long-selector-20261012-v1
            .github/workflows
          sparse-checkout-cone-mode: false
      - name: Fetch immutable audit base only
        run: git fetch --depth=1 origin 4b02c4eb6fed0b75bfc7a6e8afc49d7868696159
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed engineering and type-check dependencies
        run: |
          python -m pip install -r research/preopen-selector-v2-20261014/requirements-engineering.lock
          python -m pip install -r research/preopen-selector-v2-20261014/requirements-typecheck.lock
      - name: Syntax and typed contracts
        run: |
          python -m compileall -q research/preopen-selector-v2-20261014
          cd research/preopen-selector-v2-20261014
          python -m mypy --ignore-missing-imports --follow-imports=silent --cache-dir="$RUNNER_TEMP/v2-mypy" src/ark_selector_v2 tools/v2_cli.py tools/protection_audit.py tools/ci_receipt.py tools/isolated_host_stage.py tools/metadata_window.py tools/restore_mode_b_sources.py
      - name: V2 required matrix and additional synthetic contracts
        run: python -m unittest discover -s research/preopen-selector-v2-20261014/tests -p 'test_*.py' -v
      - name: Read-only V1 regressions, separate from V2 counts
        run: |
          python -m unittest discover -s research/independent-long-selector-20261012-v1/tests -p 'test_*.py' -v
          python -m unittest discover -s research/independent-long-selector-20261012-v1/preopen_tests -p 'test_*.py' -v
      - name: Actual two-estimator two-temperature synthetic E2E and restore
        run: python research/preopen-selector-v2-20261014/tools/v2_cli.py synthetic-test --output "$RUNNER_TEMP/v2-synthetic-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Same admitted native route with isolated test authority
        run: python research/preopen-selector-v2-20261014/tools/v2_cli.py native-route-test --output "$RUNNER_TEMP/v2-native-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Monthly CSV slices and durable host pins across six stage processes
        run: python research/preopen-selector-v2-20261014/tools/v2_cli.py monthly-host-test --output "$RUNNER_TEMP/v2-monthly-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Whole-tree protected scope and public artifact audit
        run: python research/preopen-selector-v2-20261014/tools/v2_cli.py public-audit
      - name: Bind acceptance to this exact head
        run: |
          python research/preopen-selector-v2-20261014/tools/ci_receipt.py --head "${{ github.sha }}" --run "${{ github.run_id }}" --event "${{ github.event_name }}" --synthetic-receipt "$RUNNER_TEMP/v2-synthetic-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json" --native-receipt "$RUNNER_TEMP/v2-native-${{ github.run_id }}-${{ github.run_attempt }}/native-route-receipt.json" --monthly-receipt "$RUNNER_TEMP/v2-monthly-${{ github.run_id }}-${{ github.run_attempt }}/monthly-host-receipt.json"
