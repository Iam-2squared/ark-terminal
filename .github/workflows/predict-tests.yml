name: Predict Tests

on:
  pull_request:
    paths:
      - "predict/**"
      - ".github/workflows/predict-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: predict/package-lock.json

      - name: Install dependencies
        working-directory: predict
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Run tests
        working-directory: predict
        run: npm test
