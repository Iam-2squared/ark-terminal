name: Phase57 Entry information screen
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths: [.github/workflows/phase57-entry-information-screen.yml]
permissions:
  contents: read
  actions: read
jobs:
  causal-features-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test eight-field contract; no Project fit or prediction
        run: ARK_TEST_OFFLINE=1 python3 scripts/offline/kernel_exec.py python3 scripts/phase57_entry_information_screen.py --test
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-l1-minute-shard-*-34926225832
          path: ${{ runner.temp }}/entry-info-l1
          repository: Iam-2squared/ark-terminal
          run-id: 34926225832
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-l2-minute-shard-*-34936002178
          path: ${{ runner.temp }}/entry-info-l2
          repository: Iam-2squared/ark-terminal
          run-id: 34936002178
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-long-only-v2-minute-shard-*-34964031692
          path: ${{ runner.temp }}/entry-info-v2
          repository: Iam-2squared/ark-terminal
          run-id: 34964031692
          github-token: ${{ github.token }}
      - name: Decrypt already authorized Development cache; no provider calls
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        shell: bash
        run: |
          test -n "${JQUANTS_API_KEY:-}"
          test "$(find "$RUNNER_TEMP/entry-info-l1" "$RUNNER_TEMP/entry-info-l2" "$RUNNER_TEMP/entry-info-v2" -name minute-shard.tar.gz.enc | wc -l)" = 8
          mkdir -p "$RUNNER_TEMP/entry-info-cache"
          while IFS= read -r encrypted; do
            test "$(cut -d' ' -f1 "${encrypted}.sha256")" = "$(sha256sum "$encrypted" | cut -d' ' -f1)"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:JQUANTS_API_KEY -in "$encrypted" | tar -C "$RUNNER_TEMP/entry-info-cache" -xzf -
          done < <(find "$RUNNER_TEMP/entry-info-l1" "$RUNNER_TEMP/entry-info-l2" "$RUNNER_TEMP/entry-info-v2" -name minute-shard.tar.gz.enc | sort)
      - name: Export predeclared causal fields with network denied
        run: ARK_TEST_OFFLINE=1 python3 scripts/offline/kernel_exec.py python3 scripts/phase57_entry_information_screen.py . "$RUNNER_TEMP/entry-info-cache" artifacts/entry-information-screen/features.json.gz
      - name: Purge raw private inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/entry-info-cache" "$RUNNER_TEMP/entry-info-l1" "$RUNNER_TEMP/entry-info-l2" "$RUNNER_TEMP/entry-info-v2"
      - uses: actions/upload-artifact@v4
        with:
          name: entry-information-features-${{ github.run_id }}
          path: artifacts/entry-information-screen/
          if-no-files-found: error
          retention-days: 7
