name: Phase57 P25 Evaluation Fallback

# P25.3J recovery touch: re-run the direct reusable evaluator path against the latest immutable evidence.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase57-p25-evaluation-fallback.yml"
      - ".github/workflows/phase57-p25-evidence-evaluate.yml"
  schedule:
    - cron: '15 9 * * 1-5'
  workflow_dispatch:
    inputs:
      evidence_date:
        description: 'Immutable evidence snapshot date (YYYY-MM-DD); blank = latest available'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-evaluation-fallback
  cancel-in-progress: false

jobs:
  resolve-evidence-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence_date: ${{ steps.resolve.outputs.evidence_date }}
    steps:
      - name: Resolve immutable evidence date
        id: resolve
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.evidence_date }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_DATE:-}" ]; then
            evidence_date="$REQUESTED_DATE"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            evidence_date="$(TZ=Asia/Tokyo date +%F)"
          else
            git init /tmp/p25-evidence-recovery >/dev/null
            cd /tmp/p25-evidence-recovery
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
            git fetch --depth=1 origin automation/p25-evidence-data
            evidence_date="$(git ls-tree -r --name-only FETCH_HEAD -- data/p25-evidence-lineage | sed -n 's#data/p25-evidence-lineage/\([0-9][0-9-]*\)-manifest.json#\1#p' | sort | tail -1)"
          fi

          if ! [[ "$evidence_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid or unavailable immutable evidence date: $evidence_date" >&2
            exit 1
          fi

          echo "resolved immutable evidence date=$evidence_date"
          echo "evidence_date=$evidence_date" >> "$GITHUB_OUTPUT"

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Date resolution reads immutable P25 evidence lineage only.'
          echo 'No model/Entry/universe/threshold change and no broker, Excel, RSS order, MARKETSPEED, board, Tick, paper/live trading, promotion, production update, or fresh holdout action is enabled.'

  evaluate:
    needs: resolve-evidence-date
    uses: ./.github/workflows/phase57-p25-evidence-evaluate.yml
    with:
      evidence_date: ${{ needs.resolve-evidence-date.outputs.evidence_date }}
    permissions:
      contents: write
      actions: read
