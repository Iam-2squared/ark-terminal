name: Phase58 P1 Microstructure Foundation
on:
  pull_request:
    paths:
      - 'predict/scalping/phase58-microstructure-foundation.js'
      - 'predict/tests/p58-1-microstructure-foundation.test.mjs'
      - '.github/workflows/phase58-p1-microstructure-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase58 P1 tests
        run: node --test predict/tests/p58-1-microstructure-foundation.test.mjs
