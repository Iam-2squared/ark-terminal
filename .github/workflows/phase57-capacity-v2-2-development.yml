name: Capacity v2.2 Development-only evaluation
on:
  push:
    branches: [research/phase57-selector-capacity-v2]
    paths: [.github/workflows/phase57-capacity-v2-2-development.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency:
  group: capacity-v22-development-34189128681
  cancel-in-progress: false
jobs:
  development-only:
    if: github.ref == 'refs/heads/research/phase57-selector-capacity-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 483a3c1dbd365e339fc7d77a3a03a9117f49172b
          path: v21-preserved
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify v2.1 preservation and v2.2 precommit
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const files=[
            'scripts/run_phase57_selector_capacity_v2_1.mjs',
            'scripts/recover_phase57_capacity_v2_1_development.mjs',
            'predict/research/phase57-selector-capacity-v2-1-precommit.json',
            'predict/research/phase57-selector-capacity-v2-1-precommit.json.sha256',
            'predict/research/phase57-selector-capacity-v2-1-development-diagnostic.json',
            'docs/phase57-selector-capacity-v2-1-development-diagnostic.md',
            'predict/daytrade/phase57-selector-minimal-hybrid.js',
            'predict/research/phase57-selector-minimal-hybrid-development-model.json'
          ];
          for(const f of files)assert.ok(fs.readFileSync(f).equals(fs.readFileSync('v21-preserved/'+f)),f+' changed');
          const bytes=fs.readFileSync('predict/research/phase57-selector-capacity-v2-2-precommit.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'),'6750071042aa595c1f143e02a6f6e3dc83d4e220c42d45480106a14b1c985323');
          console.log('V21 preserved; V22 precommit verified; all evaluation release flags remain false.');
          JS
      - name: Test forward causality, metric identity and release guards
        run: node --test predict/tests/phase57-capacity-v2-2-development.test.mjs
      - name: Verify only the pinned Development source
        uses: actions/github-script@v7
        with:
          script: |
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:34189128681});
            if(run.head_sha!=='f3543b5a604d25442c28fc3cb475e89274400bd5') throw new Error('SOURCE_SHA_MISMATCH');
            const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:34189128681,per_page:100});
            const names=['capacity-v2-1-allocation-34189128681',...Array.from({length:6},(_,i)=>'capacity-v2-1-development-shard-'+i+'-34189128681')];
            for(const name of names) {
              const matches=artifacts.filter(a=>a.name===name&&!a.expired);
              if(matches.length!==1||matches[0].workflow_run.head_sha!==run.head_sha)throw new Error('ARTIFACT_PROVENANCE_MISMATCH');
            }
      - uses: actions/download-artifact@v4
        with:
          name: capacity-v2-1-allocation-34189128681
          path: artifacts/capacity-v22-input/allocation
          run-id: 34189128681
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: capacity-v2-1-development-shard-*-34189128681
          path: artifacts/capacity-v22-input/shards
          run-id: 34189128681
          github-token: ${{ github.token }}
      - name: Evaluate Development and stop at Freeze or NO-GO
        run: node scripts/run_phase57_selector_capacity_v2_2.mjs development-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-v22-development-${{ github.run_id }}
          path: artifacts/capacity-v22-development/
          retention-days: 90
          if-no-files-found: error
