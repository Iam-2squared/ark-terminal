name: Phase56 P11 Real-Data Nested Training
on:
  pull_request:
    paths:
      - 'predict/scripts/phase56-p11-realdata-nested-training.mjs'
      - 'predict/chart/phase56-multifactor-training.js'
      - 'predict/chart/phase56-multifactor-model.js'
      - 'predict/chart/phase56-precision-search.js'
      - '.github/workflows/phase56-p11-realdata-nested-training.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nested real-data multifactor training
        run: node predict/scripts/phase56-p11-realdata-nested-training.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase56-p11-realdata-nested-training
          path: phase56-p11-realdata-nested-training.json
