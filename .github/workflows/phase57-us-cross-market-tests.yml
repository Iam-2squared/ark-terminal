name: Phase57 US Cross-Market Tests
on:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-us-cross-market-policy.js'
      - 'scripts/build_phase57_us_universe.mjs'
      - 'scripts/fetch_phase57_us_massive_free.mjs'
      - 'scripts/measure_phase57_us_marketwide_5m.mjs'
      - 'predict/tests/phase57-us-cross-market.test.mjs'
      - '.github/workflows/phase57-us-cross-market-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test predict/tests/phase57-us-cross-market.test.mjs
      - run: node --check scripts/build_phase57_us_universe.mjs && node --check scripts/fetch_phase57_us_massive_free.mjs && node --check scripts/measure_phase57_us_marketwide_5m.mjs
      - name: Verify free non-realtime evidence cannot be mislabeled Fresh
        run: |
          mkdir -p tmp
          node - <<'NODE'
          const fs=require('fs');
          const p=fs.readFileSync('scripts/measure_phase57_us_marketwide_5m.mjs','utf8');
          if(!p.includes('free provider data is not real-time')) process.exit(1);
          const f=fs.readFileSync('scripts/fetch_phase57_us_massive_free.mjs','utf8');
          for(const x of ['MASSIVE_API_KEY','freshRealtime:false','noPaidFallback:true','noIexSubstitution:true']) if(!f.includes(x)) process.exit(1);
          NODE
      - name: Safety boundary
        run: echo 'US cross-market validation is research-only; free data is never promoted to realtime Fresh; no broker, RSS order, Excel order, paper/live trading, promotion, or production update.'
