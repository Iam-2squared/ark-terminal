name: Phase57 Selector Minimal Hybrid Phase A

on:
  pull_request:
    paths:
      - 'docs/phase57-selector-v1-v3-minimal-hybrid-spec.md'
      - 'docs/phase57-selector-minimal-hybrid-new-dataset-plan.md'
      - 'predict/daytrade/phase57-selector-minimal-hybrid-dataset-guard.js'
      - 'predict/daytrade/phase57-selector-minimal-hybrid-dataset-audit.js'
      - 'predict/daytrade/phase57-selector-minimal-hybrid-model.js'
      - 'predict/daytrade/phase57-selector-minimal-hybrid-targets.js'
      - 'predict/daytrade/phase57-selector-minimal-hybrid.js'
      - 'predict/research/phase57-selector-minimal-hybrid-phase-a.json'
      - 'predict/research/phase57-selector-minimal-hybrid-phase-a.sha256'
      - 'predict/research/phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.json'
      - 'predict/research/phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.sha256'
      - 'predict/research/phase57-selector-minimal-hybrid-dataset-readiness-2026-09-05.json'
      - 'predict/research/phase57-selector-minimal-hybrid-dataset-readiness-2026-09-05.sha256'
      - 'predict/research/phase57-selector-minimal-hybrid-source-resolution-2026-09-06.json'
      - 'predict/research/phase57-selector-minimal-hybrid-source-resolution-2026-09-06.sha256'
      - 'predict/research/phase57-selector-jquants-free-entitlement-2026-09-06.json'
      - 'predict/research/phase57-selector-jquants-free-entitlement-2026-09-06.sha256'
      - 'docs/phase57-selector-minimal-hybrid-source-resolution-2026-09-06.md'
      - 'predict/tests/phase57-selector-minimal-hybrid-phase-a.test.mjs'
      - 'predict/tests/phase57-selector-minimal-hybrid-dataset-audit.test.mjs'
      - 'predict/tests/phase57-selector-minimal-hybrid-source-resolution.test.mjs'
      - 'predict/tests/phase57-selector-minimal-hybrid-implementation.test.mjs'
      - 'predict/tests/phase57-selector-jquants-minute.test.mjs'
      - 'predict/tests/phase57-selector-jquants-free-probe.test.mjs'
      - 'scripts/lib/phase57-selector-jquants-minute.mjs'
      - 'scripts/probe_phase57_selector_jquants_free.mjs'
      - 'scripts/audit_phase57_selector_minimal_hybrid_dataset.mjs'
      - '.github/workflows/phase57-selector-minimal-hybrid-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen Phase A contract
        run: (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-phase-a.sha256)
      - name: Verify Phase A amendment v1.1 contract
        run: (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.sha256)
      - name: Verify Fresh Dataset readiness evidence
        run: (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-dataset-readiness-2026-09-05.sha256)
      - name: Verify Fresh Source resolution evidence
        run: (cd predict/research && sha256sum --check phase57-selector-minimal-hybrid-source-resolution-2026-09-06.sha256)
      - name: Verify J-Quants Free entitlement evidence
        run: (cd predict/research && sha256sum --check phase57-selector-jquants-free-entitlement-2026-09-06.sha256)
      - name: Verify architecture and dataset contamination guards
        run: node --test predict/tests/phase57-selector-minimal-hybrid-phase-a.test.mjs predict/tests/phase57-selector-minimal-hybrid-dataset-audit.test.mjs predict/tests/phase57-selector-minimal-hybrid-source-resolution.test.mjs predict/tests/phase57-selector-minimal-hybrid-implementation.test.mjs predict/tests/phase57-selector-jquants-minute.test.mjs predict/tests/phase57-selector-jquants-free-probe.test.mjs

  jquants-free-entitlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe authentication and Free entitlement without exposing the secret
        run: node scripts/probe_phase57_selector_jquants_free.mjs --output artifacts/jquants-source-validation.json
      - name: Upload sanitized SOURCE_VALIDATION_ONLY evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-jquants-source-validation-${{ github.run_id }}
          path: artifacts/jquants-source-validation.json
          if-no-files-found: error
          retention-days: 7
