name: Phase57 EXIT v5 Block C Dynamic Unseen Validation

on:
  pull_request:
    branches: [research/phase57-minimal-stateful-hybrid-entry]
    paths:
      - .github/workflows/phase57-exit-v5-block-c.yml
      - scripts/phase57-exit-v5-block-c-measure.mjs
      - scripts/phase57-exit-v4-20session-features.mjs
      - scripts/lib/phase57-exit-v5-dynamic-state.mjs
      - predict/research/phase57-exit-v5-block-c-unseen-v1.json
      - predict/research/phase57-exit-v5-dynamic-state-freeze-v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-exit-v5-block-c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.number == 581 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/phase57-exit-v4-hybrid-msh-large-scale') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/phase57-exit-v4-hybrid-msh-large-scale')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify frozen Block C contract
        run: |
          node --check scripts/phase57-exit-v5-block-c-measure.mjs
          node --check scripts/phase57-exit-v4-20session-features.mjs
          node --test scripts/tests/phase57-exit-v5-dynamic-state.test.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('predict/research/phase57-exit-v5-block-c-unseen-v1.json'));
          const f=JSON.parse(fs.readFileSync('predict/research/phase57-exit-v5-dynamic-state-freeze-v1.json'));
          assert.equal(c.schemaId,'PHASE57_EXIT_V5_BLOCK_C_UNSEEN_V1');
          assert.equal(c.sessions.length,10);assert.equal(new Set(c.sessions.map(x=>x.sessionDate)).size,10);
          assert(c.sessions.every(x=>x.sessionDate<'2026-06-18'));
          assert.equal(f.status,'FROZEN_FOR_NEXT_UNSEEN_VALIDATION_NOT_PROMOTED');
          assert.equal(f.architecture,'CAUSAL_DYNAMIC_STATE_OVER_FROZEN_V4_CONTINUATION');
          assert.equal(f.stateMachine.observationHorizonBars,6);
          assert.equal(f.stateMachine.freeReturnThresholds,0);
          assert.equal(c.candidate.retuningAllowed,false);
          for(const v of Object.values(c.safety))assert.equal(v,false);
          console.log(JSON.stringify({status:'BLOCK_C_PREFLIGHT_PASS',sessions:10,candidate:f.candidateId,safety:'ALL_FALSE'}));
          NODE

  features:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        session: ['2026-06-04','2026-06-05','2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-06-12','2026-06-15','2026-06-16','2026-06-17']
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read-only pinned Frozen Hybrid source
        uses: actions/checkout@v4
        with:
          ref: 6c1aec0545fa6a77c5435e7cc864f1ea2d71fc26
          path: frozen-selector
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /predict/daytrade/phase57-selector-minimal-hybrid.js
            /predict/daytrade/phase57-selector-minimal-hybrid-model.js
            /predict/daytrade/phase57-p25-intraday-dynamic-universe.js
            /predict/daytrade/phase57-p25-jpx-opportunity-universe.js
            /predict/research/phase57-selector-minimal-hybrid-development-model.json
            /predict/research/phase57-selector-minimal-hybrid-development-freeze.json
            /predict/research/phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.json
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Reconstruct one frozen unseen session
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SESSION_FILTER: ${{ matrix.session }}
          SHARD_INDEX: 0
          SHARD_COUNT: 1
          DIAGNOSTIC_CONFIG: predict/research/phase57-exit-v5-block-c-unseen-v1.json
          NODE_OPTIONS: --max-old-space-size=6144
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/block-c-${SESSION_FILTER}-XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p artifacts
          for attempt in 1 2 3; do
            output="$scratch/attempt-$attempt"
            set +e
            OUTPUT_DIR="$output" timeout --signal=TERM --kill-after=30s 320m node scripts/phase57-exit-v4-20session-features.mjs
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then mv "$output" artifacts/phase57-exit-v5-block-c-features; exit 0; fi
            rm -rf "$output"
            if [ "$attempt" -eq 3 ]; then exit "$rc"; fi
            sleep $((attempt*90))
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase57-exit-v5-block-c-features-${{ matrix.session }}-${{ github.run_id }}
          path: artifacts/phase57-exit-v5-block-c-features/
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-exit-v5-block-c-features-*-${{ github.run_id }}
          path: artifacts/block-c-input
          merge-multiple: true
      - name: Download immutable frozen MSH candidate
        uses: actions/download-artifact@v4
        with:
          name: entry58-development-measurement-34292703804
          run-id: 34292703804
          github-token: ${{ github.token }}
          repository: Iam-2squared/ark-terminal
          path: artifacts/input/candidate
      - name: Download canonical pre-performance analog snapshot
        uses: actions/download-artifact@v4
        with:
          name: phase57-p24-9-oos-canonical-candidate
          run-id: 31785422471
          github-token: ${{ github.token }}
          repository: Iam-2squared/ark-terminal
          path: artifacts/input/analog
      - name: Measure frozen Dynamic v5 once
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DIAGNOSTIC_CONFIG: predict/research/phase57-exit-v5-block-c-unseen-v1.json
          INPUT_DIR: artifacts/block-c-input
          CANDIDATE_MODEL: artifacts/input/candidate/candidate-model.json
          OUTPUT_DIR: artifacts/phase57-exit-v5-block-c
        run: |
          set -euo pipefail
          test "$(find artifacts/block-c-input -type f -name '*.manifest.json' | wc -l)" -eq 10
          wanted=10ec0b89893823f9e2f7ba720db2d0fad8e76d642fe00f7b77d387ae6be6b12a
          found=''
          while IFS= read -r f; do
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$wanted" ]; then found="$f"; break; fi
          done < <(find artifacts/input/analog -type f -name '*.json' | sort)
          test -n "$found"
          ANALOG_SNAPSHOT="$found" node scripts/phase57-exit-v5-block-c-measure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-exit-v5-block-c-measurement-${{ github.run_id }}
          path: artifacts/phase57-exit-v5-block-c/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary market/model inputs
        if: always()
        run: rm -rf artifacts/block-c-input artifacts/input
