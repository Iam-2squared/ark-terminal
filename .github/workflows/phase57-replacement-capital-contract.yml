name: Phase57 Replacement Capital Preperformance Contract
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - scripts/phase57_replacement_capital.py
      - scripts/test_phase57_replacement_capital.py
      - docs/evidence/phase57-replacement-capital/PRECOMMIT.json
      - docs/evidence/phase57-replacement-capital/FEATURE_AUDIT.json
      - .github/workflows/phase57-replacement-capital-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase57-replacement-capital-contract-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preperformance:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pandas==2.2.3 matplotlib==3.10.8
      - name: Protocol, temporal, cash, valuation and evaluator isolation tests
        run: python -m unittest -q scripts.test_phase57_replacement_capital scripts.test_phase57_capital_exit_integrated scripts.test_phase57_cash_capital_r34 scripts.test_phase57_cash_portfolio_r37 scripts.test_phase57_development_integrated_v1
      - name: Zero-fit frozen inputs and R50-A preflight
        run: python -m scripts.phase57_replacement_capital --mode preflight --out /tmp/phase57-replacement-prefit.json
      - name: Pin exact tested SHA and Safety9
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          x=json.loads(pathlib.Path('/tmp/phase57-replacement-prefit.json').read_text())
          assert x['fits']==0 and x['newFundedPerformanceRead'] is False
          assert x['scoredSessions']==24 and x['candidateIds']==['RC_MAG_FLOOR','RC_PROB3_FLOOR']
          assert x['savedControlScores']==x['savedExitDecisions']=={
            'IMMEDIATE':819,'ALL_MATERIAL_R1_TEMPORAL_NESTED_OOF':795}
          assert len(x['safety'])==9 and not any(x['safety'].values())
          paths=['scripts/phase57_replacement_capital.py','scripts/test_phase57_replacement_capital.py',
                 '.github/workflows/phase57-replacement-capital-contract.yml',
                 'docs/evidence/phase57-replacement-capital/PRECOMMIT.json',
                 'docs/evidence/phase57-replacement-capital/FEATURE_AUDIT.json']
          pathlib.Path('/tmp/phase57-replacement-tested.json').write_text(json.dumps({
            'testedSha':os.environ['TESTED_SHA'],'filesSha256':{
              p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
            'protocolSha256':x['protocolSha256'],'fits':0,
            'newFundedPerformanceRead':False,'safety':x['safety']},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-replacement-capital-preperformance-${{ github.sha }}
          path: |
            /tmp/phase57-replacement-prefit.json
            /tmp/phase57-replacement-tested.json
          if-no-files-found: error
