name: Predict Tests

on:
  pull_request:
    paths:
      - "predict/**"
      - "discovery/**"
      - ".github/workflows/predict-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install prediction dependencies
        working-directory: predict
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --ignore-scripts
          fi

      - name: Run prediction tests
        working-directory: predict
        run: npm test

      - name: Run discovery tests
        working-directory: discovery
        run: npm test
