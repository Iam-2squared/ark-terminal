name: Phase57 Offline Parity
on:
  pull_request:
    paths:
      - 'scripts/*offline*'
      - 'scripts/lib/*offline*'
      - 'scripts/lib/phase57-parity-report.mjs'
      - 'scripts/lib/phase57-operational-robustness.mjs'
      - 'scripts/lib/phase57-integration-gates.mjs'
      - 'scripts/lib/phase57-source-observer.mjs'
      - 'scripts/phase57-source-diagnostic.mjs'
      - 'scripts/phase57-post-close-parity.mjs'
      - 'scripts/tests/phase57-integration-gates.test.mjs'
      - 'tools/phase57_source_capture.py'
      - 'tools/phase57_rss_raw.py'
      - 'tools/phase57_rss_finalization.py'
      - 'tools/test_phase57_rss_finalization.py'
      - 'tools/phase57_rss_finalized_bar_gate.py'
      - 'tools/test_phase57_rss_finalized_bar_gate.py'
      - 'tools/phase57_account_reconciliation.py'
      - 'tools/test_phase57_account_reconciliation.py'
      - 'tools/phase57_execution_dryrun_gate.py'
      - 'tools/test_phase57_execution_dryrun_gate.py'
      - 'tools/rss_chart_semantics.py'
      - 'tools/phase58_excel_5m_chart_export.py'
      - 'tools/test_phase58_excel_5m_chart_export.py'
      - 'tools/phase57_setup_rss_source.py'
      - 'tools/test_phase57_rss_raw.py'
      - 'tools/Setup-ArkSource.ps1'
      - 'tools/test_phase57_source_capture.py'
      - 'tools/Start-ArkParity.ps1'
      - 'tools/phase57-source-capture.example.json'
      - 'scripts/lib/phase57-frozen-main-engine.mjs'
      - 'scripts/phase57-frozen-main-runner.mjs'
      - 'scripts/tests/phase57-offline*'
      - 'scripts/tests/phase57-frozen-main-engine.test.mjs'
      - 'scripts/tests/phase57-operational-robustness.test.mjs'
      - 'tools/*phase57*offline*'
      - 'tools/phase57_generic_excel_reader.py'
      - 'tools/test_phase57_generic_excel_reader.py'
      - 'tools/phase57-parity-field-map.json'
      - 'tools/Start-ArkOfflineParity.ps1'
      - 'tools/templates/**'
      - 'predict/research/phase57-offline-parity/**'
      - '.github/workflows/phase57-offline-parity.yml'
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve hash-bound source bytes on Windows and Linux
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen reference and offline tests
        shell: bash
        run: node --test scripts/tests/*.test.mjs
      - name: Existing Phase58 RSS semantics regression
        run: |
          python -m pip install pytest
          python -m pytest tools/test_phase58_excel_5m_chart_export.py -q
      - name: RSS source, finalization, reconciliation, and locked execution tests
        shell: bash
        run: |
          PYTHONPATH=tools python -m unittest \
            tools.test_phase57_rss_finalization \
            tools.test_phase57_rss_finalized_bar_gate \
            tools.test_phase57_account_reconciliation \
            tools.test_phase57_execution_dryrun_gate \
            tools.test_phase57_rss_raw \
            tools.test_phase57_source_capture
      - name: Workbook failure tests
        run: |
          python tools/test_phase57_offline_excel_reader.py
          python tools/test_phase57_generic_excel_reader.py
          python tools/test_phase57_source_capture.py
          python tools/test_phase57_rss_raw.py
      - name: One-command Windows launcher (offline only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Start-ArkParity.ps1 -Mode OFFLINE_FIXTURE -OutputRoot '${{ runner.temp }}/ark-offline'
      - name: Windows RSS setup fixture gate (no Excel or market access)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Setup-ArkSource.ps1 -FixtureTest
      - name: Linux workbook transport
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tools/phase57_offline_excel_reader.py --output '${{ runner.temp }}/packet.json'
          node scripts/phase57-offline-workbook-check.mjs '${{ runner.temp }}/packet.json' '${{ runner.temp }}/report'
          python tools/phase57_offline_preflight.py --output '${{ runner.temp }}/report/preflight.json'
          node scripts/phase57-offline-local-gate.mjs '${{ runner.temp }}/report/local-gate'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-parity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/ark-offline
          if-no-files-found: ignore
