name: Phase57 P25 Evaluation Fallback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase57-p25-evaluation-fallback.yml"
  schedule:
    - cron: '15 9 * * 1-5'
    # One-time recovery retry: 2026-08-20 09:15 JST.
    - cron: '15 0 20 8 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: phase57-p25-evaluation-fallback
  cancel-in-progress: false

jobs:
  dispatch-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve JST evidence date
        shell: bash
        run: |
          set -euo pipefail
          echo "EVIDENCE_DATE=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Resolve latest immutable evidence date for recovery
        if: github.event_name == 'push' || github.event.schedule == '15 0 20 8 *'
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/p25-evidence-recovery >/dev/null
          cd /tmp/p25-evidence-recovery
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin automation/p25-evidence-data
          latest="$(git ls-tree -r --name-only FETCH_HEAD -- data/p25-evidence-lineage | sed -n 's#data/p25-evidence-lineage/\([0-9][0-9-]*\)-manifest.json#\1#p' | sort | tail -1)"
          if ! [[ "$latest" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "no immutable P25 evidence manifest available for recovery" >&2
            exit 1
          fi
          echo "EVIDENCE_DATE=$latest" >> "$GITHUB_ENV"

      - name: Dispatch lineage-pinned evaluator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "DISPATCHED_AT=$dispatched_at" >> "$GITHUB_ENV"
          gh workflow run phase57-p25-evidence-evaluate.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f evidence_date="$EVIDENCE_DATE"

      - name: Verify evaluator run was created
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            run_id="$(gh run list --repo "$GH_REPO" --workflow phase57-p25-evidence-evaluate.yml --event workflow_dispatch --limit 5 --json databaseId,createdAt --jq '[.[] | select(.createdAt >= env.DISPATCHED_AT)][0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              echo "verified evaluator workflow_dispatch run_id=$run_id evidence_date=$EVIDENCE_DATE"
              exit 0
            fi
            sleep 10
          done
          echo "evaluator dispatch returned but no workflow_dispatch run was observable" >&2
          exit 1

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Fallback only dispatches and verifies the existing immutable P25 evidence evaluator.'
          echo 'No broker, Excel, RSS order, MARKETSPEED, board, Tick, paper/live trading, promotion, production update, or fresh holdout action is enabled.'
