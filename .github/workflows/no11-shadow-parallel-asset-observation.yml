name: No11 Concurrent Shadow Source and Frozen Asset Audits

on:
  push:
    branches:
      - research/no12-prebuy-causal-runtime-20261011
    paths:
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_review_queue_from_actual_rss.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_actual_rss_review_queue.py
      - .github/workflows/no11-shadow-parallel-asset-observation.yml
  pull_request:
    paths:
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_parallel_original_inference_smoke.py
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_review_queue_from_actual_rss.py
      - research/no12-prebuy-causal-runtime-20261011/tests/test_no11_actual_rss_review_queue.py
      - .github/workflows/no11-shadow-parallel-asset-observation.yml

permissions:
  contents: read

jobs:
  offline-independent-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and audit-only self test, no frozen private files
        run: |
          python -B -c "import ast,pathlib;ast.parse(pathlib.Path('research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py').read_text())"
          python -B research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_frozen_asset_probe.py --offline-self-test
          python -B research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_original_inference_smoke.py --offline-self-test
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p test_no11_parallel_original_inference_smoke.py -v
          python -B -m unittest discover -s research/no12-prebuy-causal-runtime-20261011/tests -p test_no11_actual_rss_review_queue.py -v
      - name: Node syntax and fail-closed safety contract
        run: |
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_saved_chart_watch.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_operational_audits.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_partial_observed_shadow_rehearsal.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_partial_observed_shadow_rehearsal.test.mjs
      - name: Safety statement
        run: |
          echo "NO11_PARALLEL_AUDITS_OFFLINE_TESTS=PASS"
          echo "LIVE_RSS_ORIGINALS_TESTED=False"
          echo "ORDER_TRANSMISSION=False"

  windows-c50-diagnostic-parser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse additive diagnosed read-only collector (no Excel)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptFile = 'research/no12-prebuy-causal-runtime-20261011/windows/Probe-No11Chart50DiagnosedReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $scriptFile).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'C50_DIAGNOSTIC_POWERSHELL_PARSE_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptFile -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'C50_DIAGNOSTIC_SELFTEST_FAILED' }
          Write-Host 'NO11_C50_DIAGNOSTIC_OFFLINE_SELFTEST=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
          $oneShot = 'research/no12-prebuy-causal-runtime-20261011/windows/Run-No11TodayReferenceOneShotReadOnly.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $oneShot).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'ONE_SHOT_REFERENCE_POWERSHELL_PARSE_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $oneShot -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'ONE_SHOT_REFERENCE_SELFTEST_FAILED' }
          Write-Host 'NO11_ONESHOT_REFERENCE_OFFLINE_SELFTEST=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
