name: Phase57 Entry58 First Development Fit
on:
  workflow_dispatch:
  push:
    branches: [research/phase57-minimal-stateful-hybrid-entry]
    paths:
      - .github/workflows/phase57-entry-development-first-fit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: phase57-entry58-first-fit
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/phase57-minimal-stateful-entry.test.mjs scripts/tests/phase57-entry-development-fit.test.mjs scripts/tests/phase57-entry-development-measure.test.mjs
  features:
    needs: contracts
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only pinned Frozen Hybrid source
        uses: actions/checkout@v4
        with:
          ref: 6c1aec0545fa6a77c5435e7cc864f1ea2d71fc26
          path: frozen-selector
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /predict/daytrade/phase57-selector-minimal-hybrid.js
            /predict/daytrade/phase57-selector-minimal-hybrid-model.js
            /predict/daytrade/phase57-p25-intraday-dynamic-universe.js
            /predict/daytrade/phase57-p25-jpx-opportunity-universe.js
            /predict/research/phase57-selector-minimal-hybrid-development-model.json
            /predict/research/phase57-selector-minimal-hybrid-development-freeze.json
            /predict/research/phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download previously verified immutable admission
        uses: actions/download-artifact@v4
        with:
          name: capacity-v2-1-admission-summary-34189128681
          run-id: 34189128681
          github-token: ${{ github.token }}
          path: artifacts/input/admission-v21
      - name: Reconstruct only allocated dates and freeze features
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          SHARD_INDEX: ${{ matrix.shard }}
          NODE_OPTIONS: --max-old-space-size=5120
        run: node scripts/phase57-entry-development-features.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry58-features-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/development-features/
          if-no-files-found: error
          retention-days: 30
  measure:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: entry58-features-*-${{ github.run_id }}
          path: artifacts/development-input
          merge-multiple: true
      - name: Verify all58 feature fingerprints then label and fit
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: node scripts/phase57-entry-development-measure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry58-development-measurement-${{ github.run_id }}
          path: artifacts/development-measurement/
          if-no-files-found: error
          retention-days: 30
