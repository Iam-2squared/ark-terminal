      - research/no12-prebuy-causal-runtime-20261011/windows/Prepare-No11PreviousArchiveReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_weekly_oct28_pipeline_wiring.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_oct28_preopen_doctor.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct28_preopen_doctor.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_oct29_preopen_doctor.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_preopen_doctor.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11Oct29ReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_reference_oneshot.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Capture-No11SessionReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_session_reference.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_reference_fields_diagnostic.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_reference_fields_diagnostic.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_account_connection_diagnostic_readonly.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_account_connection_diagnostic_readonly.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Stage-No11Oct28ReadOnlyFiles.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_shadow_preflight_audit.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_preflight_audit.test.mjs
      - .github/workflows/no11-weekly-g1-readonly.yml
  pull_request:
    paths:
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_weekly_g1_refresh.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11WeeklyCandidateRefreshReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/windows/Prepare-No11WeeklyAfterCloseReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_weekly_g1_refresh.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Prepare-No11PreviousArchiveReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_weekly_oct28_pipeline_wiring.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_oct28_preopen_doctor.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct28_preopen_doctor.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_oct29_preopen_doctor.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_preopen_doctor.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Run-No11Oct29ReferenceOneShotReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_reference_oneshot.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Capture-No11SessionReferenceReadOnly.ps1
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_session_reference.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_reference_fields_diagnostic.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_reference_fields_diagnostic.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_account_connection_diagnostic_readonly.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_account_connection_diagnostic_readonly.test.mjs
      - research/no12-prebuy-causal-runtime-20261011/windows/Stage-No11Oct28ReadOnlyFiles.ps1
      - research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_shadow_preflight_audit.mjs
      - research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_preflight_audit.test.mjs
      - .github/workflows/no11-weekly-g1-readonly.yml

permissions:
  contents: read

jobs:
  weekly-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Weekly calendar and parallel no-Excel Shadow preflight audits
        run: |
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_parallel_shadow_preflight_audit.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_weekly_g1_refresh.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_weekly_oct28_pipeline_wiring.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_oct28_preopen_doctor.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_oct28_preopen_doctor.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_reference_fields_diagnostic.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_reference_fields_diagnostic.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_oct29_preopen_doctor.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_preopen_doctor.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_oct29_reference_oneshot.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_session_reference.test.mjs
          node --check research/no12-prebuy-causal-runtime-20261011/tools/no11_account_connection_diagnostic_readonly.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_account_connection_diagnostic_readonly.test.mjs
          node --test research/no12-prebuy-causal-runtime-20261011/tests/no11_parallel_shadow_preflight_audit.test.mjs

  weekly-windows:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse new PowerShell scripts and offline self-tests (NO EXCEL)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'research/no12-prebuy-causal-runtime-20261011/windows'
          foreach ($name in @('Run-No11WeeklyCandidateRefreshReadOnly.ps1','Prepare-No11WeeklyAfterCloseReadOnly.ps1','Prepare-No11PreviousArchiveReadOnly.ps1','Stage-No11Oct28ReadOnlyFiles.ps1','Run-No11Oct29ReferenceOneShotReadOnly.ps1','Capture-No11SessionReferenceReadOnly.ps1')) {
            $file = Join-Path $dir $name
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell parse failed: $name" }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Prepare-No11WeeklyAfterCloseReadOnly.ps1') -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Weekly orchestration offline self-test failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Run-No11WeeklyCandidateRefreshReadOnly.ps1') -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Weekly daily-collector offline self-test failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Prepare-No11PreviousArchiveReadOnly.ps1') -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Previous archive adapter offline self-test failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Stage-No11Oct28ReadOnlyFiles.ps1') -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Oct28 source updater self-test failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Run-No11Oct29ReferenceOneShotReadOnly.ps1') -OfflineSelfTest
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'Capture-No11SessionReferenceReadOnly.ps1') -OfflineSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Excel-bound reference collector parser/self-test failed' }
          if ($LASTEXITCODE -ne 0) { throw 'Oct29 reference collector offline self-test failed' }
          Write-Host 'NO11_WEEKLY_WINDOWS_OFFLINE_TESTS=PASS'
          Write-Host 'ORDER_TRANSMISSION=False'
