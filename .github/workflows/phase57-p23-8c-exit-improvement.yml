name: Phase57 P23.8C Exit Improvement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'predict/daytrade/phase57-p23-8c-exit-candidates.js'
      - 'predict/daytrade/run-phase57-p23-8c-exit-improvement-shard.mjs'
      - 'predict/tests/p23-8c-exit-candidates.test.mjs'
      - '.github/workflows/phase57-p23-8c-exit-improvement.yml'

permissions:
  contents: read

jobs:
  exit-improvement:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: exit-v2-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PHASE57_SHARD_COUNT: '3'
      PHASE57_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run P23.8C exit improvement shard
        run: node predict/daytrade/run-phase57-p23-8c-exit-improvement-shard.mjs

      - name: Verify P23.8C integrity and research-only safety
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const shardNumber = Number(process.env.PHASE57_SHARD_INDEX) + 1;
          const path = `artifacts/phase57-p23-8c-exit-improvement-shard-${shardNumber}.json`;
          if (!fs.existsSync(path)) throw new Error(`missing P23.8C artifact: ${path}`);
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const key of [
            'executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed',
            'liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed',
            'overnightHoldingAllowed','transmitted'
          ]) {
            if (data[key] !== false) throw new Error(`${key} must remain false`);
          }
          const policy = data.exitImprovementPolicy;
          if (!policy || policy.exactFrozenShard !== true) throw new Error('P23.8C runtime shard must match frozen shard');
          if (policy.exactFrozenCandidateUniverse !== true) throw new Error('P23.8C candidate universe mismatch');
          if (policy.entryThresholdsChanged !== false) throw new Error('entry thresholds must remain unchanged');
          if (policy.roundTripCostChanged !== false) throw new Error('round-trip cost must remain unchanged');
          if (policy.futureExtremaUsedForDecision !== false) throw new Error('future extrema must not drive decisions');
          if (policy.futureExtremaUsedForCandidateSelection !== false) throw new Error('future extrema must not select candidates');
          if (policy.finalUntouchedOosEdgeClaimAllowed !== false) throw new Error('P23.8C cannot claim fresh untouched OOS edge');
          if (policy.p23_8DiagnosticsInformedCandidateDesign !== true) throw new Error('P23.8C reuse contamination must be explicit');
          if (policy.reusedRecentDevelopmentWindow !== true) throw new Error('P23.8C reused-window limitation must be explicit');
          const nested = data.nestedStateMachine;
          if (!nested) throw new Error('nested state-machine evidence missing');
          if (nested.selectionIntegrity?.outerOutcomesUsedForConfigSelection !== false) throw new Error('outer outcomes used for selection');
          if (nested.interpretation?.finalUntouchedOosEdgeClaimAllowed !== false) throw new Error('nested result cannot claim final edge');
          const quality = data.entryExitQuality;
          if (!quality || quality.countReconciled !== true) throw new Error('P23.8C quality replay must reconcile exactly');
          if (quality.interpretation?.evaluationOnlyFutureExtrema !== true) throw new Error('future extrema must remain evaluation-only');
          if (quality.interpretation?.futureExtremaUsedForExitSelection !== false) throw new Error('future extrema leaked into exit selection');
          NODE

      - name: Upload P23.8C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase57-p23-8c-exit-improvement-shard-${{ matrix.shard }}
          path: artifacts/phase57-p23-8c-exit-improvement-shard-*.json
          if-no-files-found: error
