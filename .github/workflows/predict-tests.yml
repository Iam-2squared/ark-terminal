name: Predict Tests

on:
  pull_request:
    paths:
      - 'predict/**'
      - 'discovery/**'
      - 'tools/**'
      - 'scripts/offline/**'
      - 'scripts/run_offline_regression.py'
      - 'scripts/verify_phase57_development_preservation.py'
      - 'scripts/test_phase57_msh_entry_long_v1_development.py'
      - 'scripts/run_p25_data_driven_exit_paired.mjs'
      - 'scripts/reduce_p25_data_driven_exit_shards.mjs'
      - 'real-account-home.js'
      - 'service-worker.js'
      - '.github/workflows/predict-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies (not market data)
        run: python -m pip install fastapi pytest httpx numpy==2.3.5 scipy==1.17.0
      - name: Offline regression — kernel network disabled, no Project fit
        run: python scripts/run_offline_regression.py --output-dir "$RUNNER_TEMP/ark-offline-regression"
      - name: Verify original Development artifacts unchanged (hashes only)
        run: python scripts/verify_phase57_development_preservation.py
      - name: Upload offline regression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-${{ github.run_id }}
          retention-days: 30
          path: ${{ runner.temp }}/ark-offline-regression/
