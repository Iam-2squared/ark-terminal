name: Maintenance Archive Automatic Persistence

on:
  push:
    branches: [maintenance/archive-auto-persistence]
    paths:
      - 'tools/archive_automatic_persistence.mjs'
      - '.github/workflows/maintenance-archive-persistence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maintenance-archive-auto-persistence
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/archive-auto-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rewrite archived persistence workflows to manual-only
        run: node tools/archive_automatic_persistence.mjs
      - name: Verify archive policy
        run: node tools/archive_automatic_persistence.mjs --check
      - name: Commit maintenance rewrite
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'No workflow rewrite required.'
            exit 0
          fi
          git config user.name 'Ark Maintenance Bot'
          git config user.email 'ark-maintenance@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'maintenance: make legacy persistence manual-only'
          git push origin HEAD:maintenance/archive-auto-persistence
