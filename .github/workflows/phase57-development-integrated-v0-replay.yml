name: Phase57 Development Integrated v0 Finite Benchmark Replay
on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - docs/evidence/phase57-comprehensive-exit-v1/DEVELOPMENT_INTEGRATED_V0_LAUNCH.json

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-development-integrated-v0-replay
  cancel-in-progress: false

jobs:
  finite-development-replay:
    if: github.ref == 'refs/heads/research/phase57-long-only-cash-equity'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen CI and exact source, prior to measuring
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          p=pathlib.Path('docs/evidence/phase57-comprehensive-exit-v1/DEVELOPMENT_INTEGRATED_V0_LAUNCH.json')
          x=json.loads(p.read_text())
          assert x['executionSha']==os.environ['EXECUTION_SHA']
          assert x['protocolSha256']=='9b345b3e73214eea0c58caa9509ea0bff8dc6e3c57a9cff646a02566bf4d8fc0'
          assert x['entryFreezeSha']=='4878a1cc53430e816261dea0fb16aeb53b3c238d'
          assert x['runAttempt']==1 and x['variants']==6 and x['capacitySet']==[3,4,5]
          assert x['protectedOpens']==x['providerRequests']==0
          assert len(x['safety'])==9 and not any(x['safety'].values())
          for name,expected in x['testedSourceManifest'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,name
          url='https://api.github.com/repos/Iam-2squared/ark-terminal/actions/runs/'+str(x['requiredCiRunId'])
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                          'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=20) as response:
              run=json.load(response)
          assert run['name']=='Phase57 Development Integrated v0 Contract'
          assert run['head_sha']==x['testedSourceSha'] and run['conclusion']=='success'
          assert run['run_attempt']==1
          pathlib.Path('/tmp/phase57-integrated-v0-launch-receipt.json').write_text(json.dumps({
              'executionSha':x['executionSha'],'testedSourceSha':x['testedSourceSha'],
              'requiredCiRunId':x['requiredCiRunId'],'protocolSha256':x['protocolSha256'],
              'runAttempt':1,'variants':6,'expectedModelFits':0,'safety':x['safety']},sort_keys=True)+'\n')
          PY
      - name: Download independently frozen Entry source
        uses: actions/download-artifact@v4
        with:
          name: phase57-all-material-r1-afb38b7a5421ca4f6ff6d439bf89096236efd119
          run-id: 36099497597
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r1-frozen
      - name: Download terminal-hold benchmark source
        uses: actions/download-artifact@v4
        with:
          name: phase57-r50-result-36287943625
          run-id: 36287943625
          repository: Iam-2squared/ark-terminal
          github-token: ${{ github.token }}
          path: /tmp/phase57-r50-control
      - name: Finite six-variant replay A
        run: |
          python -m scripts.phase57_development_integrated_v0 \
            --benchmark-ledger /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-a.jsonl.gz \
            --benchmark-ledger-b /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-b.jsonl.gz \
            --r1-records /tmp/phase57-r1-frozen/all-material-r1/ci-run-a/entry-records.json.gz \
            --out /tmp/phase57-integrated-v0-run-a.json.gz
      - name: Independent byte-determinism replay B
        run: |
          python -m scripts.phase57_development_integrated_v0 \
            --benchmark-ledger /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-a.jsonl.gz \
            --benchmark-ledger-b /tmp/phase57-r50-control/R50_B_FAILED_RECOVERY-run-b.jsonl.gz \
            --r1-records /tmp/phase57-r1-frozen/all-material-r1/ci-run-a/entry-records.json.gz \
            --out /tmp/phase57-integrated-v0-run-b.json.gz
          cmp /tmp/phase57-integrated-v0-run-a.json.gz /tmp/phase57-integrated-v0-run-b.json.gz
          sha256sum /tmp/phase57-integrated-v0-run-a.json.gz /tmp/phase57-integrated-v0-run-b.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: phase57-development-integrated-v0-result
          path: |
            /tmp/phase57-integrated-v0-launch-receipt.json
            /tmp/phase57-integrated-v0-run-a.json.gz
            /tmp/phase57-integrated-v0-run-b.json.gz
          if-no-files-found: error
