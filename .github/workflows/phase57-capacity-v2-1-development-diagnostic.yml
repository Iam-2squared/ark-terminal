name: Capacity v2.1 Development gate diagnosis
on:
  push:
    branches: [research/phase57-selector-capacity-v2]
    paths: [.github/workflows/phase57-capacity-v2-1-development-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: capacity-v21-development-diagnostic-34189128681
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/research/phase57-selector-capacity-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: f3543b5a604d25442c28fc3cb475e89274400bd5
          path: frozen
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify source run provenance
        uses: actions/github-script@v7
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id:34189128681});
            if(run.head_sha !== 'f3543b5a604d25442c28fc3cb475e89274400bd5') throw new Error('SOURCE_SHA_MISMATCH');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:34189128681,per_page:100});
            const expected = ['capacity-v2-1-allocation-34189128681','capacity-v2-1-admission-summary-34189128681',...Array.from({length:6},(_,i)=>'capacity-v2-1-development-shard-'+i+'-34189128681')];
            for(const name of expected) {
              const matches=artifacts.filter(a=>a.name===name && !a.expired);
              if(matches.length!==1 || matches[0].workflow_run.head_sha!==run.head_sha) throw new Error('ARTIFACT_PROVENANCE_MISMATCH');
            }
      - name: Test recovery classification against frozen trainer
        run: |
          cp scripts/recover_phase57_capacity_v2_1_development.mjs frozen/scripts/
          cp predict/tests/phase57-capacity-v2-1-recovery.test.mjs frozen/predict/tests/
          cp scripts/diagnose_phase57_capacity_v2_1.mjs frozen/scripts/
          cp predict/tests/phase57-capacity-v2-1-diagnostic.test.mjs frozen/predict/tests/
          cd frozen
          node --test predict/tests/phase57-capacity-v2-1-recovery.test.mjs predict/tests/phase57-capacity-v2-1-diagnostic.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: 'capacity-v2-1-allocation-34189128681'
          path: frozen/artifacts/recovery-input/allocation
          run-id: 34189128681
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'capacity-v2-1-development-shard-*-34189128681'
          path: frozen/artifacts/recovery-input/shards
          run-id: 34189128681
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: 'capacity-v2-admission-summary-34153192882'
          path: frozen/artifacts/recovery-input/source-admission
          run-id: 34153192882
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: 'capacity-v2-1-admission-summary-34189128681'
          path: frozen/artifacts/recovery-input/fresh-admission
          run-id: 34189128681
          github-token: ${{ github.token }}
      - name: Diagnose frozen OOF candidates from verified checkpoints
        working-directory: frozen
        run: node scripts/diagnose_phase57_capacity_v2_1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-v2-1-development-diagnostic-${{ github.run_id }}
          path: frozen/artifacts/capacity-v2-1-development-diagnostic/
          if-no-files-found: error
          retention-days: 90

