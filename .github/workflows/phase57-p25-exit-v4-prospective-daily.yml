name: Phase57 P25 EXIT v4 Prospective Daily

on:
  workflow_run:
    workflows: ['Phase57 P25 Checkpointed Evaluation']
    types: [completed]
  schedule:
    - cron: '15 11 * * 1-5' # 20:15 JST fallback
  workflow_dispatch:
    inputs:
      evidence_date:
        description: 'Immutable evidence/session date YYYY-MM-DD; blank = latest persisted evidence date'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: phase57-p25-exit-v4-prospective-daily
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve latest immutable evidence date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.evidence_date }}
        run: |
          set -euo pipefail
          git fetch origin automation/p25-evidence-data:refs/remotes/origin/automation/p25-evidence-data
          if [ -n "${REQUESTED_DATE:-}" ]; then date="$REQUESTED_DATE"; else date="$(git ls-tree -r --name-only origin/automation/p25-evidence-data -- data/p25-evidence-lineage | sed -n 's#data/p25-evidence-lineage/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)-manifest.json#\1#p' | sort | tail -n1)"; fi
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          if [[ "$date" < "2026-09-01" ]]; then echo "EXIT v4 fresh performance is not eligible before 2026-09-01"; exit 0; fi
          echo "EVIDENCE_DATE=$date" >> "$GITHUB_ENV"
      - name: Skip if no fresh-eligible evidence date
        id: eligible
        shell: bash
        run: |
          if [ -n "${EVIDENCE_DATE:-}" ]; then echo 'yes=true' >> "$GITHUB_OUTPUT"; else echo 'yes=false' >> "$GITHUB_OUTPUT"; fi
      - name: Skip identical durable daily v4 result
        if: steps.eligible.outputs.yes == 'true'
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin automation/p25-exit-v4-data:refs/remotes/origin/automation/p25-exit-v4-data 2>/dev/null && git cat-file -e "origin/automation/p25-exit-v4-data:data/p25-exit-v4/prospective/${EVIDENCE_DATE}.json" 2>/dev/null; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Load exact lineage and all capture artifacts
        if: steps.eligible.outputs.yes == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/p25-day-data:refs/remotes/origin/automation/p25-day-data
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-manifest.json" > /tmp/p25-lineage.json
          git show "origin/automation/p25-evidence-data:data/p25-evidence-lineage/${EVIDENCE_DATE}-integrity.json" > /tmp/p25-integrity.json
          mkdir -p /tmp/p25-captures
          mapfile -t dates < <(node -e "const x=require('/tmp/p25-lineage.json'); for(const n of x.manifest?.nodes??[]) console.log(n.sessionDate)")
          test "${#dates[@]}" -gt 0
          for date in "${dates[@]}"; do git show "origin/automation/p25-day-data:data/p25-day-sessions/${date}.json" > "/tmp/p25-captures/${date}.json"; done
      - name: Build exact pinned pre-cutoff history pack
        if: steps.eligible.outputs.yes == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p24-canonical
          gh run download 31785422471 --repo "$GH_REPO" --name phase57-p24-9-oos-canonical-candidate --dir /tmp/p24-canonical
          snapshot="$(find /tmp/p24-canonical -type f -name 'phase57-p24-9-oos-byte-snapshot.json' -print -quit)"; test -n "$snapshot"
          node scripts/build_p25_pinned_history_pack.mjs --snapshot "$snapshot" --output /tmp/p25-history.json
      - name: Run frozen DYNAMIC_50 Entry plus EXIT v4 challenger
        if: steps.eligible.outputs.yes == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run_p25_exit_v4_prospective_replay.mjs --history-pack /tmp/p25-history.json --capture-dir /tmp/p25-captures --integrity-ledger /tmp/p25-integrity.json --lineage-manifest /tmp/p25-lineage.json --session-date "$EVIDENCE_DATE" --output /tmp/p25-exit-v4-daily.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/p25-exit-v4-daily.json','utf8'));
          if(x?.result?.sessionDate!==process.env.EVIDENCE_DATE)throw new Error('EXIT v4 daily session mismatch');
          if(x?.result?.classification?.freshEligible!==true)throw new Error('EXIT v4 non-fresh-eligible session');
          if(x?.result?.methodology?.august31UsedForV4PerformanceClaim!==false)throw new Error('8/31 contamination');
          for(const k of ['executionAllowed','brokerWriteAllowed','excelOrderWriteAllowed','rssOrderFunctionAllowed','liveTradingAllowed','paperTradingAllowed','automaticPromotionAllowed','productionUpdateAllowed','transmitted','freshHoldoutConsumed'])if(x.safety?.[k]!==false)throw new Error(`unsafe ${k}`);
          NODE
      - name: Persist append-only daily EXIT v4 result
        if: steps.eligible.outputs.yes == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ark EXIT v4 Prospective Bot'; git config user.email 'ark-exit-v4-prospective@users.noreply.github.com'
          git fetch origin automation/p25-exit-v4-data:refs/remotes/origin/automation/p25-exit-v4-data || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/p25-exit-v4-data; then git switch -C automation/p25-exit-v4-data origin/automation/p25-exit-v4-data; else git switch --orphan automation/p25-exit-v4-data; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p data/p25-exit-v4/prospective; target="data/p25-exit-v4/prospective/${EVIDENCE_DATE}.json"; test ! -e "$target"; cp /tmp/p25-exit-v4-daily.json "$target"
          git add "$target" && git commit -m "Persist EXIT v4 prospective $EVIDENCE_DATE" && git push origin HEAD:automation/p25-exit-v4-data
      - uses: actions/upload-artifact@v4
        if: steps.eligible.outputs.yes == 'true' && steps.existing.outputs.exists != 'true'
        with:
          name: phase57-p25-exit-v4-prospective-${{ env.EVIDENCE_DATE }}
          path: /tmp/p25-exit-v4-daily.json
          retention-days: 90
      - name: Safety boundary
        if: always()
        run: echo 'EXIT v4 research challenger only; frozen Entry, append-only persistence, no broker/RSS/Excel/order/live/paper execution, promotion, production update, or result-based retuning.'
