name: Phase57 EXIT Block A Unseen Validation

on:
  pull_request:
    branches: [research/phase57-minimal-stateful-hybrid-entry]
    paths:
      - .github/workflows/phase57-exit-block-a.yml
      - scripts/phase57-exit-v4-20session-features.mjs
      - scripts/phase57-exit-v4-20session-measure.mjs
      - scripts/phase57-exit-block-a-analyze.mjs
      - scripts/tests/phase57-exit-block-a-contract.test.mjs
      - predict/research/phase57-exit-block-a-unseen-validation-v1.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase57-exit-block-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.number == 581 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/phase57-exit-v4-hybrid-msh-large-scale') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/phase57-exit-v4-hybrid-msh-large-scale')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify frozen unseen allocation and contracts
        run: |
          node --test scripts/tests/phase57-exit-block-a-contract.test.mjs
          node --check scripts/phase57-exit-v4-20session-features.mjs
          node --check scripts/phase57-exit-v4-20session-measure.mjs
          node --check scripts/phase57-exit-block-a-analyze.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('predict/research/phase57-exit-block-a-unseen-validation-v1.json'));
          const m=JSON.parse(fs.readFileSync('predict/research/phase57-exit-v4-stage2-allocation-manifest-v1.json'));
          const dates=c.sessions.map(x=>x.sessionDate),eligible=m.sessions.filter(x=>x.sessionDate>='2026-06-18'&&x.sessionDate<='2026-08-12'&&['UNTOUCHED_OOS_SEALED','FUTURE_RESERVE_SEALED'].includes(x.allocationClass)).map(x=>x.sessionDate).slice(0,30);
          assert.deepEqual(dates,eligible,'RESULT_BLIND_CHRONOLOGICAL_SELECTION_CHANGED');
          assert.equal(new Set([...dates,...c.exposed20]).size,50,'EXPOSED20_OVERLAP');
          for(const v of Object.values(c.safety))assert.equal(v,false);
          console.log(JSON.stringify({status:'BLOCK_A_PREFLIGHT_PASS',first:dates[0],last:dates.at(-1),sessions:dates.length}));
          NODE

  features:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        session:
          - '2026-06-18'
          - '2026-06-19'
          - '2026-06-22'
          - '2026-06-23'
          - '2026-06-24'
          - '2026-06-25'
          - '2026-06-26'
          - '2026-06-29'
          - '2026-06-30'
          - '2026-07-01'
          - '2026-07-02'
          - '2026-07-03'
          - '2026-07-06'
          - '2026-07-07'
          - '2026-07-08'
          - '2026-07-09'
          - '2026-07-10'
          - '2026-07-13'
          - '2026-07-14'
          - '2026-07-15'
          - '2026-07-16'
          - '2026-07-17'
          - '2026-07-21'
          - '2026-07-22'
          - '2026-07-23'
          - '2026-07-24'
          - '2026-07-27'
          - '2026-07-28'
          - '2026-07-29'
          - '2026-07-30'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read-only pinned Frozen Hybrid source
        uses: actions/checkout@v4
        with:
          ref: 6c1aec0545fa6a77c5435e7cc864f1ea2d71fc26
          path: frozen-selector
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /predict/daytrade/phase57-selector-minimal-hybrid.js
            /predict/daytrade/phase57-selector-minimal-hybrid-model.js
            /predict/daytrade/phase57-p25-intraday-dynamic-universe.js
            /predict/daytrade/phase57-p25-jpx-opportunity-universe.js
            /predict/research/phase57-selector-minimal-hybrid-development-model.json
            /predict/research/phase57-selector-minimal-hybrid-development-freeze.json
            /predict/research/phase57-selector-minimal-hybrid-phase-a-amendment-v1.1.json
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Reconstruct one frozen unseen session
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          DIAGNOSTIC_CONFIG: predict/research/phase57-exit-block-a-unseen-validation-v1.json
          SESSION_FILTER: ${{ matrix.session }}
          SHARD_INDEX: 0
          SHARD_COUNT: 1
          NODE_OPTIONS: --max-old-space-size=6144
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/block-a-${SESSION_FILTER}-XXXXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          for attempt in 1 2 3 4; do
            output="$scratch/attempt-$attempt"
            set +e
            OUTPUT_DIR="$output" timeout --signal=TERM --kill-after=30s 110m node scripts/phase57-exit-v4-20session-features.mjs
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              mv "$output" artifacts-block-a
              exit 0
            fi
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$attempt" -eq 4 ]; then exit "$rc"; fi
            rm -rf "$output"
            sleep $((attempt*60))
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: phase57-exit-block-a-features-${{ matrix.session }}-${{ github.run_id }}
          path: artifacts-block-a/
          if-no-files-found: error
          retention-days: 7

  measure:
    needs: features
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase57-exit-block-a-features-*-${{ github.run_id }}
          path: artifacts/block-a-input
          merge-multiple: true
      - name: Download immutable frozen MSH candidate
        uses: actions/download-artifact@v4
        with:
          name: entry58-development-measurement-34292703804
          run-id: 34292703804
          github-token: ${{ github.token }}
          repository: Iam-2squared/ark-terminal
          path: artifacts/input/candidate
      - name: Download canonical pre-performance analog snapshot
        uses: actions/download-artifact@v4
        with:
          name: phase57-p24-9-oos-canonical-candidate
          run-id: 31785422471
          github-token: ${{ github.token }}
          repository: Iam-2squared/ark-terminal
          path: artifacts/input/analog
      - name: Resolve frozen analog and run complete Block A
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          DIAGNOSTIC_CONFIG: predict/research/phase57-exit-block-a-unseen-validation-v1.json
          INPUT_DIR: artifacts/block-a-input
          CANDIDATE_MODEL: artifacts/input/candidate/candidate-model.json
          OUTPUT_DIR: artifacts/phase57-exit-block-a-base
        run: |
          set -euo pipefail
          wanted=10ec0b89893823f9e2f7ba720db2d0fad8e76d642fe00f7b77d387ae6be6b12a
          found=''
          while IFS= read -r f; do
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$wanted" ]; then found="$f"; break; fi
          done < <(find artifacts/input/analog -type f -name '*.json' | sort)
          test -n "$found"
          ANALOG_SNAPSHOT="$found" node scripts/phase57-exit-v4-20session-measure.mjs
          MEASUREMENT_DIR=artifacts/phase57-exit-block-a-base OUTPUT_DIR=artifacts/phase57-exit-block-a-report node scripts/phase57-exit-block-a-analyze.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase57-exit-block-a-measurement-${{ github.run_id }}
          path: |
            artifacts/phase57-exit-block-a-base/report.json
            artifacts/phase57-exit-block-a-base/report.json.sha256
            artifacts/phase57-exit-block-a-report/
          if-no-files-found: warn
          retention-days: 14
