name: Phase57 Cancel Superseded Research Runs

on:
  push:
    branches: [research/phase57-long-only-cash-equity]
    paths:
      - .github/workflows/phase57-cancel-obsolete-l1-retry.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [34957199976, 34957200060]) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
              } catch (error) {
                if (error.status !== 409) throw error;
              }
            }
